<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MJE Service Hub</title>
<link rel="icon" type="image/png" href="../shared/mje-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<link rel="stylesheet" href="../shared/mje.css?v=20261002">
<style>
/* Service Hub only — everything shared with the Safety Hub is in ../shared/mje.css */
.rolepill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:1px 6px;color:#fff}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#4ade80}
.sync.off::before{background:#fbbf24}
.sync.err::before{background:#f87171}
.viewas{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.viewas .grow{flex:1}
.todo{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.todo b{color:var(--text)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
table.setup{min-width:0}
main.tech{max-width:640px}
.list li > .pill{align-self:flex-start}
.kpi.k-cust{--kc:var(--muted)}
table.roles input,table.roles select{width:100%;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text)}
table.roles tr.dirty td{background:var(--warn-bg)}
table.roles tbody tr{cursor:default}
.banner a{color:inherit}
table.qlines{min-width:980px}
table.qlines td{vertical-align:middle;padding:6px 8px}
table.qlines tbody tr{cursor:default}
table.qlines input,table.qlines select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 7px;color:var(--text)}
table.qlines select[data-f=LabourRateCode]{margin-bottom:4px}
table.qlines input.num{text-align:right;width:96px}
table.qlines input.unit{width:72px}
table.qlines select[data-f=LineKind]{width:92px}
table.qlines select[data-f=TaxCode]{width:78px}
table.qlines tr.txt td,table tr.txt td{background:var(--grey-bg)}
.btn.sm{padding:3px 8px;font-size:12px}
.rowbtns{display:inline-flex;gap:3px;white-space:nowrap}
.qtotals{margin:12px 0 0 auto;max-width:380px}
.qtotals div{display:flex;justify-content:space-between;gap:16px;padding:4px 2px}
.qtotals .g{border-top:2px solid var(--text);font-weight:700;font-size:16px;margin-top:4px;padding-top:8px}
label.chk span{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px}
label.chk input{width:auto}
#printArea{display:none}
@media print{ body > *:not(#printArea){display:none !important} #printArea{display:block} body{background:#fff} @page{size:A4;margin:12mm} }
.gpscell{justify-content:flex-end}.gpscell .btn{padding:8px 12px;white-space:nowrap}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}.crumbs a{color:inherit}
tr[data-go],tr[data-edit]{cursor:pointer}
.kv a{color:var(--info)}
.list li > .mono{text-align:right}
nav button{white-space:nowrap}
a.btn{color:inherit;text-decoration:none;display:inline-block}
@media (max-width:720px){ .who .nm{display:none} }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="chip"><img src="../shared/mje-logo.png" alt="MJ Electrical"></span><span id="apps"></span></div>
  <nav id="nav" hidden></nav>
  <div class="who" id="who"></div>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<dialog id="dlg"><form method="dialog" id="frm" novalidate>
  <div class="dh"><span class="dlg-logo"><img id="dlgLogo" alt="MJ Electrical"></span><div class="dt"><span class="kind" id="dlgKind"></span><h2 id="dlgTitle"></h2></div><button type="button" class="btn" id="dlgX" aria-label="Close">✕</button></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><button type="button" class="btn" id="dlgCancel">Cancel</button><button type="submit" class="btn primary" id="dlgSave">Save</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script src="../shared/mje-config.js?v=20261002"></script>
<script src="../shared/mje-core.js?v=20261002"></script>
<script>
/* =====================================================================
   MJE Service Hub — quote → job → schedule → field completion → invoice
   The Microsoft 365 connection (CLIENT_ID, TENANT_ID, SP_HOST, SITE_PATH)
   is in ../shared/mje-config.js, shared with the Safety Hub.
   This repo is public: no customer names, register data or seed data here.
   ===================================================================== */
const CONFIG = {
  ...MJE_TENANT,
  LISTS: {
    customers:"MJE_Customers", sites:"MJE_Sites", assets:"MJE_CustomerAssets",
    quotes:"MJE_Quotes", qlines:"MJE_QuoteLines",
    jobs:"MJE_Jobs", assign:"MJE_JobAssignments", time:"MJE_TimeEntries", mat:"MJE_JobMaterials", notes:"MJE_JobNotes",
    comp:"MJE_JobCompletions", chk:"MJE_Checklists", resp:"MJE_ChecklistResponses", files:"MJE_JobFiles",
    inv:"MJE_Invoices", iline:"MJE_InvoiceLines", pay:"MJE_InvoicePayments", sync:"MJE_MyobSync",
    rates:"MJE_LabourRates", settings:"MJE_ServiceSettings", numbers:"MJE_ServiceNumbers",
    // Safety Hub lists the Service Hub reads
    staff:"MJE_Staff", trn:"MJE_Training", course:"MJE_Courses", tt:"MJE_TestTag", risk:"MJE_Risks", inc:"MJE_Incidents",
  },
  // Sign-in asks only for what the Safety Hub already has; Mail.Send.Shared is requested when a quote/invoice is first emailed.
  SCOPES: ["Sites.ReadWrite.All", "User.Read"],
};
const DEMO = CONFIG.CLIENT_ID.startsWith("<<");

const LIST_INFO = {
  customers:"Customers (billing entities)", sites:"Service sites", assets:"Customer equipment", quotes:"Quotes", qlines:"Quote lines",
  jobs:"Jobs", assign:"Technician bookings", time:"Time entries", mat:"Job materials", notes:"Job notes & photos", comp:"Job completions",
  chk:"Checklist templates", resp:"Checklist answers", files:"Job files library", inv:"Invoices", iline:"Invoice lines", pay:"Payments",
  sync:"MYOB sync queue", rates:"Labour rates", settings:"Service settings", numbers:"Number counters",
  staff:"Staff (Safety Hub)", trn:"Training records (Safety Hub)", course:"Courses (Safety Hub)", tt:"Test & tag (Safety Hub)",
  risk:"Risk registers (Safety Hub)", inc:"Incidents (Safety Hub)" };
const SAFETY_KEYS = ["staff","trn","course","tt","risk","inc"];

/* ---------------- screens & who sees them ---------------- */
const OFFICE = ["Admin","Office"], TECH = ["Technician"];
const CUST_LOAD = ["customers","sites","assets","jobs","quotes","sync","settings","comp","time","assign"];
const ROUTES = {
  dash:      { label:"Dashboard",         roles:OFFICE, lists:["jobs","assign","quotes","inv","comp","time","mat","rates"], load:["jobs","assign","quotes","inv","comp","time","mat","rates"], step:"Dashboard — jobs by status, today's schedule, unscheduled jobs, quotes awaiting reply, completed-not-invoiced value, overdue jobs" },
  customers: { label:"Customers & Sites", roles:OFFICE, lists:["customers","sites","assets"], load:CUST_LOAD, step:"Customers & Sites — search, create and edit; each site shows its equipment and full job history" },
  quotes:    { label:"Quotes",            roles:OFFICE, lists:["quotes","qlines","rates","numbers"], load:["quotes","qlines","rates","settings","customers","sites","jobs"], step:"Quotes — labour and parts lines, GST, print/PDF, email, follow-up list, Convert to Job" },
  jobs:      { label:"Job Centre",        roles:OFFICE, lists:["jobs","assign","time","mat","notes","comp","numbers"], step:"Job Centre — filterable job grid and the job page (Details, Schedule, Time, Materials, Notes & Photos, Checklists, Safety, Invoice)" },
  schedule:  { label:"Scheduler",         roles:OFFICE, lists:["jobs","assign","staff"],         step:"Scheduler — one row per technician, day and week views, drag and drop, clash warnings" },
  invoices:  { label:"Invoicing",         roles:OFFICE, lists:["inv","iline","pay","sync","numbers"], step:"Invoicing — invoices from completed jobs, deposits, progress, credit notes, payments, Send to MYOB" },
  settings:  { label:"Settings",          roles:OFFICE, lists:["settings","rates","numbers","chk"], load:["settings","rates"], step:"" },
  site:      { label:"Site",              roles:OFFICE, nav:false, lists:["customers","sites","assets"], load:CUST_LOAD, step:"" },
  my:        { label:"My Jobs",           roles:TECH,   lists:["jobs","assign","time","mat","notes","comp","resp"], step:"My Jobs — today and upcoming, site map link, timer with GPS, materials, notes, photos, checklists, signature, mark complete — works offline" },
};

/* ---------------- state ---------------- */
const S = { have:new Set(), staff:[], me:null, role:"", roleSource:"", viewAs:"", route:"", param:"" };

/* ---------------- role detection ----------------
   The role only decides which screens open. SharePoint permissions still decide
   what each person can change (Owners / MJE Office / staff in Visitors).        */
function resolveRole(){
  const email = String(account?.username || "").trim().toLowerCase();
  S.me = email ? S.staff.find(s => String(s.Email || "").trim().toLowerCase() === email) || null : null;
  if (DEMO){ const r = new URLSearchParams(location.search).get("role"); return [["Admin","Office","Technician","None"].includes(r) ? r : "Admin", "demo"]; }
  if (S.me && ["Admin","Office","Technician","None"].includes(S.me.HubRole)) return [S.me.HubRole, "staff"];
  // First run: nobody has an office role yet, so let whoever signs in set things up
  if (!S.staff.some(s => OFFICE.includes(s.HubRole))) return ["Admin", "setup"];
  return ["None", S.me ? "norole" : "nomatch"];
}
const effRole = () => S.viewAs ? "Technician" : S.role;
const techName = () => S.viewAs || S.me?.Title || account?.name || "";
const technicians = () => S.staff.filter(s => s.StaffStatus !== "Left" && (s.HubRole === "Technician" || s.Department === "Service"))
  .map(s => s.Title).sort((a,b) => a.localeCompare(b));

/* ---------------- data: each list is read once, then kept until Refresh ---------------- */
const D = {}, LOADING = {};
async function need(keys){
  await Promise.all(keys.map(k => {
    if (D[k]) return null;
    if (DEMO || !S.have.has(CONFIG.LISTS[k])) { D[k] = []; return null; }       // not set up yet: treat as empty
    return LOADING[k] ||= listItems(CONFIG.LISTS[k]).then(r => { D[k] = r; delete LOADING[k]; }, e => { delete LOADING[k]; throw e; });
  }));
}
function refreshData(){ Object.keys(D).forEach(k => delete D[k]); statusSyncDone = false; render(); }

/* ---------------- job rules (every screen uses these) ----------------
   Technicians never edit MJE_Jobs. A job's status is worked out from what has happened:
   valid completion record -> Completed; any time logged -> In Progress; any booking -> Scheduled; else New.
   On Hold, Invoiced and Cancelled are set by the office and always win.                              */
const JOB_STATUS = ["New","Scheduled","In Progress","On Hold","Completed","Invoiced","Cancelled"];
const OFFICE_STATUS = ["On Hold","Invoiced","Cancelled"];
const CLOSED = ["Completed","Invoiced","Cancelled"];
const PRIORITIES = ["Urgent","High","Normal","Low"];
const priRank = p => { const i = PRIORITIES.indexOf(p); return i < 0 ? 2 : i; };
const byUrgency = (a, b) => priRank(a.Priority) - priRank(b.Priority) || (a.DueDate || "9999").localeCompare(b.DueDate || "9999") || String(a.Title).localeCompare(String(b.Title), undefined, { numeric:true });
// A completion counts once it has a signature (or signed-by name) or a "customer not present" reason, and the office hasn't returned it
const validCompletion = c => c.ReviewStatus !== "Returned" && (!!(c.SignatureFile || c.SignedByName) || (c.CustomerNotPresent === "Yes" && !!c.NotPresentReason));
function jobFacts(){
  const f = new Map(), get = n => { if (!f.has(n)) f.set(n, { comp:null, time:false, booked:false }); return f.get(n); };
  (D.comp || []).filter(validCompletion).forEach(c => { const x = get(c.Title); if (!x.comp || (c.CompletedDate || "") > (x.comp.CompletedDate || "")) x.comp = c; });
  (D.time || []).forEach(t => { if (t.JobNo) get(t.JobNo).time = true; });
  (D.assign || []).forEach(a => { if (a.AssignStatus !== "Cancelled") get(a.Title).booked = true; });
  return f;
}
function jobState(j, facts){
  if (OFFICE_STATUS.includes(j.JobStatus)) return j.JobStatus;
  const x = facts.get(j.Title) || {};
  return x.comp ? "Completed" : x.time ? "In Progress" : x.booked ? "Scheduled" : "New";
}
// Office/Admin only: write the worked-out status back to MJE_Jobs so SharePoint views and exports stay true
let statusSyncDone = false;
async function syncJobStatuses(){
  if (DEMO || statusSyncDone || S.viewAs || !OFFICE.includes(S.role) || !D.jobs || !D.comp || !D.time || !D.assign) return;
  statusSyncDone = true;
  const facts = jobFacts();
  for (const j of D.jobs.filter(j => jobState(j, facts) !== (j.JobStatus || "New")).slice(0, 50)){
    const st = jobState(j, facts), f = { JobStatus: st };
    if (st === "Completed" && !j.CompletedDate) f.CompletedDate = facts.get(j.Title)?.comp?.CompletedDate || TODAY;
    if (st !== "Completed" && st !== "Invoiced" && j.CompletedDate) f.CompletedDate = null;
    try { await saveListItem(CONFIG.LISTS.jobs, j.id, f); Object.assign(j, f); }
    catch(e){ console.warn("Couldn't update the status of", j.Title, e.message); if (isForbidden(e)) break; }
  }
}
// Work done but not yet invoiced (ex GST). Fixed-price jobs: quoted amount; do & charge: billable time x rate + billable materials.
// Deposit and progress invoices already raised for the job are taken off.
const rateFor = code => (D.rates || []).find(r => r.RateCode && r.RateCode === code);
function unbilledValue(j){
  const no = j.Title;
  const billed = (D.inv || []).filter(i => i.JobNo === no && i.InvoiceStatus !== "Void" && ["Deposit","Progress"].includes(i.InvoiceType)).reduce((a, i) => a + num(i.SubtotalEx), 0);
  if (j.BillingBasis === "Fixed price (quoted)") return { value: Math.max(0, num(j.QuotedAmountEx) - billed), noRate: 0 };
  let value = 0, noRate = 0;
  (D.time || []).filter(t => t.JobNo === no && t.Billable !== "No" && !t.InvoiceNo).forEach(t => {
    const r = rateFor(t.LabourRateCode), h = num(t.BillableHours ?? t.ActualHours);
    if (!r) { noRate += h; return; }
    value += (!r.RateUnit || r.RateUnit === "Hour") ? h * num(r.RateEx) : num(r.RateEx);
  });
  (D.mat || []).filter(m => m.Title === no && m.Billable !== "No" && !m.InvoiceNo).forEach(m => value += num(m.Qty) * num(m.UnitSell));
  return { value: Math.max(0, value - billed), noRate };
}
const JOB_PILL = { New:"p-info", Scheduled:"p-grey", "In Progress":"p-warn", "On Hold":"p-bad", Completed:"p-ok", Invoiced:"p-grey", Cancelled:"p-grey" };
const jobPill = s => s ? `<span class="pill ${JOB_PILL[s] || "p-grey"}">${esc(s)}</span>` : "";
const PRI_PILL = { Urgent:"p-crit", High:"p-bad", Normal:"p-grey", Low:"p-grey" };
const priPill = p => p ? `<span class="pill ${PRI_PILL[p] || "p-grey"}">${esc(p)}</span>` : "";

/* ---------------- routing: #/route/param ---------------- */
function defaultRoute(){ const r = effRole(); return r === "Technician" ? "my" : OFFICE.includes(r) ? "dash" : ""; }
function readHash(){
  const [route = "", ...rest] = location.hash.replace(/^#\/?/, "").split("/");
  const ok = ROUTES[route] && ROUTES[route].roles.includes(effRole());
  S.route = ok ? route : defaultRoute(); S.param = ok ? decodeURIComponent(rest.join("/")) : "";
}
const go = (route, param = "") => { location.hash = "#/" + route + (param ? "/" + encodeURIComponent(param) : ""); };
window.addEventListener("hashchange", () => { readHash(); render(); window.scrollTo({ top:0 }); });

/* ---------------- header ---------------- */
function renderHeader(){
  const nav = $("#nav"), r = effRole();
  const items = Object.entries(ROUTES).filter(([, v]) => v.roles.includes(r) && v.nav !== false);
  const lit = S.route === "site" ? "customers" : S.route;
  nav.innerHTML = items.map(([k, v]) => `<button data-route="${k}" class="${k === lit ? "on" : ""}">${v.label}</button>`).join("");
  nav.hidden = !items.length;
  nav.querySelectorAll("[data-route]").forEach(b => b.onclick = () => go(b.dataset.route));
  $("#who").innerHTML = `<span class="sync" id="sync"></span><span class="nm">${esc(account?.name || account?.username || "")}</span>`
    + (S.role ? `<span class="rolepill" title="Service Hub role${S.roleSource === "setup" ? " (first-run set-up)" : ""}">${esc(S.viewAs ? "Tech view" : S.role)}</span>` : "")
    + (DEMO ? "" : `<button id="so">Sign out</button>`);
  if ($("#so")) $("#so").onclick = signOut;
  showSync();
}
// Online / offline indicator. The technician view's write queue (built with My Jobs) adds its count here.
const SYNC = { waiting:0, error:"" };
function showSync(){
  const el = $("#sync"); if (!el) return;
  const on = navigator.onLine;
  el.className = "sync" + (SYNC.error ? " err" : on ? "" : " off");
  el.textContent = SYNC.error ? "Sync problem" : on ? (SYNC.waiting ? `Syncing ${SYNC.waiting}` : "Online") : `Offline${SYNC.waiting ? " · " + SYNC.waiting + " waiting" : ""}`;
  el.title = SYNC.error || (on ? "Connected — changes save straight to SharePoint" : "No connection — changes are kept on this device and sent when you're back online");
}
window.addEventListener("online", showSync); window.addEventListener("offline", showSync);

/* ---------------- views ---------------- */
const missingFor = keys => keys.filter(k => !S.have.has(CONFIG.LISTS[k]));
function notSetUp(keys){
  const m = missingFor(keys); if (!m.length) return "";
  return `<div class="banner err">These SharePoint lists aren't set up yet: <b>${m.map(k => esc(CONFIG.LISTS[k])).join(", ")}</b>.<br>
    Run the setup kit (Setup-MJE-Hub.ps1, steps 10–13) on ${esc(CONFIG.SP_HOST + CONFIG.SITE_PATH)}, then refresh this page.</div>`;
}
function render(){
  renderHeader();
  $("#main").className = effRole() === "Technician" ? "tech" : "";
  let banner = DEMO ? `<div class="banner">Demo mode — nothing is read from or saved to SharePoint. Add <code>?role=Office</code> or <code>?role=Technician</code> to the address to try other roles.</div>` : "";
  if (S.roleSource === "setup" && !S.viewAs) banner += `<div class="banner">First-run set-up: nobody has an Office or Admin role yet, so you have the Admin view. Go to <a href="#/settings/roles"><b>Settings → Staff &amp; roles</b></a>, set your own role to <b>Admin</b>, then set everyone else's.</div>`;
  if (S.viewAs) banner += `<div class="banner viewas"><span>Showing the technician view for <b>${esc(S.viewAs)}</b>. SharePoint still saves as you.</span><span class="grow"></span><button class="btn" id="backOffice">← Back to office view</button></div>`;
  const keys = ROUTES[S.route]?.load;
  if (keys && keys.some(k => !D[k])){
    const route = S.route;
    $("#main").innerHTML = banner + `<div class="empty">Loading…</div>`;
    need(keys).then(() => { if (S.route === route) render(); })
      .catch(e => { $("#main").innerHTML = banner + `<div class="banner err">${isForbidden(e) ? "You don't have access to some of the Service Hub lists. Ask an MJE site owner to add you to the MJE Office group." : "Couldn't load data from SharePoint: " + esc(e.message)}</div>`; });
    return;
  }
  const view = { dash:viewDash, customers:viewCustomers, site:viewSite, quotes:viewQuotes, jobs:viewTodo, schedule:viewTodo, invoices:viewTodo, settings:viewSettings, my:viewMy }[S.route] || viewNoAccess;
  $("#main").innerHTML = banner + view();
  if ($("#backOffice")) $("#backOffice").onclick = () => { S.viewAs = ""; go("dash"); };
  bindView();
  if (S.route === "dash") syncJobStatuses();
}
function bindView(){
  document.querySelectorAll("[data-go]").forEach(b => { b.onclick = () => go(b.dataset.go);
    b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(b.dataset.go); } }; });
  if ($("#refresh")) $("#refresh").onclick = refreshData;
  bindCustomers(); bindRoles(); bindQuotes(); bindSettings();
  const va = $("#viewAs"); if (va) va.onclick = () => { const n = $("#viewAsName").value; if (!n) return toast("Pick a technician first"); S.viewAs = n; go("my"); };
}

function viewTodo(){
  const r = ROUTES[S.route];
  return `<div class="bar"><h2>${r.label}</h2></div>${notSetUp(r.lists)}
    ${S.param ? `<div class="banner">You opened <b>${esc(S.param)}</b> — it will show here once ${esc(r.label)} is built.</div>` : ""}
    <div class="todo"><b>${esc(r.label)}</b> is the next thing to be built.<br>${esc(r.step)}</div>`;
}
function viewDash(){
  const facts = jobFacts();
  const jobs = D.jobs.map(j => ({ ...j, _st: jobState(j, facts) }));
  const byNo = new Map(jobs.map(j => [j.Title, j]));
  const open = jobs.filter(j => !CLOSED.includes(j._st));
  const inProg = open.filter(j => j._st === "In Progress").length;
  const overdue = open.filter(j => j.DueDate && j.DueDate < TODAY).sort((a, b) => a.DueDate.localeCompare(b.DueDate));
  const unsched = jobs.filter(j => j._st === "New").sort(byUrgency);
  const hot = unsched.filter(j => priRank(j.Priority) <= 1).length;
  const today = D.assign.filter(a => a.AssignDate === TODAY && a.AssignStatus !== "Cancelled")
    .sort((a, b) => (a.StartTime || "").localeCompare(b.StartTime || "") || (a.Technician || "").localeCompare(b.Technician || ""));
  const techs = new Set(today.map(a => a.Technician).filter(Boolean)).size;
  const awaiting = D.quotes.filter(q => q.QuoteStatus === "Sent").sort((a, b) => (a.FollowUpDate || "9999").localeCompare(b.FollowUpDate || "9999"));
  const followDue = awaiting.filter(q => q.FollowUpDate && q.FollowUpDate <= TODAY).length;
  const awaitVal = awaiting.reduce((a, q) => a + num(q.SubtotalEx), 0);
  const ready = jobs.filter(j => j._st === "Completed").map(j => ({ ...j, _v: unbilledValue(j) })).sort((a, b) => b._v.value - a._v.value);
  const readyVal = ready.reduce((a, j) => a + j._v.value, 0), noRate = ready.reduce((a, j) => a + j._v.noRate, 0);
  const invY = jobs.filter(j => j._st === "Invoiced" && (j.CompletedDate || "").startsWith(YEAR)).length;
  const STC = { New:"var(--info)", Scheduled:"var(--c-job)", "In Progress":"var(--warn)", "On Hold":"var(--bad)", Completed:"var(--ok)" };
  const pipe = ["New","Scheduled","In Progress","On Hold","Completed"].map(s => ({ s, n: jobs.filter(j => j._st === s).length })), pmax = Math.max(1, ...pipe.map(p => p.n));
  const tile = (go, k, l, v, sub, alert) => `<div role="button" tabindex="0" data-go="${go}" title="Open the matching list" class="card kpi ${k} ${alert ? "alert" : ""}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const jobLi = (j, right) => `<li data-go="jobs/${encodeURIComponent(j.Title)}"><span class="id">${esc(j.Title)}</span><span class="x">${esc(j.CustomerName || "")}${j.SiteName ? " · " + esc(j.SiteName) : ""}${j.Description ? `<br><span class="count">${esc(String(j.Description).slice(0, 90))}</span>` : ""}</span>${right}</li>`;
  const more = (n, shown, go, what) => n > shown ? `<p class="count"><a href="#/${go}">+${n - shown} more — see ${what}</a></p>` : "";

let rolesWarned = false;
function bindRoles(){
  const tbl = $("table.roles"); if (!tbl) return;
  if (S.param === "roles") $("#roles").scrollIntoView({ block:"start" });
  const changed = () => [...tbl.querySelectorAll("tr[data-sid]")].map(tr => {
    const s = S.staff.find(x => String(x.id) === tr.dataset.sid), f = {};
    tr.querySelectorAll("[data-k]").forEach(el => { const v = el.value.trim(); if (v !== (s[el.dataset.k] || "")) f[el.dataset.k] = v; });
    tr.classList.toggle("dirty", Object.keys(f).length > 0);
    return Object.keys(f).length ? { s, f } : null;
  }).filter(Boolean);
  tbl.oninput = tbl.onchange = () => { const n = changed().length; $("#saveRoles").disabled = !n; $("#rolesDirty").textContent = n ? `${n} unsaved change${n === 1 ? "" : "s"}` : ""; rolesWarned = false; };
  $("#saveRoles").onclick = async () => {
    const todo = changed(); if (!todo.length) return;
    const bad = todo.find(({ f }) => f.Email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.Email));
    if (bad) return toast(`"${bad.f.Email}" doesn't look like an email address (${bad.s.Title})`);
    const emails = new Map();
    for (const s of S.staff){ const t = todo.find(x => x.s === s), e = norm(t && "Email" in t.f ? t.f.Email : s.Email); if (!e) continue;
      if (emails.has(e)) return toast(`${emails.get(e)} and ${s.Title} have the same email — each person needs their own`); emails.set(e, s.Title); }
    const mine = todo.find(x => x.s === S.me && "HubRole" in x.f && !OFFICE.includes(x.f.HubRole));
    if (mine && !rolesWarned){ rolesWarned = true; return toast("You're removing your own office access — you'll lose these screens. Click Save changes again if you're sure."); }
    $("#saveRoles").disabled = true;
    let ok = 0, denied = false;
    for (const { s, f } of todo){
      const out = {}; Object.entries(f).forEach(([k, v]) => out[k] = v === "" ? null : v);
      try { if (!DEMO) await saveListItem(CONFIG.LISTS.staff, s.id, out); Object.assign(s, f); ok++; }
      catch(e){ console.warn("Couldn't save", s.Title, e.message); if (isForbidden(e)) { denied = true; break; } }
    }
    [S.role, S.roleSource] = resolveRole(); readHash(); render();
    toast(denied ? "Only MJE site owners can change staff roles — ask an owner, or add you to the site Owners group." : `Saved ${ok} change${ok === 1 ? "" : "s"}${ok < todo.length ? ` — ${todo.length - ok} couldn't be saved` : ""}`);
  };
}

// Next number from MJE_ServiceNumbers: read, add one, write back only if nobody else changed it (If-Match); retry on a clash.
async function takeNumber(counter, prefix, width, existing){
  const fmt = n => prefix + String(n).padStart(width, "0"), re = new RegExp("^" + prefix.replace(/[-]/g, "\\-") + "(\\d+)$");
  const maxExisting = existing.reduce((m, v) => { const r = re.exec(v || ""); return r ? Math.max(m, +r[1]) : m; }, 0);
  if (DEMO) return fmt(maxExisting + 1);
  const base = `/sites/${siteId}/lists/${CONFIG.LISTS.numbers}/items`;
  for (let i = 0; i < 6; i++){
    const j = await graph(`${base}?expand=fields&$filter=fields/Title eq '${counter}'`, { headers:{ Prefer:"HonorNonIndexedQueriesWarningMayFailRandomly" } });
    const row = j.value[0];
    if (!row){ const n = maxExisting + 1; await graph(base, { method:"POST", body: JSON.stringify({ fields:{ Title:counter, LastNumber:n } }) }); return fmt(n); }
    const n = Math.max(num(row.fields.LastNumber), maxExisting) + 1;
    try { await graph(`${base}/${row.id}/fields`, { method:"PATCH", headers:{ "If-Match": row.eTag || row["@odata.etag"] }, body: JSON.stringify({ LastNumber:n }) }); return fmt(n); }
    catch(e){ if (e.status === 412 || e.status === 409){ await new Promise(r => setTimeout(r, 300 + Math.random() * 700)); continue; } throw e; }
  }
  throw new Error("couldn't get the next number because others were saving at the same time — please try again");
}
const norm = v => String(v || "").trim().toLowerCase().replace(/\s+/g, " ");
async function submitForm(e){
  e.preventDefault();
  const { kind, item } = EDIT, F = FORMS[kind], list = D[F.list];
  const missing = [...$("#dlgBody").querySelectorAll("[required]")].filter(el => !el.value.trim());
  if (missing.length){ missing[0].focus(); toast("Please fill in: " + missing.map(m => m.closest("label").innerText.replace(" *", "").trim()).join(", ")); return; }
  const f = readForm();
  // Probably a duplicate? Warn once; a second Save goes ahead.
  const dup = kind === "cust" ? D.customers.find(c => c !== item && norm(c.Title) === norm(f.Title))
            : kind === "site" ? D.sites.find(x => x !== item && x.CustomerCode === f.CustomerCode && norm(x.Title) === norm(f.Title))
            : (f.SerialNo ? D.assets.find(a => a !== item && norm(a.SerialNo) === norm(f.SerialNo) && norm(a.Make) === norm(f.Make)) : null);
  if (kind === "rate"){ f.RateCode = f.RateCode.toUpperCase().replace(/\s+/g, "-");
    const same = D.rates.find(r => r !== item && norm(r.RateCode) === norm(f.RateCode)); if (same) return toast(`Rate code ${f.RateCode} is already used by "${same.Title}"`); }
  if (kind === "quote"){
    if (f.ValidUntil < f.QuoteDate) return toast("Valid until can't be before the quote date");
    f.CustomerName = D.customers.find(c => c.CustomerCode === f.CustomerCode)?.Title || "";
    f.SiteName = D.sites.find(x => x.SiteCode === f.SiteCode)?.Title || "";
  }
  if (dup && EDIT.warned !== dup.id){ EDIT.warned = dup.id; toast(`There's already ${kind === "asset" ? "equipment with this make and serial no." : `a ${F.name.toLowerCase()} called "${dup.Title}"`} (${dup[F.code]}). Click Save again to add it anyway.`); return; }
  // copies kept beside the codes so SharePoint views and exports read well
  if (kind === "site") f.CustomerName = D.customers.find(c => c.CustomerCode === f.CustomerCode)?.Title || "";
  if (kind === "asset") f.CustomerCode = D.sites.find(x => x.SiteCode === f.SiteCode)?.CustomerCode || "";
  const nums = numericFields(kind), out = {};
  for (const [k, val] of Object.entries(f)){
    if (nums.has(k)) { const n = val === "" ? null : +val; if (n !== null || item) out[k] = n; }
    else if (val !== "" || item) out[k] = val === "" ? null : val;
  }
  if (item) delete out[F.code];
  $("#dlgSave").disabled = true;
  try {
    if (!item && !F.manualCode) out[F.code] = await takeNumber(F.counter, F.prefix, F.width, list.map(r => r[F.code]));
    if (!item && kind === "quote"){ out.QuoteStatus = "Draft"; out.PreparedBy = S.me?.Title || account?.name || ""; }
    const saved = DEMO ? { ...(item || { id:"demo" + Date.now() }), ...out } : { ...(item || {}), ...(await saveListItem(CONFIG.LISTS[F.list], item?.id, out)) };
    const before = item ? { ...item } : null;
    const i = list.findIndex(r => r.id === saved.id); i >= 0 ? list.splice(i, 1, saved) : list.push(saved);
    $("#dlg").close();
    toast(`Saved ${saved[F.code]}${F.code === "Title" ? "" : " · " + saved.Title}`);
    if (!item && kind === "cust") go("customers", saved.CustomerCode);
    else if (!item && kind === "quote") go("quotes", saved.Title);
    else if (!item && kind === "site" && S.route !== "customers") go("site", saved.SiteCode);
    else render();
    if (before) updateCopies(kind, before, saved);
  } catch(err){ console.error(err); toast(isForbidden(err) ? NO_PERMISSION : "Save failed: " + err.message); }
  finally { $("#dlgSave").disabled = false; }
}
// After a rename, update the name copies on linked records still in use (issued invoices keep the name they were issued with)
async function updateCopies(kind, before, after){
  const live = j => !["Invoiced","Cancelled"].includes(j.JobStatus), liveQ = q => ["Draft","Sent"].includes(q.QuoteStatus), todo = [];
  if (kind === "cust" && before.Title !== after.Title){
    const c = after.CustomerCode, n = { CustomerName: after.Title };
    D.sites.filter(x => x.CustomerCode === c).forEach(r => todo.push(["sites", r, n]));
    D.jobs.filter(j => j.CustomerCode === c && live(j)).forEach(r => todo.push(["jobs", r, n]));
    D.quotes.filter(q => q.CustomerCode === c && liveQ(q)).forEach(r => todo.push(["quotes", r, n]));
  }
  if (kind === "site"){
    const c = after.SiteCode;
    if (before.Title !== after.Title){ const n = { SiteName: after.Title };
      D.jobs.filter(j => j.SiteCode === c && live(j)).forEach(r => todo.push(["jobs", r, n]));
      D.quotes.filter(q => q.SiteCode === c && liveQ(q)).forEach(r => todo.push(["quotes", r, n])); }
    if (before.CustomerCode !== after.CustomerCode) D.assets.filter(a => a.SiteCode === c).forEach(r => todo.push(["assets", r, { CustomerCode: after.CustomerCode }]));
  }
  if (!todo.length) return;
  let ok = 0;
  for (const [key, r, f] of todo){ try { if (!DEMO) await saveListItem(CONFIG.LISTS[key], r.id, f); Object.assign(r, f); ok++; } catch(e){ console.warn("Couldn't update", key, r.Title, e.message); } }
  toast(`Updated the name on ${ok} linked record${ok === 1 ? "" : "s"}${ok < todo.length ? ` (${todo.length - ok} couldn't be changed)` : ""}`);
  render();
}

const k2 = v => "K " + num(v).toLocaleString("en-AU", { minimumFractionDigits:2, maximumFractionDigits:2 });
const r2 = v => Math.round((num(v) + Number.EPSILON) * 100) / 100;
const gstPct = () => num(setting("GSTRatePct", 10));
const markupPct = () => num(setting("MaterialMarkupPct", 0));
const followDays = () => num(setting("QuoteFollowUpDays", 7)) || 7;
const quoteState = q => (q.QuoteStatus === "Sent" && q.ValidUntil && q.ValidUntil < TODAY) ? "Expired" : (q.QuoteStatus || "Draft");
const QPILL = { Draft:"p-grey", Sent:"p-info", Accepted:"p-ok", Declined:"p-bad", Expired:"p-warn" };
const qPill = q => { const st = quoteState(q); return `<span class="pill ${QPILL[st] || "p-grey"}">${st}</span>`; };
const followDue = q => quoteState(q) === "Sent" && q.FollowUpDate && q.FollowUpDate <= TODAY;
const LINE_KINDS = ["Labour","Parts","Fee","Text"];
const UNIT_OF = { Hour:"hr", "Call-out":"call-out", Fixed:"each" };
const lineAmount = l => l.LineKind === "Text" ? 0 : r2(num(l.Qty) * num(l.UnitPriceEx));
function totalsOf(ls){
  let sub = 0, gst = 0, cost = 0, partsSell = 0;
  ls.forEach(l => { if (l.LineKind === "Text") return; const t = lineAmount(l); sub += t;
    if ((l.TaxCode || "GST") === "GST") gst += t * gstPct() / 100;
    if (l.LineKind === "Parts" && l.UnitCost !== "" && l.UnitCost != null){ cost += num(l.Qty) * num(l.UnitCost); partsSell += t; } });
  sub = r2(sub); gst = r2(gst);
  return { sub, gst, inc: r2(sub + gst), cost: r2(cost), partsSell: r2(partsSell) };
}
const quoteLines = no => (D.qlines || []).filter(l => l.Title === no).sort((a, b) => num(a.LineNo) - num(b.LineNo));

      </tbody></table>${ls.length ? "" : `<div class="empty">No lines</div>`}</div>${totalsHtml(ls, true)}`}`;
}

function newLine(kind){
  const base = { LineKind:kind, TaxCode:"GST", _new:true };
  if (kind === "Text") return base;
  return { ...base, Qty:1, Unit: kind === "Labour" ? "hr" : "each" };
}
function refreshLines(no){
  const QE = S.qe[no], tb = $("#qlines tbody"); if (!tb) return render();
  tb.innerHTML = linesBody(QE.lines); $("#qtot").innerHTML = totalsHtml(QE.lines, true); markDirty(no);
}
function markDirty(no){
  S.qe[no].dirty = true;
  if ($("#qDirty")) { $("#qDirty").textContent = "Unsaved changes"; $("#qSave").disabled = false; $("#qDiscard").disabled = false; }
}
function bindQuotes(){
  document.querySelectorAll("[data-newq]").forEach(b => b.onclick = () => { const [c, si] = b.dataset.newq.split("|"); openForm("quote", null, c ? { CustomerCode:c, SiteCode:si || "",
    ContactName: si ? (D.sites.find(x => x.SiteCode === si)?.ContactName || "") : (D.customers.find(x => x.CustomerCode === c)?.AccountsContact || ""),
    ContactEmail: si ? (D.sites.find(x => x.SiteCode === si)?.ContactEmail || D.customers.find(x => x.CustomerCode === c)?.Email || "") : (D.customers.find(x => x.CustomerCode === c)?.Email || "") } : {}); });
  if (S.route !== "quotes") return;
  document.querySelectorAll("[data-qf]").forEach(b => { const fn = () => { S.qf.status = b.dataset.qf; render(); }; b.onclick = fn; b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }; });
  const qq = $("#qq"); if (qq) qq.oninput = () => { S.qf.q = qq.value; const pos = qq.selectionStart; render(); const n = $("#qq"); n.focus(); n.setSelectionRange(pos, pos); };
  const q = D.quotes.find(x => x.Title === S.param); if (!q) return;
  const no = q.Title, QE = S.qe[no];
  document.querySelectorAll("[data-qact]").forEach(b => b.onclick = () => quoteAction(q, b.dataset.qact));
  document.querySelectorAll("[data-addl]").forEach(b => b.onclick = () => { QE.lines.push(newLine(b.dataset.addl)); refreshLines(no);
    const last = $("#qlines tbody tr:last-child"); (last?.querySelector('[data-f="LabourRateCode"]') || last?.querySelector('[data-f="Description"]'))?.focus(); });
  const tbl = $("#qlines"); if (!tbl) return;
  tbl.oninput = e => {
    const el = e.target, tr = el.closest("tr[data-i]"), k = el.dataset.f; if (!tr || !k) return;
    const l = QE.lines[+tr.dataset.i]; l[k] = el.value; markDirty(no);
    if (k === "LineKind"){ const n = { ...newLine(el.value), id:l.id, Description:l.Description }; QE.lines[+tr.dataset.i] = n; return refreshLines(no); }
    if (k === "LabourRateCode"){ const r = (D.rates || []).find(x => x.RateCode === el.value);
      if (r){ if (!l.Description || l.Description === l._rateTitle) l.Description = r.Title; l._rateTitle = r.Title; l.Unit = UNIT_OF[r.RateUnit] || "hr"; l.UnitPriceEx = num(r.RateEx);
        if (r.RateUnit === "Hour" && num(r.MinChargeHours) > num(l.Qty)) l.Qty = num(r.MinChargeHours); }
      return refreshLines(no); }
    if (k === "UnitPriceEx") l._priceSet = true;
    if (k === "UnitCost" && !l._priceSet && el.value !== ""){ l.UnitPriceEx = r2(num(el.value) * (1 + markupPct() / 100)); tr.querySelector('[data-f="UnitPriceEx"]').value = l.UnitPriceEx; }
    const lt = tr.querySelector(".lt"); if (lt) lt.textContent = k2(lineAmount(l));
    $("#qtot").innerHTML = totalsHtml(QE.lines, true);
  };
  tbl.onclick = e => {
    const rm = e.target.closest("[data-rm]"), mv = e.target.closest("[data-mv]");
    if (rm){ const [l] = QE.lines.splice(+rm.dataset.rm, 1); if (l.id) QE.removed.push(l.id); refreshLines(no); }
    if (mv){ const [i, d] = mv.dataset.mv.split("|").map(Number), j = i + d; if (j < 0 || j >= QE.lines.length) return; [QE.lines[i], QE.lines[j]] = [QE.lines[j], QE.lines[i]]; refreshLines(no); }
  };
  $("#qDiscard").onclick = () => { delete S.qe[no]; render(); toast("Changes discarded"); };
  $("#qSave").onclick = () => saveQuoteLines(q);
}
// Save the line editor: update changed lines, add new ones, delete removed ones, then store the totals on the quote.
// Progress is kept line by line, so if the connection drops, Save again carries on where it stopped.
async function saveQuoteLines(q){
  const QE = S.qe[q.Title];
  const bad = QE.lines.findIndex(l => l.LineKind !== "Text" && (!String(l.Description || "").trim() || l.Qty === "" || l.Qty == null || l.UnitPriceEx === "" || l.UnitPriceEx == null));
  if (bad >= 0) return toast(`Line ${bad + 1} needs a description, quantity and unit price`);
  const LIST = CONFIG.LISTS.qlines, txt = l => l.LineKind === "Text";
  const fieldsOf = (l, i) => ({ Title:q.Title, LineNo:i + 1, LineKind:l.LineKind, LabourRateCode: l.LineKind === "Labour" ? (l.LabourRateCode || null) : null,
    Description: String(l.Description || "").trim(), Qty: txt(l) ? null : num(l.Qty), Unit: txt(l) ? null : (l.Unit || null),
    UnitCost: l.LineKind === "Parts" && l.UnitCost !== "" && l.UnitCost != null ? num(l.UnitCost) : null, UnitPriceEx: txt(l) ? null : r2(l.UnitPriceEx),
    TaxCode: txt(l) ? null : (l.TaxCode || "GST"), LineTotalEx: txt(l) ? null : lineAmount(l) });
  const same = (a, b) => (a ?? "") === (b ?? "") || (typeof b === "number" && num(a) === b && a !== "" && a != null);
  $("#qSave").disabled = true;
  try {
    while (QE.removed.length){ const id = QE.removed[0]; if (!DEMO) await graph(`/sites/${siteId}/lists/${LIST}/items/${id}`, { method:"DELETE" }); QE.removed.shift(); D.qlines = D.qlines.filter(x => x.id !== id); }
    for (const [i, l] of QE.lines.entries()){
      const f = fieldsOf(l, i), orig = l.id ? D.qlines.find(x => x.id === l.id) : null;
      if (orig && Object.keys(f).every(k => same(orig[k], f[k]))) continue;
      const saved = DEMO ? { id: l.id || "demo" + Date.now() + i, ...f } : await saveListItem(LIST, l.id || null, f);
      const row = { ...(orig || {}), ...f, id: l.id || saved.id };
      l.id = row.id; delete l._new;
      D.qlines = D.qlines.filter(x => x.id !== row.id); D.qlines.push(row);
    }
    const t = totalsOf(QE.lines), tf = { SubtotalEx:t.sub, GST:t.gst, TotalInc:t.inc };
    if (!DEMO) await saveListItem(CONFIG.LISTS.quotes, q.id, tf);
    Object.assign(q, tf); delete S.qe[q.Title]; render(); toast(`Saved ${q.Title} — ${k2(t.inc)} inc GST`);
  } catch(e){ console.error(e); toast((isForbidden(e) ? NO_PERMISSION : "Save stopped: " + e.message) + " — click Save lines again to finish."); $("#qSave").disabled = false; }
}
async function setQuote(q, f, msg){
  try { if (!DEMO) await saveListItem(CONFIG.LISTS.quotes, q.id, f); Object.assign(q, f); render(); toast(msg); return true; }
  catch(e){ toast(isForbidden(e) ? "You don't have permission to change quotes — they're for the MJE office." : "Couldn't save: " + e.message); return false; }
}
function quoteReady(q){
  if (S.qe[q.Title]?.dirty){ toast("Save the lines first"); return false; }
  if (!quoteLines(q.Title).some(l => l.LineKind !== "Text")){ toast("Add at least one priced line first"); return false; }
  return true;
}
function quoteAction(q, act){
  if (act === "edit") return openForm("quote", q);
  if (act === "print"){ if (S.qe[q.Title]?.dirty) return toast("Save the lines first"); return printDoc(quotePrintHtml(q), q.Title); }
  if (act === "email"){ if (quoteReady(q)) openEmail(q); return; }
  if (act === "sent"){ if (quoteReady(q)) setQuote(q, sentFields(), `${q.Title} marked as sent — follow up on ${fmtDate(addDays(TODAY, followDays()))}`); return; }
  if (act === "accepted") return setQuote(q, { QuoteStatus:"Accepted" }, `${q.Title} accepted — use Convert to job to start the work`);
  if (act === "redraft") return setQuote(q, { QuoteStatus:"Draft", ...(quoteState(q) === "Expired" ? { ValidUntil: addDays(TODAY, num(setting("QuoteValidityDays", 30))) } : {}) }, `${q.Title} is back in draft`);
  if (act === "declined") return openDialog({ cls:"f-quo", kind:"Quotes · Declined", title:`${q.Title} declined`, save:"Mark as declined",
    body:`<fieldset><legend>Why was it declined?</legend><div class="fg"><label class="fld w3"><span>Reason (helps with future quotes)</span><textarea name="reason" placeholder="e.g. went with another contractor, price, timing, project cancelled"></textarea></label></div></fieldset>`,
    onSubmit: async () => { $("#dlg").close(); await setQuote(q, { QuoteStatus:"Declined", DeclineReason: val("reason") || null }, `${q.Title} marked as declined`); } });
  if (act === "follow") return openDialog({ cls:"f-quo", kind:"Quotes · Follow-up", title:`Followed up ${q.Title}`, save:"Save",
    body:`<fieldset><legend>Follow-up</legend><div class="fg"><label class="fld w2"><span>What did they say?</span><input name="note" placeholder="e.g. Still deciding, call back next week"></label>
      <label class="fld"><span class="req">Next follow-up</span><input type="date" name="next" required value="${addDays(TODAY, followDays())}"></label></div></fieldset>`,
    onSubmit: async () => { const who = S.me?.Title || account?.name || "", note = `${fmtDate(TODAY)} — followed up by ${who}${val("note") ? ": " + val("note") : ""}`;
      $("#dlg").close(); await setQuote(q, { FollowUpDate: val("next"), Notes: q.Notes ? q.Notes + "\n" + note : note }, `Next follow-up ${fmtDate(val("next"))}`); } });
  if (act === "convert") return openConvert(q);
}

function printDoc(html, title){

let H2P;
const loadPdfMaker = () => H2P ||= new Promise((res, rej) => { const sc = document.createElement("script");
  sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"; sc.onload = res; sc.onerror = () => { H2P = null; rej(new Error("couldn't load the PDF maker — check the connection")); }; document.head.appendChild(sc); });
async function pdfBase64(html, name){
  await loadPdfMaker();
  const host = document.createElement("div"); host.style.cssText = "position:fixed;left:-10000px;top:0;width:760px;background:#fff"; host.innerHTML = html; document.body.appendChild(host);
  try {
    await Promise.all([...host.querySelectorAll("img")].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const uri = await html2pdf().set({ margin:[10,10,12,10], filename:name, image:{ type:"jpeg", quality:0.92 }, html2canvas:{ scale:2, backgroundColor:"#ffffff" },
      jsPDF:{ unit:"mm", format:"a4", orientation:"portrait" }, pagebreak:{ mode:["css","legacy"] } }).from(host.firstElementChild).outputPdf("datauristring");

}

// ---- email (from the shared accounts mailbox when it's set in Settings)
async function sendMail(message){
  const box = setting("AccountsMailbox", "").trim(), scope = box ? "Mail.Send.Shared" : "Mail.Send";
  let tk; try { tk = (await msalApp.acquireTokenSilent({ scopes:[scope], account })).accessToken; } catch(e){ tk = (await msalApp.acquireTokenPopup({ scopes:[scope], account })).accessToken; }
  const r = await fetch(`https://graph.microsoft.com/v1.0/${box ? "users/" + encodeURIComponent(box) : "me"}/sendMail`,
    { method:"POST", headers:{ Authorization:"Bearer " + tk, "Content-Type":"application/json" }, body: JSON.stringify({ message, saveToSentItems:true }) });
  if (!r.ok){ let m = String(r.status); try { m = (await r.json()).error.message; } catch {}
    throw new Error(r.status === 403 || /denied|not have permission/i.test(m) ? (box ? `Your account isn't allowed to send as ${box}. Ask for "Send As" on that mailbox (Exchange admin centre).` : "Your account isn't allowed to send mail from the Hub.") : "Email not sent: " + m); }
}
function openEmail(q){

  openDialog({ cls:"f-quo", kind:"Quotes · Email", title:`Email ${q.Title}`, save:"Send",
    body:`<fieldset><legend>Email</legend><div class="fg">
      <label class="fld w3"><span>From</span><input readonly tabindex=-1 value="${esc(box || `${account?.username || ""} — your own mailbox (set the shared accounts mailbox in Settings)`)}"></label>

      ${q.QuoteStatus === "Draft" ? `<p class="count">Sending marks the quote as sent and sets a follow-up for ${followDays()} days' time.</p>` : ""}`,
    onSubmit: async () => {
      const split = v => v.split(/[;,]/).map(x => x.trim()).filter(Boolean), to = split(val("to")), cc = split(val("cc"));
      const bad = [...to, ...cc].find(a => !EMAIL_RE.test(a)); if (bad) return toast(`"${bad}" doesn't look like an email address`);

      if (!DEMO) await sendMail(message);

      if (q.QuoteStatus === "Draft") await setQuote(q, sentFields(), `Emailed ${q.Title} to ${to.join(", ")} and marked it as sent`); else toast(`Emailed ${q.Title} to ${to.join(", ")}`);
    } });
}

  const v = k => setting(k, ""), show = (k, d = "—") => v(k) ? esc(v(k)) : `<span class="count">${d}</span>`;
  return `<div class="bar" style="margin-top:22px"><h2>Company &amp; quotes</h2><span class="grow"></span>${isAdmin() ? `<button class="btn" id="editCompany">Edit</button>` : ""}</div>
  <div class="grid two">
    <div class="card"><h3>Printed on quotes and invoices</h3><dl class="kv"><dt>Company</dt><dd>${show("CompanyName")}</dd><dt>Details</dt><dd>${v("CompanyDetails") ? lines(v("CompanyDetails")) : `<span class="count">not set — add address, TIN and bank details</span>`}</dd>
      <dt>Emailed from</dt><dd>${v("AccountsMailbox") ? esc(v("AccountsMailbox")) : `<span class="pill p-warn">not set</span> <span class="count">quotes go from each person's own mailbox</span>`}</dd></dl></div>
    <div class="card"><h3>Defaults</h3><dl class="kv"><dt>GST</dt><dd>${show("GSTRatePct", "10")}%</dd><dt>Material markup</dt><dd>${show("MaterialMarkupPct", "0")}%</dd>
      <dt>Quotes valid for</dt><dd>${show("QuoteValidityDays", "30")} days</dd><dt>Follow up after</dt><dd>${show("QuoteFollowUpDays", "7")} days</dd><dt>Payment terms</dt><dd>${show("PaymentTermsDays", "30")} days</dd>
      <dt>Quote terms</dt><dd>${v("QuoteTerms") ? `<span class="count">${lines(v("QuoteTerms"))}</span>` : `<span class="count">none</span>`}</dd></dl></div>
  </div>`;
}
function ratesTable(){
  const rs = [...(D.rates || [])].sort((a, b) => (a.RateStatus === "Retired") - (b.RateStatus === "Retired") || num(a.SortOrder) - num(b.SortOrder) || String(a.Title).localeCompare(String(b.Title)));
  return `<div class="bar" style="margin-top:22px"><h2>Labour rates</h2><span class="grow"></span>${isAdmin() ? `<button class="btn primary" data-new="rate">+ New rate</button>` : ""}</div>
  <div class="tablewrap"><table class="setup"><thead><tr><th>Code</th><th>Labour type</th><th>Rate ex GST</th><th>Per</th><th>Minimum charge</th><th>Status</th></tr></thead><tbody>
  ${rs.map(r => `<tr ${isAdmin() ? `data-edit="rate|${esc(r.id)}" tabindex="0"` : ""}><td class="mono"><b>${esc(r.RateCode || "")}</b></td><td>${esc(r.Title)}</td><td class="mono">${k2(r.RateEx)}</td>
    <td>${esc(UNIT_OF[r.RateUnit] || "hr")}</td><td class="mono">${r.MinChargeHours ? esc(r.MinChargeHours) + " h" : ""}</td><td>${r.RateStatus === "Retired" ? `<span class="pill p-grey">Retired</span>` : `<span class="pill p-ok">Active</span>`}</td></tr>`).join("")}
  </tbody></table>${rs.length ? "" : `<div class="empty">No labour rates yet${isAdmin() ? " — add normal time, overtime, apprentice, call-out and so on with <b>+ New rate</b>" : ""}</div>`}</div>
  ${isAdmin() ? "" : `<p class="count">Only Admins can change rates and company details.</p>`}`;
}
function bindSettings(){
  const b = $("#editCompany"); if (!b) return;
  b.onclick = () => openDialog({ kind:"Settings · Company & quotes", title:"Company & quote defaults",
    body:`<fieldset><legend>Company &amp; quotes</legend><div class="fg">${COMPANY_KEYS.map(([k, l, t, w]) =>
      t === "textarea" ? `<label class="fld w3"><span>${l}</span><textarea name="${k}">${esc(setting(k, ""))}</textarea></label>`
      : `<label class="fld ${w === 2 ? "w2" : ""}"><span>${l}</span><input name="${k}" type="${t}" ${t === "number" ? 'step="any" min="0"' : ""} value="${esc(setting(k, ""))}"></label>`).join("")}</div></fieldset>
      <p class="count">Only MJE site owners can save these.</p>`,
    onSubmit: async () => {
      const box = val("AccountsMailbox"); if (box && !EMAIL_RE.test(box)) return toast(`"${box}" doesn't look like an email address`);
      let n = 0;
      for (const [k] of COMPANY_KEYS){
        const nv = $(`#dlgBody [name="${k}"]`).value.trim(), row = D.settings.find(r => r.Title === k);
        if ((row?.SettingValue ?? "") === nv || (!row && nv === "")) continue;
        if (DEMO) { if (row) row.SettingValue = nv; else D.settings.push({ id:"demo" + k, Title:k, SettingValue:nv }); n++; continue; }
        const saved = await saveListItem(CONFIG.LISTS.settings, row?.id || null, row ? { SettingValue: nv || null } : { Title:k, SettingValue:nv });
        if (row) row.SettingValue = nv; else D.settings.push({ ...saved, Title:k, SettingValue:nv }); n++;
      }
      $("#dlg").close(); render(); toast(n ? `Saved ${n} setting${n === 1 ? "" : "s"}` : "Nothing changed");
    } });
}

/* ---------------- boot ---------------- */
function showSignIn(msg){
  $("#main").innerHTML = `<div class="card signin"><div class="full"><img src="${MJE_SHARED}mje-logo-full.png" alt="MJ Electrical — Electrical | Communications | Security | Fire"></div><h2>Service Hub</h2><p>Quotes, jobs, scheduling and invoicing for MJ Electrical.</p>
    ${msg ? `<div class="banner err">${esc(msg)}</div>` : ""}<button class="btn primary" id="si">Sign in with Microsoft 365</button></div>`;
  $("#si").onclick = signIn;
}
// Names of every list on the site (one call), so screens can say "not set up" instead of failing
async function siteListNames(){
  let url = `/sites/${siteId}/lists?$select=name,displayName&$top=999`, out = new Set();
  while (url){ const j = await graph(url); j.value.forEach(l => { out.add(l.name); out.add(l.displayName); }); url = j["@odata.nextLink"]; }
  return out;
}
async function start(){
  $("#apps").outerHTML = mjeAppSwitcher("service");
  $("#dlgLogo").src = $(".logo .chip img").src;
  $("#dlgX").onclick = $("#dlgCancel").onclick = () => $("#dlg").close();
  $("#frm").onsubmit = submitForm;
  if (DEMO){
    account = { name:"Demo user", username:"demo@example.com" };
    Object.values(CONFIG.LISTS).forEach(n => S.have.add(n));
  } else {
    try { await initAuth(); } catch(e){ showSignIn("Sign-in error: " + e.message); return; }
    if (!account) return showSignIn();
    try {
      await getSite();
      S.have = await siteListNames();
      if (S.have.has(CONFIG.LISTS.staff)) S.staff = await listItems(CONFIG.LISTS.staff);
    } catch(e){
      renderHeader();
      $("#main").innerHTML = `<div class="banner err">Couldn't load data from SharePoint: ${esc(e.message)}<br>Check the site ${esc(CONFIG.SP_HOST + CONFIG.SITE_PATH)} exists and you have access.</div>`;
      return;
    }
  }
  [S.role, S.roleSource] = resolveRole();
  readHash(); render();
}
start();
</script>
