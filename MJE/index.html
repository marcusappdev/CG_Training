<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface2:#f9fafb;--text:#1b1f24;--muted:#5f6b7a;--line:#e3e6ea;
  --brand:#231f20;--accent:#f15838;--accent-ink:#231f20;
  --ok:#1f8a4c;--warn:#b7791f;--bad:#c2410c;--crit:#b91c1c;--info:#2563eb;
  --ok-bg:#e7f5ed;--warn-bg:#fdf3e1;--bad-bg:#fdece4;--info-bg:#e8effd;--grey-bg:#eef0f3;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --r:10px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1318;--surface:#171c23;--surface2:#1c222a;--text:#e6e9ee;--muted:#98a2b0;--line:#2a313b;
  --brand:#0b0f14;--accent:#f46a4e;--accent-ink:#1b1f24;
  --ok:#4ade80;--warn:#fbbf24;--bad:#fb923c;--crit:#f87171;--info:#60a5fa;
  --ok-bg:#12291c;--warn-bg:#2d2412;--bad-bg:#2e1b10;--info-bg:#132038;--grey-bg:#222932;
  --shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:10}
.logo{font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
.logo .chip{background:#fff;border-radius:7px;padding:3px 7px;display:flex;align-items:center}
.logo .chip img{height:28px;width:auto;display:block}
.signin .full{background:#fff;border-radius:12px;padding:12px 18px;display:inline-block;margin-bottom:8px}
.signin .full img{width:200px;height:auto;display:block}
nav{display:flex;gap:4px;margin-left:12px}
nav[hidden]{display:none}
.p-vh{background:var(--crit);color:#fff}
a[data-goto]{color:inherit;text-decoration:underline}
.flag{font-size:11px;color:var(--warn);white-space:nowrap}
.chips{gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip span{color:var(--muted);margin-left:4px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}.chip.on span{color:#c9d1db}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.hm{display:grid;grid-template-columns:18px 1fr;grid-template-rows:auto auto;gap:4px}
.hm-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.hm-x{grid-column:2;text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.hm-grid{display:grid;grid-template-columns:92px repeat(5,1fr);gap:4px}
.hm-h{font-size:11px;color:var(--muted);text-align:center;align-self:end;overflow:hidden;text-overflow:ellipsis}
.hm-r{font-size:12px;color:var(--muted);align-self:center;text-align:right;padding-right:6px}
.hm-c{height:42px;border:2px solid transparent;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.hm-c.z{opacity:.45;cursor:default}
.hm-c.sel{border-color:var(--text)}
.hm-Low{background:var(--ok-bg);color:var(--ok)}.hm-Medium{background:var(--warn-bg);color:var(--warn)}
.hm-High{background:var(--bad-bg);color:var(--bad)}.hm-VeryHigh{background:var(--crit);color:#fff}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;display:inline-block}
.ph img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--grey-bg)}
.ph.q img{outline:2px dashed var(--accent);outline-offset:-2px}
.ph button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:22px;padding:0}
.hint{font-size:12px;color:var(--warn);margin:-8px 0 12px}
@media (max-width:720px){.hm-grid{grid-template-columns:64px repeat(5,1fr)}.hm-h{font-size:9px}.hm-r{font-size:11px}.hm-c{height:36px}}
nav button{background:none;border:0;color:#c9d1db;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:rgba(255,255,255,.12);color:#fff}
.who{margin-left:auto;font-size:13px;color:#c9d1db;display:flex;gap:10px;align-items:center}
.who button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding:20px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13px}
.err{background:var(--bad-bg);color:var(--bad)}
h2{font-size:18px;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:#c8391b;border-color:#c8391b;color:#fff;font-weight:600;letter-spacing:.2px}
.btn.primary:hover{background:#a92f12;border-color:#a92f12}
.btn.primary:disabled{opacity:.6;cursor:wait}
.btn.danger{color:var(--crit)}
input[type=search],select.f{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{width:240px;max-width:100%}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:28px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px}
/* KPI tiles: centred, 4px register-coloured border, shadow below */
:root{--c-inc:#d63b25;--c-imp:#2563eb;--c-risk:#7c3aed;--c-rev:#0f8a80;--c-eq:#15803d;--c-tt:#b45309;--c-trn:#4f46e5;--c-ins:#0369a1;--c-leg:#a21caf;
  --kpi-shadow:0 8px 16px -6px rgba(16,24,40,.28),0 3px 6px -3px rgba(16,24,40,.18)}
@media (prefers-color-scheme:dark){:root{--c-inc:#f07a63;--c-imp:#6f9bf5;--c-risk:#a98bf5;--c-rev:#3cc2b6;--c-eq:#4ccb7c;--c-tt:#eaa24f;--c-trn:#8b8cf6;--c-ins:#4db4ea;--c-leg:#e07ae8;
  --kpi-shadow:0 8px 18px -6px rgba(0,0,0,.7),0 3px 6px -3px rgba(0,0,0,.5)}}
.kpi{--kc:var(--accent);text-align:center;border:4px solid var(--kc);box-shadow:var(--kpi-shadow);display:flex;flex-direction:column;justify-content:center;align-items:center}
.kpis{gap:16px;margin-bottom:20px}
.kpis.dash{display:flex;flex-wrap:wrap;justify-content:center}
.kpi[data-go]{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.kpi[data-go]:hover,.kpi[data-go]:focus-visible{transform:translateY(-3px);box-shadow:0 14px 22px -8px rgba(16,24,40,.35),0 4px 8px -4px rgba(16,24,40,.2);outline:none}
.kpi[data-go]:focus-visible{outline:3px solid var(--kc);outline-offset:3px}
.filterbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--fbc,var(--accent));border-radius:10px;padding:9px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.filterbar .ft{font-size:13px;color:var(--muted)}.filterbar b{color:var(--text)}
.filterbar .grow{flex:1}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.kpis.dash .kpi{flex:0 0 165px;min-height:150px}
@media (min-width:900px){.kpis.dash .kpi{flex-basis:calc((100% - 5*16px)/6)}}
@media (min-width:1300px){.kpis.dash .kpi{flex-basis:calc((100% - 6*16px)/7)}}
.kpi.k-inc{--kc:var(--c-inc)}.kpi.k-imp{--kc:var(--c-imp)}.kpi.k-risk{--kc:var(--c-risk)}.kpi.k-rev{--kc:var(--c-rev)}.kpi.k-eq{--kc:var(--c-eq)}
.kpi.k-tt{--kc:var(--c-tt)}.kpi.k-trn{--kc:var(--c-trn)}.kpi.k-ins{--kc:var(--c-ins)}.kpi.k-leg{--kc:var(--c-leg)}
.kpi.alert .v{color:var(--crit)}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.card h3{margin:0 0 12px;font-size:14px}
.hb{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hb .t{height:12px;background:var(--grey-bg);border-radius:3px;overflow:hidden;display:flex}
.hb .t i{display:block;height:100%}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;align-items:center}
.legend > span{display:inline-flex;align-items:center;gap:6px;line-height:1;white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--surface2);font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface2)}
td.clip{max-width:380px}
td.clip div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}
.p-grey{background:var(--grey-bg);color:var(--muted)}.p-crit{background:var(--bad-bg);color:var(--crit)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.count{color:var(--muted);font-size:13px}
dialog{border:0;border-radius:14px;padding:0;width:min(860px,96vw);max-height:92vh;background:var(--surface);color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.dh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dh h2{flex:1}
.db{padding:16px 20px;overflow:auto}
.df{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
/* ---- per-register form colours ---- */
#dlg{--fc:#64748b;--fc-bg:#f5f6f8}
#dlg.f-inc{--fc:#d63b25;--fc-bg:#fdf1ee}
#dlg.f-imp{--fc:#2563eb;--fc-bg:#eef3fd}
#dlg.f-risk{--fc:#7c3aed;--fc-bg:#f4effd}
#dlg.f-rev{--fc:#0f8a80;--fc-bg:#ebf7f6}
#dlg.f-eq{--fc:#15803d;--fc-bg:#edf7f0}
#dlg.f-tt{--fc:#b45309;--fc-bg:#fcf4ea}
@media (prefers-color-scheme:dark){
  #dlg{--fc:#94a3b8;--fc-bg:#1c222a}
  #dlg.f-inc{--fc:#f07a63;--fc-bg:#2a1b18}
  #dlg.f-imp{--fc:#6f9bf5;--fc-bg:#172238}
  #dlg.f-risk{--fc:#a98bf5;--fc-bg:#221b35}
  #dlg.f-rev{--fc:#3cc2b6;--fc-bg:#122927}
  #dlg.f-eq{--fc:#4ccb7c;--fc-bg:#13281b}
  #dlg.f-tt{--fc:#eaa24f;--fc-bg:#2b2114}
}
#dlg .dh{border-top:6px solid var(--fc);background:var(--fc-bg);padding:12px 20px}
.dlg-logo{background:#fff;border-radius:8px;padding:4px 8px;display:flex;align-items:center;box-shadow:0 0 0 1px var(--line)}
.dlg-logo img{height:30px;width:auto;display:block}
.dt{flex:1;min-width:0}
.dt h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{display:inline-block;background:var(--fc);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-radius:5px;padding:2px 8px;margin-bottom:3px}
@media (prefers-color-scheme:dark){.kind{color:#111}}
#dlg fieldset{background:var(--fc-bg);border-left:4px solid var(--fc);border-radius:10px;padding:12px 14px 14px;margin:0 0 14px}
#dlg legend{float:left;width:100%;color:var(--fc);margin-bottom:10px}
#dlg fieldset > :not(legend){clear:both}
#dlg label.fld input,#dlg label.fld select,#dlg label.fld textarea{background:var(--surface)}
#dlg label.fld input[readonly]{background:var(--grey-bg)}
#dlg .df{border-top:3px solid var(--fc)}
#dlg.f-staff,#dlg.f-course,#dlg.f-trn{--fc:#4f46e5;--fc-bg:#f0f0fd}
#dlg.f-area,#dlg.f-ins{--fc:#0369a1;--fc-bg:#ecf5fb}
#dlg.f-leg{--fc:#a21caf;--fc-bg:#fbf0fc}
@media (prefers-color-scheme:dark){
  #dlg.f-staff,#dlg.f-course,#dlg.f-trn{--fc:#8b8cf6;--fc-bg:#1d1d38}
  #dlg.f-area,#dlg.f-ins{--fc:#4db4ea;--fc-bg:#122533}
  #dlg.f-leg{--fc:#e07ae8;--fc-bg:#2c1630}
}
/* matrix / calendar */
.mxwrap table{min-width:0;width:auto}
table.matrix th,table.matrix td{padding:3px;border-bottom:1px solid var(--line);text-align:center}
table.matrix th.vh{height:150px;vertical-align:bottom;white-space:nowrap;position:sticky;top:0;background:var(--surface2);cursor:default}
table.matrix th.vh span{writing-mode:vertical-rl;transform:rotate(180deg);text-transform:none;letter-spacing:0;font-size:12px;color:var(--text);font-weight:600}
table.matrix .who-cell{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;padding:6px 10px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)}
table.matrix thead .who-cell{background:var(--surface2);z-index:2;vertical-align:bottom;color:var(--muted);text-transform:uppercase;font-size:12px}
.who-cell span{display:block;font-weight:400;color:var(--muted);font-size:11px}
table.matrix tr.grp td{text-align:left;background:var(--grey-bg);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 10px}
table.cal th:not(.who-cell){font-size:12px;min-width:46px}
.mx{width:44px;height:34px;border-radius:6px;border:1px solid transparent;font-size:10px;line-height:1.1;cursor:pointer;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.legend .mx{width:22px;height:16px;margin:0;padding:0;box-sizing:border-box;font-size:9px;line-height:1;cursor:default;flex:none;display:inline-flex;align-items:center;justify-content:center;border-width:2px}
.legend .mx-na{border-width:1px}
.mx-na{background:transparent;border:1px dashed var(--line)}
.mx-na:hover{border-color:var(--muted)}
.mx-done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.mx-expiring{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.mx-expired{background:var(--crit);color:#fff}
.mx-missing{background:var(--bad-bg);color:var(--crit);border:2px solid var(--crit);font-size:14px}
.mx-planned{background:var(--grey-bg);color:var(--muted);border-color:var(--line)}
.mxl{margin:0;flex-wrap:wrap}
table.legt tr.child td:first-child{padding-left:30px;font-size:13px}
table.legt a{font-size:12px;color:var(--info)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fg .w2{grid-column:span 2}.fg .w3{grid-column:1/-1}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.fld input,label.fld select,label.fld textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font-size:14px}
label.fld textarea{min-height:70px;resize:vertical}
label.fld input[readonly]{background:var(--grey-bg)}
.req::after{content:" *";color:var(--crit)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.list li:last-child{border:0}
.list .id{font-weight:600;white-space:nowrap}
.list .x{flex:1;color:var(--text)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.signin{max-width:420px;margin:12vh auto;text-align:center}
.signin p{color:var(--muted)}
@media (max-width:720px){
  header{flex-wrap:wrap;padding:10px 16px}
  nav{order:3;width:100%;margin:0;overflow:auto}
  nav button{padding:7px 9px}
  main{padding:16px}
  .fg .w2{grid-column:1/-1}
  .hb{grid-template-columns:100px 1fr 36px}
  input[type=search]{width:100%}
}
</style>

<script>
/* =====================================================================
   CONFIG — fill these in after the Entra app registration is created.
   While CLIENT_ID is left as the placeholder the app runs in DEMO mode
   (sample data from the existing registers, nothing is saved).
   ===================================================================== */
const CONFIG = {
  CLIENT_ID: "b159957f-f5c2-40a9-8802-7b3dea3e6b45",
  TENANT_ID: "ea9e105c-2df6-47ef-a8e3-b4aa1d788423",
  SP_HOST:   "conceptcompg.sharepoint.com",
  SITE_PATH: "/sites/MJE",
  LISTS: { inc: "MJE_Incidents", imp: "MJE_Improvements", risk: "MJE_Risks", rev: "MJE_RiskReviews", eq: "MJE_Equipment", tt: "MJE_TestTag", photos: "MJE_IncidentPhotos",
           staff: "MJE_Staff", course: "MJE_Courses", trn: "MJE_Training", area: "MJE_InspectionAreas", ins: "MJE_Inspections", leg: "MJE_Legislation" },
  SCOPES: ["Sites.ReadWrite.All", "User.Read"],
  RTW_HOURS_PER_DAY: 9
};
const DEMO = CONFIG.CLIENT_ID.startsWith("<<");
const SEED = {"inc":[],"imp":[],"risk":[],"rev":[],"eq":[],"tt":[],"staff":[],"course":[],"trn":[],"area":[],"ins":[],"leg":[]};

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
// Local-date YYYY-MM-DD (never toISOString — avoids the UTC+10 shift)
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = ymd(new Date());
const YEAR = TODAY.slice(0,4);
const addDays = (s, n) => { const [y,m,d] = s.split("-").map(Number); return ymd(new Date(y, m-1, d+n)); };
const fmtDate = s => { if (!s) return ""; const [y,m,d] = s.split("-"); return `${d}/${m}/${y}`; };
const num = v => (v === "" || v == null || isNaN(+v)) ? 0 : +v;
const kina = v => "K " + num(v).toLocaleString("en-AU", {minimumFractionDigits:0, maximumFractionDigits:0});
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }

/* ---------------- auth ---------------- */
let msalApp, account;
async function initAuth(){
  msalApp = new msal.PublicClientApplication({
    auth:{ clientId:CONFIG.CLIENT_ID, authority:`https://login.microsoftonline.com/${CONFIG.TENANT_ID}`, redirectUri: location.origin + location.pathname },
    cache:{ cacheLocation:"localStorage" }
  });
  await msalApp.initialize();
  const res = await msalApp.handleRedirectPromise();
  account = res?.account || msalApp.getAllAccounts()[0];
  if (account) msalApp.setActiveAccount(account);
}
async function token(){
  try { return (await msalApp.acquireTokenSilent({ scopes:CONFIG.SCOPES, account })).accessToken; }
  catch(e){ await msalApp.acquireTokenRedirect({ scopes:CONFIG.SCOPES, account }); }
}
const signIn  = () => msalApp.loginRedirect({ scopes:CONFIG.SCOPES });
const signOut = () => msalApp.logoutRedirect({ account });

/* ---------------- Graph data layer ---------------- */
let siteId;
async function graph(path, opts = {}){
  const r = await fetch(path.startsWith("http") ? path : "https://graph.microsoft.com/v1.0" + path, {
    ...opts, headers:{ Authorization:"Bearer " + await token(), "Content-Type":"application/json", ...(opts.headers||{}) }
  });
  if (!r.ok){ let m = r.status + " " + r.statusText; try{ m = (await r.json()).error.message; }catch{} const e = new Error(m); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
async function getSite(){ siteId = (await graph(`/sites/${CONFIG.SP_HOST}:${CONFIG.SITE_PATH}`)).id; }
async function loadList(key){
  let url = `/sites/${siteId}/lists/${CONFIG.LISTS[key]}/items?expand=fields&$top=999`, out = [];
  while (url){ const j = await graph(url); out.push(...j.value.map(i => ({ id:i.id, ...i.fields }))); url = j["@odata.nextLink"]; }
  return out;
}
// Lists added in later phases may not exist yet — don't let that stop the app
async function loadListSafe(key){
  try { return await loadList(key); }
  catch(e){ if (e.status === 404 || /not (be )?found|does not exist/i.test(e.message)) { S.missing.push(key); return []; } throw e; }
}
// Create/update with field fallback: strip any column SharePoint doesn't recognise and retry
async function saveItem(key, id, fields){
  const base = `/sites/${siteId}/lists/${CONFIG.LISTS[key]}/items`;
  let f = { ...fields }, stripped = [];
  for (let attempt = 0; attempt < 8; attempt++){
    try {
      const res = id ? await graph(`${base}/${id}/fields`, { method:"PATCH", body:JSON.stringify(f) })
                     : await graph(base, { method:"POST", body:JSON.stringify({ fields:f }) });
      if (stripped.length) console.warn("Columns not on list, skipped:", stripped);
      return id ? { id, ...res } : { id:res.id, ...res.fields };
    } catch(e){
      const m = /Field '([^']+)' is not recognized/i.exec(e.message);
      if (m && m[1] in f){ stripped.push(m[1]); delete f[m[1]]; continue; }
      throw e;
    }
  }
}

/* ---------------- state ---------------- */
const S = { inc:[], imp:[], risk:[], rev:[], eq:[], tt:[], staff:[], course:[], trn:[], area:[], ins:[], leg:[], missing:[], view:"dash", sort:{ inc:["Title",-1], imp:["Title",-1], risk:["Title",1], rev:["RegisterType",1], eq:["Title",1], tt:["NextTestDate",1], staff:["Title",1], course:["Title",1], trn:["Title",1], area:["Title",1], ins:["InspectionDate",-1], leg:["Title",1] },
            filt:{ inc:{ q:"", status:"", year:YEAR, sev:"" }, imp:{ q:"", status:"open", cat:"", pri:"" },
                   risk:{ q:"", reg:"", rating:"", status:"", cell:"", residual:false },
                   assets:{ sub:"eq" }, eq:{ q:"", cat:"", status:"" }, tt:{ q:"", state:"", all:false },
                   training:{ sub:"matrix" }, trn:{ q:"", dept:"", gaps:false }, comp:{ sub:"ins" }, ins:{ year:YEAR, missed:false }, leg:{ q:"", topic:"", state:"" }, rev:{ state:"" } } };

/* ---------------- field definitions ---------------- */
const INC_AGENCY = ["Slip, Trip, Fall","Vehicle / Mobile Plant","Electrical","Manual Handling","Hand / Power Tools","Falling Object","Hazardous Substance","Heat / Fire","N/A","Other"];
const INC_INJURY = ["Physical Injury","Electric Shock","Burn","Cut / Laceration","Illness / Disease","Property Damage Only","No Injury","N/A"];
const INC_SEV    = ["Near Miss","Minor Incident","Minor Injury","First Aid","Medical Treatment","Lost Time Injury","Serious / Notifiable"];
const INC_STATUS = ["Open","Under Investigation","Closed"];
const IMP_CAT = ["Safety","Quality","Environment","HR"];
const IMP_PRI = ["H","M","L"];
const IMP_REC = ["One-off","Ongoing","Fortnightly","Monthly","Quarterly","As needed"];
const IMP_STATUS = ["Open","In Progress","Ongoing","Closed"];

const INC_FORM = [
  ["Incident", [
    ["Title","Registration No","text",{ro:1}], ["IncidentDate","Date of incident","date",{req:1}], ["IncidentTime","Time","time"],
    ["FirstName","First name","text"], ["Surname","Surname","text"], ["Location","Location / site","text"],
    ["Description","Description","textarea",{w:3,req:1}],
  ]],
  ["Injury", [
    ["AgencyOfInjury","Agency of injury or disease","select",{opts:INC_AGENCY}], ["ActualInjury","Actual injury or disease","select",{opts:INC_INJURY}],
    ["BodyPart","Part of body injured / affected","text"], ["Severity","Severity","select",{opts:INC_SEV,req:1}],
  ]],
  ["Reporting & follow-up", [
    ["ReportedToDivision","Reported to division","text"], ["ReportedBy","Reported by","text"],
    ["IncidentStatus","Status","select",{opts:INC_STATUS,req:1}], ["LinkedImprovement","Linked improvement (IR no.)","text"],
    ["CorrectiveAction","Corrective action taken","textarea",{w:3}],
  ]],
  ["Time lost & cost (PGK)", [
    ["WorkersTimeLostHrs","Workers time lost (hrs)","number"], ["EstDirectCost","Est. direct cost","number"],
    ["AdminHours","Admin & follow-up hours","number"], ["EstIndirectCost","Est. indirect cost","number"],
    ["WorkcoverExcess","Workcover excess","number"], ["RTWProgram","Return to work program","select",{opts:["No","Yes"]}],
    ["RTWDays","Days on RTW","number"], ["RTWHours","RTW hours (9 hr days)","number",{ro:1}],
    ["ReductionWorkActivityPct","Reduction in work activity %","number"], ["EstCostRTW","Est. cost of RTW","number"],
    ["TotalEstCost","Total estimated cost","number",{ro:1}],
  ]],
];
const IMP_FORM = [
  ["Improvement", [
    ["Title","Serial No","text",{ro:1}], ["Category","Category","select",{opts:IMP_CAT,req:1}], ["Priority","Priority","select",{opts:IMP_PRI,req:1}],
    ["OriginatedBy","Originated by","text",{req:1}], ["DateIssued","Date issued","date",{req:1}], ["ActionedBy","Actioned by","text"],
    ["NatureOfImprovement","Nature of improvement","textarea",{w:3,req:1}],
    ["ProposedAction","Proposed improvement action","textarea",{w:3}],
  ]],
  ["Tracking", [
    ["Recurrence","Recurrence","select",{opts:IMP_REC}], ["TargetDate","Proposed completion date","date"],
    ["ImprovementStatus","Status","select",{opts:IMP_STATUS,req:1}], ["DateClosed","Date closed","date"],
    ["Remarks","Remarks","textarea",{w:3}],
  ]],
];

/* ================= RISK REGISTERS (Phase 2) ================= */
const REGISTERS = ["OH&S","Environmental","Quality","Task"];
const REF_PREFIX = { "OH&S":"H", "Environmental":"EA", "Quality":"Q", "Task":"TR" };
const LIKE = ["Rare","Unlikely","Possible","Likely","Almost Certain"];
const CONS = ["Insignificant","Minor","Moderate","Major","Catastrophic"];
const LV = { "Rare":1, "Unlikely":3, "Possible":5, "Likely":7, "Almost Certain":9 };
const CV = { "Insignificant":1, "Minor":6, "Moderate":11, "Major":16, "Catastrophic":21 };
// 5x5 matrix from MJE Risk Register (OPS-307-21): score = likelihood value + consequence value
const MX = {
  "Almost Certain":["Low","Medium","High","Very High","Very High"],
  "Likely":        ["Low","Medium","Medium","High","Very High"],
  "Possible":      ["Low","Medium","Medium","High","Very High"],
  "Unlikely":      ["Low","Low","Medium","Medium","High"],
  "Rare":          ["Low","Low","Medium","Medium","High"] };
const RATINGS = ["Low","Medium","High","Very High","Positive"];
const RISK_STATUS = ["Active","Planned","Proposed","Closed"];
const FREQS = ["Weekly","Fortnightly","Monthly","Quarterly","Annually"];
const matrix = (l, c) => (LV[l] && CV[c]) ? { score: LV[l] + CV[c], rating: MX[l][CONS.indexOf(c)] } : null;
const ratingPill = r => { const c = { Low:"p-ok", Medium:"p-warn", High:"p-bad", "Very High":"p-vh", Positive:"p-info" }[r]; return r ? `<span class="pill ${c||"p-grey"}">${esc(r)}</span>` : ""; };
const addMonths = (s, n) => { const [y,m,d] = s.split("-").map(Number); return ymd(new Date(y, m-1+n, d)); };
const nextDue = r => { const d = r.ReviewDate || r.LastReviewed; if (!d) return "";
  return { Weekly:addDays(d,7), Fortnightly:addDays(d,14), Monthly:addMonths(d,1), Quarterly:addMonths(d,3), Annually:addMonths(d,12) }[r.ReviewFrequency] || ""; };
const revState = r => { const n = nextDue(r); if (!n) return "none"; if (n < TODAY) return "overdue"; if (n <= addDays(TODAY, 14)) return "soon"; return "ok"; };
const revPill = r => { const s = revState(r); return { none:`<span class="pill p-bad">Not recorded</span>`, overdue:`<span class="pill p-crit">Overdue</span>`, soon:`<span class="pill p-warn">Due soon</span>`, ok:`<span class="pill p-ok">On track</span>` }[s]; };
const openRisk = r => r.RiskType !== "Opportunity" && r.RiskStatus !== "Closed";

const RISK_FORM = [
  ["Risk", [
    ["Title","Ref","text",{ro:1}], ["RegisterType","Register","select",{opts:REGISTERS,req:1}], ["RiskType","Risk or opportunity","select",{opts:["Risk","Opportunity"],req:1}],

function heatmap(rows, residual){
  const lk = residual ? "ResidualLikelihood" : "Likelihood", ck = residual ? "ResidualConsequence" : "Consequence";
  const cnt = {}; let plotted = 0;
  rows.forEach(r => { if (LV[r[lk]] && CV[r[ck]]) { const k = r[lk] + "|" + r[ck]; cnt[k] = (cnt[k]||0) + 1; plotted++; } });
  const sel = S.filt.risk.cell;
  let h = `<div class="hm"><div class="hm-y">Likelihood</div><div class="hm-grid"><span></span>`;
  h += CONS.map(c => `<span class="hm-h">${c}</span>`).join("");
  [...LIKE].reverse().forEach(l => {
    h += `<span class="hm-r">${l}</span>`;
    CONS.forEach((c, ci) => { const k = l + "|" + c, n = cnt[k] || 0, rt = MX[l][ci];
      h += `<button class="hm-c hm-${rt.replace(" ","")} ${n?"":"z"} ${sel===k?"sel":""}" data-cell="${k}" title="${l} × ${c}: ${rt} (score ${LV[l]+CV[c]}) — ${n} risk${n===1?"":"s"}">${n || ""}</button>`; });
  });
  h += `</div><div class="hm-x">Consequence</div></div>`;
  const missing = rows.length - plotted;
  if (missing) h += `<p class="count">${missing} item${missing===1?"":"s"} not plotted (no ${residual?"residual ":""}likelihood/consequence recorded${residual?"":", e.g. Environmental ratings or opportunities"}).</p>`;
  return h;
}

      ${rc.map(r => `<div class="hb"><span>${r.label}</span><span class="t"><i style="width:${r.total/rcMax*100}%;background:${rcCol[r.label]}"></i></span><span class="n">${r.total}</span></div>`).join("")}
      <p class="count" style="margin-top:12px">Scores use MJE's 5×5 matrix: likelihood (Rare 1 … Almost Certain 9) + consequence (Insignificant 1 … Catastrophic 21).</p></div>
  </div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search activity, hazard, controls…" value="${esc(f.q)}">
    <select class="f" data-f="risk:rating">${opt(RATINGS, f.rating, f.residual ? "All residual ratings" : "All ratings")}<option value="hi" ${f.rating==="hi"?"selected":""}>High & very high (open risks)</option></select>
    <select class="f" data-f="risk:status">${opt(RISK_STATUS, f.status, "All statuses")}</select>
    ${f.cell ? `<button class="chip on" data-cell="${esc(f.cell)}">${esc(cl)} × ${esc(cc)} ✕</button>` : ""}
    <span class="count">${rows.length} of ${base.length}</span>
  </div>
  <div class="tablewrap"><table><thead><tr>
    ${th("risk","Title","Ref")}${th("risk","RegisterType","Register")}${th("risk","ActivityArea","Activity / task")}<th>Hazard / risk</th>${th("risk","RiskScore","Score")}${th("risk","Rating","Rating")}${th("risk","ResidualScore","Residual")}${th("risk","Responsible","Responsible")}${th("risk","RiskStatus","Status")}

    return `<tr data-open="risk:${r.id}"><td class="mono"><b>${esc(r.Title)}</b></td><td>${esc(r.RegisterType)}</td>
    <td class="clip"><div>${esc(r.ActivityArea)}${r.Task ? ` — ${esc(r.Task)}` : ""}</div></td><td class="clip"><div>${esc(r.Hazard)}</div></td>
    <td class="mono">${r.RiskScore ?? ""}</td><td>${ratingPill(r.Rating)}${off ? ` <span class="flag" title="Matrix gives ${m.rating} for ${r.Likelihood} × ${r.Consequence}">≠ matrix</span>` : ""}</td>
    <td>${ratingPill(r.ResidualRating)}</td><td>${esc(r.Responsible)}</td><td>${statPill(r.RiskStatus)}</td></tr>`; }).join("")}
  </tbody></table>${rows.length ? "" : `<div class="empty">No risks match</div>`}</div>

  </tr></thead><tbody>
  ${revs.map(r => `<tr data-open="rev:${r.id}"><td><b>${esc(r.Title)}</b></td><td>${esc(r.RegisterType)}</td><td class="mono">${esc(r.RiskRefs)}</td><td>${esc(r.ReviewFrequency)}</td>

async function loadPhotos(title){

  if (DEMO) { el.innerHTML = `<span class="count">Photos aren't saved in demo mode.</span>`; return; }
  const d = await photoDrive();

  if (!title) { el.innerHTML = ""; return; }
  el.innerHTML = `<span class="count">Loading photos…</span>`;
  try {

    el.innerHTML = j.value.length ? j.value.map(p => `<a class="ph" href="${esc(p.webUrl)}" target="_blank" rel="noopener"><img src="${esc(p.thumbnails?.[0]?.medium?.url || "")}" alt="${esc(p.name)}"></a>`).join("") : "";
  } catch(e){ el.innerHTML = ""; }

async function shrink(file){
  try {
    const img = await createImageBitmap(file), s = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.8));
  } catch(e){ return file; }
}
async function uploadPhotos(title){
  if (!photoQueue.length) return 0;
  if (DEMO) { photoQueue = []; return 0; }
  const d = await photoDrive(); if (!d) throw new Error("the photo library isn't set up yet");
  let n = 0;
  for (const [i, f] of photoQueue.entries()){
    const blob = await shrink(f), name = `${title}_${Date.now()}_${i+1}.jpg`;
    const r = await fetch(`https://graph.microsoft.com/v1.0/drives/${d}/root:/${encodeURIComponent(title)}/${name}:/content`,
      { method:"PUT", headers:{ Authorization:"Bearer " + await token(), "Content-Type":"image/jpeg" }, body: blob });
    if (!r.ok) throw new Error(r.status === 403 ? "you don't have permission to add photos" : `upload failed (${r.status})`);
    n++;
  }
  photoQueue = []; return n;
}

/* ---------------- derived ---------------- */
const isOverdue = i => i.ImprovementStatus !== "Closed" && (i.Recurrence || "One-off") === "One-off" && i.TargetDate && i.TargetDate < TODAY;
const isDueSoon = i => i.ImprovementStatus !== "Closed" && (i.Recurrence || "One-off") === "One-off" && i.TargetDate && i.TargetDate >= TODAY && i.TargetDate <= addDays(TODAY, 30);
function calcIncident(f){
  f.RTWHours = num(f.RTWDays) * CONFIG.RTW_HOURS_PER_DAY;
  f.TotalEstCost = num(f.EstDirectCost) + num(f.EstIndirectCost) + num(f.WorkcoverExcess) + num(f.EstCostRTW);
  return f;
}
function nextNumber(list, prefix, width = 2){
  const re = new RegExp("^" + prefix.replace(/[-]/g,"\\-") + "(\\d+)$");
  const max = list.reduce((m, i) => { const r = re.exec(i.Title || ""); return r ? Math.max(m, +r[1]) : m; }, 0);
  return prefix + String(max + 1).padStart(width, "0");
}

/* ---------------- pills ---------------- */
const sevPill = s => { const c = {"Near Miss":"p-info","Minor Incident":"p-grey","Minor Injury":"p-warn","First Aid":"p-warn","Medical Treatment":"p-bad","Lost Time Injury":"p-crit","Serious / Notifiable":"p-crit"}[s]; return s ? `<span class="pill ${c||"p-grey"}">${esc(s)}</span>` : ""; };
const statPill = s => { const c = {"Open":"p-warn","Under Investigation":"p-info","In Progress":"p-info","Ongoing":"p-grey","Closed":"p-ok"}[s]; return s ? `<span class="pill ${c||"p-grey"}">${esc(s)}</span>` : ""; };
const priPill = p => { const c = {H:"p-crit",M:"p-warn",L:"p-grey"}[p]; return p ? `<span class="pill ${c}">${esc(p)}</span>` : ""; };

/* ---------------- views ---------------- */
function render(){
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === S.view));
  const banner = DEMO ? `<div class="banner">Demo mode — showing the existing registers as sample data. Changes are kept only until you refresh. Add the app registration details to CONFIG to connect to SharePoint.</div>` : "";
  const tb = S.tile && S.view !== "dash" ? `<div class="filterbar" style="--fbc:var(--c-${GO_LABEL[S.tile][1]})"><span class="ft">Showing from dashboard:</span> <b>${esc(GO_LABEL[S.tile][0])}</b><span class="grow"></span><button class="fchip" data-clearall="1">✕ Clear filter</button></div>` : "";
  $("#main").innerHTML = banner + tb + ({ dash:viewDash, inc:viewInc, imp:viewImp, risk:viewRisk, assets:viewAssets, training:viewTraining, comp:viewCompliance }[S.view])();
  bindView();
}

function hbars(rows, max, colors){
  return rows.map(r => `<div class="hb"><span>${esc(r.label)}</span><span class="t">${r.parts.map((p,k)=>`<i style="width:${max? (p/max*100):0}%;background:${colors[k]}"></i>`).join("")}</span><span class="n">${r.total}</span></div>`).join("");
}

function viewDash(){
  const incY = S.inc.filter(i => (i.IncidentDate||"").startsWith(YEAR));

  const lti = incY.filter(i => i.Severity === "Lost Time Injury").length;
  const cost = incY.reduce((a,i) => a + num(i.TotalEstCost), 0);
  const impOpen = S.imp.filter(i => i.ImprovementStatus !== "Closed");
  const overdue = S.imp.filter(isOverdue).sort((a,b) => a.TargetDate.localeCompare(b.TargetDate));
  const soon = S.imp.filter(isDueSoon);
  const closedY = S.imp.filter(i => i.ImprovementStatus === "Closed" && (i.DateClosed||"").startsWith(YEAR)).length;

  const cats = IMP_CAT.map(c => { const all = S.imp.filter(i => i.Category === c); const cl = all.filter(i => i.ImprovementStatus === "Closed").length; return { label:c, parts:[cl, all.length - cl], total:all.length }; });
  const catMax = Math.max(1, ...cats.map(c => c.total));
  const sev = INC_SEV.map(s => { const n = incY.filter(i => i.Severity === s).length; return { label:s, parts:[n], total:n }; }).filter(r => r.total);
  const sevMax = Math.max(1, ...sev.map(s => s.total));
  const riskOn = !S.missing.includes("risk");
  const hiRisks = S.risk.filter(r => openRisk(r) && (r.Rating === "High" || r.Rating === "Very High"))
    .sort((a,b) => (b.RiskScore||0) - (a.RiskScore||0) || String(a.Title).localeCompare(String(b.Title), undefined, {numeric:true}));
  const vh = hiRisks.filter(r => r.Rating === "Very High").length;
  const revDue = S.rev.filter(r => ["overdue","none","soon"].includes(revState(r)))
    .sort((a,b) => (nextDue(a)||"0").localeCompare(nextDue(b)||"0"));
  const revOver = S.rev.filter(r => ["overdue","none"].includes(revState(r))).length;
  const ttOn = !S.missing.includes("tt"), ttL = ttLatest(), ttOver = ttL.filter(r => ["overdue","fail"].includes(ttState(r))).length;
  const trnOn = !S.missing.includes("trn") && !S.missing.includes("staff");
  const mand = S.trn.filter(r => r.Requirement === "Mandatory" && activeStaff().some(s => s.Title === r.StaffName));
  const trnPct = mand.length ? Math.round(mand.filter(r => ["done","expiring"].includes(trnState(r))).length / mand.length * 100) : 0;
  const insOn = !S.missing.includes("area");
  const insMissed = insOn ? S.area.reduce((n, a) => n + MONTHS.filter((m, mi) => areaMonthState(a, YEAR, mi).overdue).length, 0) : 0;
  const legOn = !S.missing.includes("leg"), legDueN = S.leg.filter(r => legState(r) !== "ok").length;

  return `
  <div class="grid kpis dash">
    <div role="button" tabindex="0" data-go="inc" title="Open the matching register" class="card kpi k-inc"><div class="l">Incidents ${YEAR}</div><div class="v">${incY.length}</div><div class="s">${incOpen.length} open</div></div>
    <div role="button" tabindex="0" data-go="lti" title="Open the matching register" class="card kpi k-inc ${lti?"alert":""}"><div class="l">Lost time injuries ${YEAR}</div><div class="v">${lti}</div><div class="s">year to date</div></div>
    <div role="button" tabindex="0" data-go="cost" title="Open the matching register" class="card kpi k-inc"><div class="l">Est. incident cost ${YEAR}</div><div class="v">${kina(cost)}</div><div class="s">direct + indirect + RTW</div></div>
    <div role="button" tabindex="0" data-go="impopen" title="Open the matching register" class="card kpi k-imp"><div class="l">Open improvements</div><div class="v">${impOpen.length}</div><div class="s">${closedY} closed in ${YEAR}</div></div>
    <div role="button" tabindex="0" data-go="impover" title="Open the matching register" class="card kpi k-imp ${overdue.length?"alert":""}"><div class="l">Overdue actions</div><div class="v">${overdue.length}</div><div class="s">${soon.length} due in next 30 days</div></div>
    ${riskOn ? `<div role="button" tabindex="0" data-go="risk" title="Open the matching register" class="card kpi k-risk"><div class="l">High & very high risks</div><div class="v">${hiRisks.length}</div><div class="s">${vh} very high · before controls</div></div>
    <div role="button" tabindex="0" data-go="rev" title="Open the matching register" class="card kpi k-rev ${revOver?"alert":""}"><div class="l">Risk reviews overdue</div><div class="v">${revOver}</div><div class="s">of ${S.rev.length} scheduled reviews</div></div>` : ""}
    ${ttOn ? `<div role="button" tabindex="0" data-go="tt" title="Open the matching register" class="card kpi k-tt ${ttOver?"alert":""}"><div class="l">Test & tag overdue</div><div class="v">${ttOver}</div><div class="s">of ${ttL.length} tagged items</div></div>` : ""}
    ${trnOn ? `<div role="button" tabindex="0" data-go="trn" title="Open the matching register" class="card kpi k-trn ${trnPct<80?"alert":""}"><div class="l">Mandatory training</div><div class="v">${trnPct}%</div><div class="s">of ${mand.length} requirements current</div></div>` : ""}
    ${insOn ? `<div role="button" tabindex="0" data-go="ins" title="Open the matching register" class="card kpi k-ins ${insMissed?"alert":""}"><div class="l">Inspections missed ${YEAR}</div><div class="v">${insMissed}</div><div class="s">planned months passed</div></div>` : ""}
    ${legOn ? `<div role="button" tabindex="0" data-go="leg" title="Open the matching register" class="card kpi k-leg ${legDueN?"alert":""}"><div class="l">Legislation reviews due</div><div class="v">${legDueN}</div><div class="s">monthly review</div></div>` : ""}
  </div>
  <div class="grid two">
    <div class="card"><h3>Improvements by category</h3>
      <div class="legend"><span><i style="background:var(--ok)"></i>Closed</span><span><i style="background:var(--accent)"></i>Not closed</span></div>
      ${hbars(cats, catMax, ["var(--ok)","var(--accent)"])}</div>
    <div class="card"><h3>Incidents by severity — ${YEAR}</h3>
      ${sev.length ? hbars(sev, sevMax, ["var(--info)"]) : `<div class="empty">No incidents recorded this year</div>`}</div>
    <div class="card"><h3>Overdue improvement actions</h3>
      ${overdue.length ? `<ul class="list">${overdue.slice(0,8).map(i => `<li data-open="imp:${i.id}"><span class="id">${esc(i.Title)}</span><span class="x">${esc(i.NatureOfImprovement)}</span><span class="mono" style="color:var(--crit)">${fmtDate(i.TargetDate)}</span></li>`).join("")}</ul>${overdue.length>8?`<p class="count">+${overdue.length-8} more — see Improvements</p>`:""}` : `<div class="empty">Nothing overdue</div>`}</div>
    <div class="card"><h3>Recent incidents</h3>
      ${S.inc.length ? `<ul class="list">${[...S.inc].sort((a,b)=>(b.IncidentDate||"").localeCompare(a.IncidentDate||"")).slice(0,8).map(i => `<li data-open="inc:${i.id}"><span class="id">${esc(i.Title)}</span><span class="x">${esc([[i.FirstName,i.Surname].filter(Boolean).join(" "), i.AgencyOfInjury || i.Severity].filter(Boolean).join(" · ") || "Details not recorded")}</span><span class="mono">${fmtDate(i.IncidentDate)}</span></li>`).join("")}</ul>` : `<div class="empty">No incidents</div>`}</div>
    ${riskOn ? `<div class="card"><h3>Highest risks (before controls)</h3>
      ${hiRisks.length ? `<ul class="list">${hiRisks.slice(0,8).map(r => `<li data-open="risk:${r.id}"><span class="id">${esc(r.Title)}</span><span class="x">${esc(r.ActivityArea)}${r.Task ? " — " + esc(r.Task) : ""}</span>${ratingPill(r.Rating)}</li>`).join("")}</ul>${hiRisks.length>8?`<p class="count"><a href="#" data-goto="risk">+${hiRisks.length-8} more — see Risks</a></p>`:""}` : `<div class="empty">No high risks</div>`}</div>
    <div class="card"><h3>Risk reviews due</h3>
      ${revDue.length ? `<ul class="list">${revDue.slice(0,8).map(r => `<li data-open="rev:${r.id}"><span class="id">${esc(r.RegisterType)}</span><span class="x">${esc(r.Title)} · ${esc(r.ReviewFrequency||"")}</span>${revPill(r)}</li>`).join("")}</ul>` : `<div class="empty">All reviews on track</div>`}</div>` : ""}
  </div>`;
}

function sortRows(rows, key){
  const [col, dir] = S.sort[key];
  return [...rows].sort((a,b) => { const x = a[col] ?? "", y = b[col] ?? ""; return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), undefined, {numeric:true})) * dir; });
}
const th = (key, col, label) => { const [c,d] = S.sort[key]; return `<th data-sort="${key}:${col}">${label}${c===col ? (d>0?" ▲":" ▼") : ""}</th>`; };
const opt = (vals, cur, all) => `<option value="">${all}</option>` + vals.map(v => `<option ${v===cur?"selected":""} value="${esc(v)}">${esc(v)}</option>`).join("");

function viewInc(){
  const f = S.filt.inc;
  const years = [...new Set(S.inc.map(i => (i.IncidentDate||"").slice(0,4)).filter(Boolean).concat(YEAR))].sort().reverse();
  const q = f.q.toLowerCase();
  const rows = sortRows(S.inc.filter(i =>
    (!f.year || (i.IncidentDate||"").startsWith(f.year)) && (!f.status || i.IncidentStatus === f.status) && (!f.sev || i.Severity === f.sev) &&
    (!q || [i.Title,i.FirstName,i.Surname,i.Description,i.AgencyOfInjury,i.BodyPart,i.Location].join(" ").toLowerCase().includes(q))), "inc");
  return `
  <div class="bar"><h2>Safety Incident Register</h2><span class="grow"></span>
    <button class="btn" data-act="csv:inc">Export CSV</button><button class="btn primary" data-act="new:inc">+ Report incident</button></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search name, description, injury…" value="${esc(f.q)}">
    <select class="f" data-f="inc:year">${opt(years, f.year, "All years")}</select>
    <select class="f" data-f="inc:status">${opt(INC_STATUS, f.status, "All statuses")}</select>
    <select class="f" data-f="inc:sev">${opt(INC_SEV, f.sev, "All severities")}</select>
    <span class="count">${rows.length} of ${S.inc.length}</span>
  </div>
  <div class="tablewrap"><table><thead><tr>
    ${th("inc","Title","Reg No")}${th("inc","IncidentDate","Date")}${th("inc","Surname","Person")}<th>Description</th>${th("inc","AgencyOfInjury","Agency")}${th("inc","Severity","Severity")}${th("inc","IncidentStatus","Status")}${th("inc","TotalEstCost","Est. cost")}
  </tr></thead><tbody>
  ${rows.map(i => `<tr data-open="inc:${i.id}"><td class="mono"><b>${esc(i.Title)}</b></td><td class="mono">${fmtDate(i.IncidentDate)} ${esc(i.IncidentTime||"")}</td>
    <td>${esc([i.FirstName,i.Surname].filter(Boolean).join(" "))}</td><td class="clip"><div>${esc(i.Description)}</div></td><td>${esc(i.AgencyOfInjury)}</td>
    <td>${sevPill(i.Severity)}</td><td>${statPill(i.IncidentStatus)}</td><td class="mono">${num(i.TotalEstCost) ? kina(i.TotalEstCost) : ""}</td></tr>`).join("")}
  </tbody></table>${rows.length ? "" : `<div class="empty">No incidents match</div>`}</div>`;
}

function viewImp(){
  const f = S.filt.imp, q = f.q.toLowerCase();
  const rows = sortRows(S.imp.filter(i =>
    (f.status === "" || (f.status === "open" ? i.ImprovementStatus !== "Closed" : f.status === "overdue" ? isOverdue(i) : i.ImprovementStatus === f.status)) &&
    (!f.cat || i.Category === f.cat) && (!f.pri || i.Priority === f.pri) &&
    (!q || [i.Title,i.NatureOfImprovement,i.ProposedAction,i.ActionedBy,i.Remarks].join(" ").toLowerCase().includes(q))), "imp");
  const statusOpts = `<option value="">All statuses</option><option value="open" ${f.status==="open"?"selected":""}>Not closed</option><option value="overdue" ${f.status==="overdue"?"selected":""}>Overdue</option>` + IMP_STATUS.map(s => `<option ${s===f.status?"selected":""}>${s}</option>`).join("");
  return `
  <div class="bar"><h2>Improvement Register</h2><span class="grow"></span>
    <button class="btn" data-act="csv:imp">Export CSV</button><button class="btn primary" data-act="new:imp">+ New improvement</button></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search improvement, action, remarks…" value="${esc(f.q)}">
    <select class="f" data-f="imp:status">${statusOpts}</select>
    <select class="f" data-f="imp:cat">${opt(IMP_CAT, f.cat, "All categories")}</select>
    <select class="f" data-f="imp:pri">${opt(IMP_PRI, f.pri, "All priorities")}</select>
    <span class="count">${rows.length} of ${S.imp.length}</span>
  </div>
  <div class="tablewrap"><table><thead><tr>
    ${th("imp","Title","Serial")}${th("imp","Category","Category")}${th("imp","Priority","Pri")}<th>Nature of improvement</th>${th("imp","ActionedBy","Actioned by")}${th("imp","TargetDate","Due")}${th("imp","ImprovementStatus","Status")}
  </tr></thead><tbody>
  ${rows.map(i => { const od = isOverdue(i); return `<tr data-open="imp:${i.id}"><td class="mono"><b>${esc(i.Title)}</b></td><td>${esc(i.Category)}</td><td>${priPill(i.Priority)}</td>
    <td class="clip"><div>${esc(i.NatureOfImprovement)}</div></td><td>${esc(i.ActionedBy)}</td>
    <td class="mono" ${od?'style="color:var(--crit);font-weight:600"':""}>${i.TargetDate ? fmtDate(i.TargetDate) : esc(i.Recurrence||"")}${od?" · overdue":""}</td>
    <td>${statPill(i.ImprovementStatus)}</td></tr>`; }).join("")}
  </tbody></table>${rows.length ? "" : `<div class="empty">No improvements match</div>`}</div>`;
}

function bindView(){
  const q = $("#q");
  if (q) q.oninput = () => { ({ assets: S.filt[S.filt.assets.sub], training: S.filt.trn, comp: S.filt.leg }[S.view] || S.filt[S.view]).q = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); };
  document.querySelectorAll("[data-f]").forEach(s => s.onchange = () => { const [k,f] = s.dataset.f.split(":"); S.filt[k][f] = s.value; S.tile = null; render(); });
  document.querySelectorAll("[data-sort]").forEach(h => h.onclick = () => { const [k,c] = h.dataset.sort.split(":"); const cur = S.sort[k]; S.sort[k] = [c, cur[0]===c ? -cur[1] : 1]; render(); });
  document.querySelectorAll("[data-open]").forEach(r => r.onclick = () => { const [k,id] = r.dataset.open.split(":"); openForm(k, S[k].find(i => String(i.id) === id)); });
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => { const [a,k] = b.dataset.act.split(":"); a === "new" ? openForm(k) : exportCsv(k); });
  document.querySelectorAll("[data-reg]").forEach(b => b.onclick = () => { S.filt.risk.reg = b.dataset.reg; S.filt.risk.cell = ""; render(); });
  document.querySelectorAll("[data-res]").forEach(b => b.onclick = () => { S.filt.risk.residual = b.dataset.res === "1"; S.filt.risk.cell = ""; S.filt.risk.rating = ""; render(); });
  document.querySelectorAll("[data-cell]").forEach(b => b.onclick = () => { if (b.classList.contains("z")) return; const c = b.dataset.cell; S.filt.risk.cell = S.filt.risk.cell === c ? "" : c; render(); });
  document.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { resetFilt(); S.filt.assets.sub = b.dataset.sub; render(); });
  document.querySelectorAll("[data-ttall]").forEach(b => b.onclick = () => { S.filt.tt.all = b.dataset.ttall === "1"; render(); });
  document.querySelectorAll("[data-tsub]").forEach(b => b.onclick = () => { resetFilt(); S.filt.training.sub = b.dataset.tsub; render(); });
  document.querySelectorAll("[data-csub]").forEach(b => b.onclick = () => { resetFilt(); S.filt.comp.sub = b.dataset.csub; render(); });
  document.querySelectorAll("[data-mx]").forEach(b => b.onclick = () => { const [n, c] = b.dataset.mx.split("|"); const r = trnFor(n, c);
    r ? openForm("trn", r) : openForm("trn", undefined, { StaffName:n, Course:c, Requirement:"Extended" }); });
  document.querySelectorAll("[data-newins]").forEach(b => b.onclick = () => { const [a, mi] = b.dataset.newins.split("|"); const y = S.filt.ins.year, mm = pad(+mi + 1);
    openForm("ins", undefined, { Area:a, InspectionDate: TODAY.startsWith(`${y}-${mm}`) ? TODAY : `${y}-${mm}-01` }); });
  document.querySelectorAll("[data-go]").forEach(b => { b.onclick = () => goTile(b.dataset.go); b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goTile(b.dataset.go); } }; });
  document.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => { const k = b.dataset.clear;
    if (k === "rev") S.filt.rev.state = ""; if (k === "trn") S.filt.trn.gaps = false; if (k === "ins") S.filt.ins.missed = false; render(); });
  document.querySelectorAll("[data-revover]").forEach(b => b.onclick = () => { S.tile = null; S.filt.rev.state = S.filt.rev.state ? "" : "due"; render(); $("#revSection")?.scrollIntoView({ block:"start" }); });
  document.querySelectorAll("[data-gaps]").forEach(b => b.onclick = () => { S.tile = null; S.filt.trn.gaps = !S.filt.trn.gaps; render(); });
  document.querySelectorAll("[data-missed]").forEach(b => b.onclick = () => { S.tile = null; S.filt.ins.missed = !S.filt.ins.missed; render(); });
  document.querySelectorAll("[data-clearall]").forEach(b => b.onclick = () => { resetFilt(); render(); window.scrollTo({ top:0 }); });
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { S.view = b.dataset.goto; render(); });
}

/* ---------------- dashboard tile links ---------------- */
function resetFilt(){
  S.tile = null;
  S.sort.inc = ["Title",-1]; S.sort.imp = ["Title",-1]; S.sort.risk = ["Title",1];
  Object.assign(S.filt.inc, { q:"", status:"", year:YEAR, sev:"" }); Object.assign(S.filt.imp, { q:"", status:"open", cat:"", pri:"" });
  Object.assign(S.filt.risk, { q:"", reg:"", rating:"", status:"", cell:"", residual:false }); S.filt.rev.state = "";
  Object.assign(S.filt.tt, { q:"", state:"", all:false }); Object.assign(S.filt.trn, { q:"", dept:"", gaps:false });
  Object.assign(S.filt.ins, { year:YEAR, missed:false }); Object.assign(S.filt.leg, { q:"", topic:"", state:"" });
}
const GO_LABEL = { inc:["Incidents in "+YEAR,"inc"], lti:["Lost time injuries in "+YEAR,"inc"], cost:["Incidents in "+YEAR+", highest cost first","inc"],
  impopen:["Open improvements","imp"], impover:["Overdue improvement actions","imp"], risk:["Open high & very high risks, highest score first","risk"],
  rev:["Risk reviews overdue or not recorded","rev"], tt:["Items overdue for test or failed last test","tt"], trn:["Staff with missing or expired mandatory training","trn"],
  ins:["Areas with missed inspections in "+YEAR,"ins"], leg:["Legislation due for review","leg"] };
const GO = {
  inc:      () => { S.view = "inc"; S.sort.inc = ["Title",-1]; },
  lti:      () => { S.view = "inc"; S.filt.inc.sev = "Lost Time Injury"; },
  cost:     () => { S.view = "inc"; S.sort.inc = ["TotalEstCost",-1]; },
  impopen:  () => { S.view = "imp"; S.filt.imp.status = "open"; },
  impover:  () => { S.view = "imp"; S.filt.imp.status = "overdue"; S.sort.imp = ["TargetDate",1]; },
  risk:     () => { S.view = "risk"; S.filt.risk.rating = "hi"; S.sort.risk = ["RiskScore",-1]; },
  rev:      () => { S.view = "risk"; S.filt.rev.state = "due"; return "#revSection"; },
  tt:       () => { S.view = "assets"; S.filt.assets.sub = "tt"; S.filt.tt.state = "attn"; },
  trn:      () => { S.view = "training"; S.filt.training.sub = "matrix"; S.filt.trn.gaps = true; },
  ins:      () => { S.view = "comp"; S.filt.comp.sub = "ins"; S.filt.ins.missed = true; },
  leg:      () => { S.view = "comp"; S.filt.comp.sub = "leg"; S.filt.leg.state = "due"; },
};
function goTile(k){ resetFilt(); const anchor = GO[k](); S.tile = k; render(); const el = anchor && $(anchor); el ? el.scrollIntoView({ behavior:"smooth", block:"start" }) : window.scrollTo({ top:0 }); }

/* ---------------- form ---------------- */
let editing = null;
function fieldHtml([name, label, type, o = {}], v){
  const cls = `fld ${o.w===3?"w3":o.w===2?"w2":""}`, lab = `<span class="${o.req?"req":""}">${label}</span>`;
  const attrs = `name="${name}" ${o.req?"required":""} ${o.ro?"readonly tabindex=-1":""}`;
  if (type === "textarea") return `<label class="${cls}">${lab}<textarea ${attrs}>${esc(v)}</textarea></label>`;
  if (type === "select"){
    const base = o.dyn ? (o.dyn === "staff" ? activeStaff() : S[o.dyn]).map(r => r.Title).sort((a,b) => a.localeCompare(b)) : o.opts;
    const list = base.includes(v) || !v ? base : [...base, v];     // keep fill-in values
    return `<label class="${cls}">${lab}<select ${attrs}><option value=""></option>${list.map(x => `<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`;
  }
  return `<label class="${cls}">${lab}<input type="${type}" ${type==="number"?'step="any" min="0"':""} ${attrs} value="${esc(v ?? "")}"></label>`;
}
function newTitle(key, f = {}){
  if (key === "inc") return nextNumber(S.inc, YEAR + "-");
  if (key === "imp") return nextNumber(S.imp, `IR-${YEAR}-`);
  if (key === "risk") return nextNumber(S.risk.filter(r => r.RegisterType === f.RegisterType), REF_PREFIX[f.RegisterType] || "R");
  if (key === "eq") return nextNumber(S.eq, "EQ-", 3);
  if (key === "ins") return nextNumber(S.ins, `INS-${YEAR}-`, 3);
  if (key === "trn") return `${f.StaffName} — ${f.Course}`;
  if (key === "tt") return nextNumber(S.tt, `TT-${YEAR}-`, 3);
  return f.Title || "";
}
function newDefaults(key){
  if (key === "inc") return { Title: newTitle("inc"), IncidentDate: TODAY, IncidentStatus: "Open", RTWProgram: "No" };
  if (key === "imp") return { Title: newTitle("imp"), DateIssued: TODAY, ImprovementStatus: "Open", Recurrence: "One-off", Priority: "M" };
  if (key === "eq") return { Title: newTitle("eq"), Category: "Tool", EquipStatus: "In service" };
  if (key === "staff") return { StaffStatus: "Active", Department: "Service" };
  if (key === "course") return {};
  if (key === "trn") return { Requirement: "Mandatory" };
  if (key === "area") return { Frequency: "Annually" };
  if (key === "ins") return { Title: newTitle("ins"), InspectionDate: TODAY, Outcome: "Satisfactory" };
  if (key === "leg") return { LegType: "Act", ReviewFrequency: "Monthly", ComplianceStatus: "Not assessed" };
  if (key === "tt") return { Title: newTitle("tt"), TestDate: TODAY, TestPeriod: "Yearly", NextTestDate: addMonths(TODAY, 12), Result: "Pass", Location: "Office" };
  const reg = S.filt.risk.reg || "OH&S";
  if (key === "risk") return { Title: newTitle("risk", { RegisterType: reg }), RegisterType: reg, RiskType: "Risk", RiskStatus: "Active" };
  return { RegisterType: reg, Signed: "No" };
}
function openForm(key, item, prefill = {}){
  editing = { key, item };
  photoQueue = [];
  const defs = FORMS[key];
  const v = item ? { ...item } : { ...newDefaults(key), ...prefill };
  const setTitle = t => $("#dlgTitle").textContent = (item ? "" : "New ") + NAMES[key].toLowerCase().replace(/^./, c => c.toUpperCase()) + (t ? " " + t : "");
  const KIND = { inc:"Safety Incident Register", imp:"Improvement Register", risk:"Risk Register", rev:"Risk Review Schedule", eq:"Plant & Equipment Register", tt:"Test & Tag Register", staff:"Training & Competency · Staff", course:"Training & Competency · Courses", trn:"Training & Competency", area:"Workplace Inspection Program", ins:"Workplace Inspection", leg:"Legislative Compliance Register" };
  $("#dlg").className = "f-" + key;
  $("#dlgKind").textContent = KIND[key] + (key === "risk" && v.RegisterType ? " · " + v.RegisterType : "");
  setTitle(v.Title);
  const sections = defs.map(([leg, fs]) => `<fieldset><legend>${leg}</legend><div class="fg">${fs.map(f => fieldHtml(f, v[f[0]])).join("")}</div></fieldset>`);
  if (key === "inc") sections.splice(1, 0, photosHtml());      // photos straight after the incident details
  $("#dlgBody").innerHTML = sections.join("")
    + (key === "risk" ? `<p class="hint" id="mxHint"></p>` : "")
    + (key === "rev" ? `<button type="button" class="btn" id="revToday">✓ Record a review today</button>` : "")
    + (key === "tt" && item ? `<button type="button" class="btn" id="ttRetest">↻ Record a new test for this item</button>` : "")
    + (key === "leg" ? `<button type="button" class="btn" id="legToday">✓ Record a review today</button>` : "")
;
  if (key === "inc"){
    $("#phInput").onchange = e => { [...e.target.files].forEach(f => { f._url = URL.createObjectURL(f); photoQueue.push(f); }); e.target.value = ""; renderQueue(); };
    loadPhotos(item?.Title);
  }
  if (key === "risk"){
    const upd = (lName, cName, sName, rName, e) => {
      const m = matrix($(`[name=${lName}]`).value, $(`[name=${cName}]`).value);
      $(`[name=${sName}]`).value = m ? m.score : "";
      if (m && (e === lName || e === cName)) $(`[name=${rName}]`).value = m.rating;
    };
    const hint = () => { const m = matrix($("[name=Likelihood]").value, $("[name=Consequence]").value), r = $("[name=Rating]").value;
      $("#mxHint").textContent = m && r && r !== m.rating && r !== "Positive" ? `Note: the matrix gives ${m.rating} (score ${m.score}) for ${$("[name=Likelihood]").value} × ${$("[name=Consequence]").value}; the rating has been set manually to ${r}.` : ""; };
    $("#dlgBody").oninput = e => {
      const n = e.target.name;
      if (n === "Likelihood" || n === "Consequence") upd("Likelihood","Consequence","RiskScore","Rating", n);
      if (n === "ResidualLikelihood" || n === "ResidualConsequence") upd("ResidualLikelihood","ResidualConsequence","ResidualScore","ResidualRating", n);
      if (n === "RiskType" && e.target.value === "Opportunity" && !$("[name=Rating]").value) $("[name=Rating]").value = "Positive";
      if (n === "RegisterType"){ $("#dlgKind").textContent = "Risk Register · " + e.target.value; if (!item){ const t = newTitle("risk", { RegisterType: e.target.value }); $("[name=Title]").value = t; setTitle(t); } }
      hint();
    };
    upd("Likelihood","Consequence","RiskScore","Rating"); upd("ResidualLikelihood","ResidualConsequence","ResidualScore","ResidualRating"); hint();
  } else if (key === "tt"){
    $("#dlgBody").oninput = e => { if (e.target.name === "TestDate" || e.target.name === "TestPeriod"){ const d = $("[name=TestDate]").value, m = TT_MONTHS[$("[name=TestPeriod]").value]; if (d && m) $("[name=NextTestDate]").value = addMonths(d, m); } };
    if (item) $("#ttRetest").onclick = () => openForm("tt", undefined, { ItemKey: ttKey(item), PlantID:item.PlantID, Description:item.Description, Location:item.Location, TestPeriod:item.TestPeriod, CompetentPerson:item.CompetentPerson,
      NextTestDate: addMonths(TODAY, TT_MONTHS[item.TestPeriod] || 12) });
  } else if (key === "leg"){
    $("#dlgBody").oninput = null;
    $("#legToday").onclick = () => { $("[name=LastReviewed]").value = TODAY; if ($("[name=ComplianceStatus]").value === "Not assessed") $("[name=ComplianceStatus]").value = "Compliant"; toast("Review date set to today — click Save to record it"); };
  } else if (key === "trn"){
    const exp = () => { const c = S.course.find(x => x.Title === $("[name=Course]").value), d = $("[name=CompletedDate]").value;
      if (c && num(c.RefresherMonths) && d && !$("[name=ExpiryDate]").value) $("[name=ExpiryDate]").value = addMonths(d, num(c.RefresherMonths)); };
    $("#dlgBody").oninput = e => { if (e.target.name === "CompletedDate" || e.target.name === "Course") exp(); };
  } else if (key === "rev"){
    $("#dlgBody").oninput = null;
    $("#revToday").onclick = () => { $("[name=ReviewDate]").value = TODAY; $("[name=Signed]").value = "Yes"; toast("Review date set to today — click Save to record it"); };
  } else if (key === "inc"){
    const recalc = () => { const f = calcIncident(readForm()); $("[name=RTWHours]").value = f.RTWHours || ""; $("[name=TotalEstCost]").value = f.TotalEstCost || ""; };
    $("#dlgBody").oninput = e => { if (NUMERIC.has(e.target.name)) recalc(); };
    recalc();
  } else {
    $("#dlgBody").oninput = e => {
      if (e.target.name === "ImprovementStatus" && e.target.value === "Closed" && !$("[name=DateClosed]").value) $("[name=DateClosed]").value = TODAY;
    };
  }
  $("#dlg").showModal();
}
function readForm(){
  const o = {};
  $("#dlgBody").querySelectorAll("[name]").forEach(el => { o[el.name] = el.value.trim(); });
  return o;
}
async function submitForm(e){
  e.preventDefault();
  const { key, item } = editing;
  const missing = [...$("#dlgBody").querySelectorAll("[required]")].filter(el => !el.value.trim());
  if (missing.length){ missing[0].focus(); toast("Please fill in: " + missing.map(m => m.closest("label").innerText.replace(" *","").trim()).join(", ")); return; }
  let f = readForm();
  if (key === "inc") f = calcIncident(f);
  if (key === "tt" && !f.ItemKey) f.ItemKey = f.Title;
  if (key === "trn"){ f.Title = `${f.StaffName} — ${f.Course}`; const dup = trnFor(f.StaffName, f.Course); if (dup && dup !== item){ toast(`${f.StaffName} already has a ${f.Course} record — open that one instead.`); return; } }
  if (key === "imp" && f.ImprovementStatus === "Closed" && !f.DateClosed) f.DateClosed = TODAY;
  // types: numbers as numbers, blanks → null on update / omitted on create
  const out = {};
  for (const [k, val] of Object.entries(f)){
    if (NUMERIC.has(k) || (typeof val === "number")) { const n = val === "" ? null : +val; if (n !== null || item) out[k] = n; }
    else if (val !== "" || item) out[k] = val === "" ? null : val;
  }
  if (item && !USER_TITLE.has(key)) delete out.Title;
  $("#dlgSave").disabled = true;
  try {
    let saved;
    if (DEMO) saved = { ...(item || { id: "demo" + Date.now() }), ...out, ...(item && !USER_TITLE.has(key) ? {} : { Title: f.Title }) };
    else {
      // guard against duplicate number if someone else saved first
      if (!item && !USER_TITLE.has(key) || key === "ins" && !item){ S[key] = await loadList(key); out.Title = newTitle(key, f); if (key === "tt" && out.ItemKey === f.Title) out.ItemKey = out.Title; }
      saved = { ...(item || {}), ...(await saveItem(key, item?.id, out)) };
    }
    const idx = S[key].findIndex(i => i.id === saved.id);
    idx >= 0 ? S[key].splice(idx, 1, saved) : S[key].push(saved);
    let msg = `Saved ${saved.Title}`;
    if (key === "inc" && photoQueue.length){
      try { const n = await uploadPhotos(saved.Title); if (n) msg += ` with ${n} photo${n===1?"":"s"}`; }
      catch(pe){ msg += ` — but the photos weren't uploaded: ${pe.message}`; }
    }
    $("#dlg").close(); render(); toast(msg);
  } catch(err){ console.error(err); toast(err.status === 403 || /access denied|forbidden|not authorized/i.test(err.message) ? NO_PERMISSION : "Save failed: " + err.message); }
  finally { $("#dlgSave").disabled = false; }
}

/* ---------------- CSV export ---------------- */
function exportCsv(key){
  const cols = FORMS[key].flatMap(s => s[1]);
  const cell = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const lines = [cols.map(c => cell(c[1])).join(",")].concat(sortRows(S[key], key).map(r => cols.map(c => cell(c[2]==="date" ? fmtDate(r[c[0]]) : r[c[0]])).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type:"text/csv" }));
  a.download = `MJE_${FILE_NAMES[key]}_${TODAY}.csv`; a.click();
}

  $("#si").onclick = signIn;
}
async function start(){
  $("#dlgLogo").src = $(".logo .chip img").src;
  $("#frm").onsubmit = submitForm;
  $("#dlgX").onclick = $("#dlgCancel").onclick = () => $("#dlg").close();
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { resetFilt(); S.view = b.dataset.v; render(); window.scrollTo({ top:0 }); });
  if (DEMO){
    S.inc = SEED.inc.map((r,k) => calcIncident({ id:"i"+k, ...r })); S.imp = SEED.imp.map((r,k) => ({ id:"m"+k, ...r }));
    const toNum = r => { ["RiskScore","ResidualScore"].forEach(n => { if (r[n] !== undefined && r[n] !== "") r[n] = +r[n]; }); return r; };
    S.risk = (SEED.risk || []).map((r,k) => toNum({ id:"r"+k, ...r })); S.rev = (SEED.rev || []).map((r,k) => ({ id:"v"+k, ...r }));
    const toNum2 = r => { ["Cost","DisposalValue"].forEach(n => { if (r[n] !== undefined && r[n] !== "") r[n] = +r[n]; }); return r; };
    S.eq = (SEED.eq || []).map((r,k) => toNum2({ id:"e"+k, ...r })); S.tt = (SEED.tt || []).map((r,k) => ({ id:"t"+k, ...r }));
    ["staff","course","trn","area","ins","leg"].forEach(k => S[k] = (SEED[k] || []).map((r,i) => ({ id:k+i, ...r })));
    S.course.forEach(c => { if (c.RefresherMonths) c.RefresherMonths = +c.RefresherMonths; });
    $("#who").innerHTML = `<span>Demo user</span>`; $("#nav").hidden = false; render(); return;
  }
  try { await initAuth(); } catch(e){ showSignIn("Sign-in error: " + e.message); return; }
  if (!account) return showSignIn();
  $("#who").innerHTML = `<span>${esc(account.name || account.username)}</span><button id="so">Sign out</button>`;
  $("#so").onclick = signOut;
  try {
    await getSite();
    [S.inc, S.imp, S.risk, S.rev, S.eq, S.tt] = await Promise.all([loadList("inc"), loadList("imp"), loadListSafe("risk"), loadListSafe("rev"), loadListSafe("eq"), loadListSafe("tt")]);
    [S.staff, S.course, S.trn, S.area, S.ins, S.leg] = await Promise.all(["staff","course","trn","area","ins","leg"].map(loadListSafe));
    $("#nav").hidden = false; render();
  } catch(e){
    $("#main").innerHTML = `<div class="banner err">Couldn't load data from SharePoint: ${esc(e.message)}<br>Check the site ${esc(CONFIG.SP_HOST + CONFIG.SITE_PATH)} exists, the lists have been provisioned, and you have access.</div>`;
  }
}
start();
</script>
