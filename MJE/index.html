<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MJE Safety Hub</title>
<link rel="icon" type="image/png" href="shared/mje-icon.png">

<link rel="stylesheet" href="shared/mje.css?v=20261005">
<style>
/* Safety Hub only — everything shared with the Service Hub is in shared/mje.css */
.hm{display:grid;grid-template-columns:18px 1fr;grid-template-rows:auto auto;gap:4px}
.hm-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.hm-x{grid-column:2;text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.hm-grid{display:grid;grid-template-columns:92px repeat(5,1fr);gap:4px}
.hm-h{font-size:11px;color:var(--muted);text-align:center;align-self:end;overflow:hidden;text-overflow:ellipsis}
.hm-r{font-size:12px;color:var(--muted);align-self:center;text-align:right;padding-right:6px}
.hm-c{height:42px;border:2px solid transparent;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.hm-c.z{opacity:.45;cursor:default}
.hm-c.sel{border-color:var(--text)}
.hm-Low{background:var(--ok-bg);color:var(--ok)}.hm-Medium{background:var(--warn-bg);color:var(--warn)}
.hm-High{background:var(--bad-bg);color:var(--bad)}.hm-VeryHigh{background:var(--crit);color:#fff}
@media (max-width:720px){.hm-grid{grid-template-columns:64px repeat(5,1fr)}.hm-h{font-size:9px}.hm-r{font-size:11px}.hm-c{height:36px}}
/* matrix / calendar */
.mxwrap table{min-width:0;width:auto}
table.matrix th,table.matrix td{padding:3px;border-bottom:1px solid var(--line);text-align:center}
table.matrix th.vh{height:150px;vertical-align:bottom;white-space:nowrap;position:sticky;top:0;background:var(--surface2);cursor:default}
table.matrix th.vh span{writing-mode:vertical-rl;transform:rotate(180deg);text-transform:none;letter-spacing:0;font-size:12px;color:var(--text);font-weight:600}
table.matrix .who-cell{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;padding:6px 10px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)}
table.matrix thead .who-cell{background:var(--surface2);z-index:2;vertical-align:bottom;color:var(--muted);text-transform:uppercase;font-size:12px}
.who-cell span{display:block;font-weight:400;color:var(--muted);font-size:11px}
table.matrix tr.grp td{text-align:left;background:var(--grey-bg);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 10px}
table.cal th:not(.who-cell){font-size:12px;min-width:46px}
.mx{width:44px;height:34px;border-radius:6px;border:1px solid transparent;font-size:10px;line-height:1.1;cursor:pointer;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.legend .mx{width:22px;height:16px;margin:0;padding:0;box-sizing:border-box;font-size:9px;line-height:1;cursor:default;flex:none;display:inline-flex;align-items:center;justify-content:center;border-width:2px}
.legend .mx-na{border-width:1px}
.mx-na{background:transparent;border:1px dashed var(--line)}
.mx-na:hover{border-color:var(--muted)}
.mx-done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.mx-expiring{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.mx-expired{background:var(--crit);color:#fff}
.mx-missing{background:var(--bad-bg);color:var(--crit);border:2px solid var(--crit);font-size:14px}
.mx-planned{background:var(--grey-bg);color:var(--muted);border-color:var(--line)}
.mxl{margin:0;flex-wrap:wrap}
table.legt tr.child td:first-child{padding-left:30px;font-size:13px}
table.legt a{font-size:12px;color:var(--info)}
/* ---- reports: paper look on screen (light in both themes), A4 when printed ---- */
.rpt{--rink:#1b1f24;--rmut:#5f6b7a;--rline:#d9dde3;--accent:#c8391b;--c-inc:#d63b25;--c-imp:#2563eb;--c-rev:#0f8a80;--c-tt:#b45309;--c-trn:#4f46e5;--c-ins:#0369a1;--c-leg:#a21caf;
  background:#fff;color:var(--rink);color-scheme:light;max-width:920px;margin:0 auto 14px;padding:28px 34px;border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);font-size:13px}
.rpt .rh{display:flex;flex-wrap:nowrap;gap:20px;align-items:center;border-bottom:3px solid var(--accent);padding:0 0 14px;margin-bottom:16px;background:none;color:inherit;position:static;z-index:auto}
.rpt .rh img{width:150px;height:auto;flex:none}.rpt .rh .grow{flex:1}
.rpt h1{font-size:22px;margin:0;line-height:1.2}
.rpt .rm{font-size:16px;font-weight:600;color:var(--accent)}
.rpt .rmeta{font-size:12px;color:var(--rmut)}
.rpt .rbadges{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.rpt .rb{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#fdece4;color:#9a3412;white-space:nowrap}.rpt .rb.st{background:#eef0f3;color:var(--rink)}
.rpt section{margin-bottom:16px}

.rpt .rts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.rpt .rts.six{grid-template-columns:repeat(6,minmax(0,1fr))}

.rpt .rf{font-size:10.5px;color:var(--rmut);border-top:1px solid var(--rline);padding-top:8px;margin-top:10px}
.rpt .kvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px}.rpt .kvs.four{grid-template-columns:repeat(4,1fr)}
.rpt .kv span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--rmut)}
.rpt .kv b{font-weight:600}.rpt .span3{grid-column:1/-1}.rpt .kv.w2{grid-column:span 2}
.rpt .costs .kv.tot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--rink);padding-top:6px}.rpt .costs .kv.tot b{font-size:15px}
.rpt .nil{color:#9aa3ae;font-weight:400}
.rpt .txt{white-space:pre-wrap;margin:0}.rpt b.txt{display:block;font-weight:400}

.rpt .rphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rpt .rphotos img{width:100%;height:170px;object-fit:cover;border-radius:6px;border:1px solid var(--rline);display:block;background:#f6f7f9}
.rpt .sign td{height:38px}
.rpt .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--dc);vertical-align:0}
.rpt .ag td.ty{white-space:nowrap}.rpt .ag tbody tr[data-open]{cursor:pointer}.rpt .ag tbody tr[data-open]:hover td{background:#f6f7f9}
.rpt tr.grp td{background:#eef0f3;font-weight:700;font-size:12px;padding-top:7px;border-bottom:0}.rpt tr.grp small{font-weight:400;color:var(--rmut);margin-left:6px}
.rpt tr.grp.od td{background:#fdece4;color:#9a3412}
.rpt tr.sub td{font-weight:700;font-size:11.5px;padding:6px 6px 3px;border-bottom:1px solid var(--rline);color:var(--rink)}.rpt tr.sub small{font-weight:400;color:var(--rmut);margin-left:4px}
.rpt .late{color:#b91c1c;font-weight:600}
.rgroups{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:14px}.rgroup{display:flex;flex-direction:column;gap:4px}.rgroup .chips{display:flex;flex-wrap:wrap}
.rgl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.rpt .rt.bad .v{color:#b91c1c}
.rpt .sm{font-size:11px;color:var(--rmut)}.rpt td .sm{margin-top:1px}
.rpt .rbars{display:flex;flex-direction:column;gap:5px}
.rpt .rbar{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:8px;align-items:center;font-size:11.5px}
.rpt .rbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rpt .rbar .t{background:#eef0f3;border-radius:3px;height:10px;overflow:hidden}.rpt .rbar .t i{display:block;height:100%;border-radius:3px}
.rpt .rbar .n{font-variant-numeric:tabular-nums;font-weight:600;min-width:24px;text-align:right}
.rpt .trend rect.cb{fill:#fbd5cc}.rpt .trend polyline.cum{fill:none;stroke:var(--c-inc);stroke-width:2}
.rpt .rst{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#eef0f3}.rpt .rst.ok{background:#e7f5ed;color:#1f8a4c}.rpt .rst.warn{background:#fdf3e1;color:#9a5b0b}.rpt .rst.bad{background:#fdece4;color:#b91c1c}
.rpt .kv b.line{display:block;border-bottom:1px solid var(--rink);height:20px}
.rpt .run td{height:26px}.rpt .run td:nth-child(n+6){border:1px solid #c9ced6}.rpt .run td.box{white-space:nowrap;font-size:12px}
.rpt .leglog tr.act td{background:#f6f7f9}.rpt .leglog tr.act td:first-child{font-weight:600}
.rpt .reg td{font-size:11.5px}.rpt .reg tr.desc td{border-top:0;padding-top:0;color:var(--rmut);font-size:11px}.rpt .reg tbody.incrow tr:first-child td{border-bottom:0}.rpt tbody.incrow{break-inside:avoid}.rpt .risk td.sm{font-size:11px;color:var(--rink)}
.rpt .rrate{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.rpt .rhm{display:grid;grid-template-columns:16px 1fr;gap:3px}.rpt .rhm-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;color:var(--rmut);text-align:center;text-transform:uppercase;letter-spacing:.4px}
.rpt .rhm-g{display:grid;grid-template-columns:78px repeat(5,minmax(0,1fr));gap:3px}.rpt .rhm-h{font-size:9.5px;color:var(--rmut);text-align:center;align-self:end;overflow:hidden;text-overflow:ellipsis}
.rpt .rhm-r{font-size:10.5px;color:var(--rmut);text-align:right;padding-right:4px;align-self:center}.rpt .rhm-c{height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.rpt .rhm-x{grid-column:2;text-align:center;font-size:10px;color:var(--rmut);text-transform:uppercase;letter-spacing:.4px}
.rpt .mxscroll{overflow-x:auto}.rpt .rmx{width:auto;min-width:100%}.rpt .rmx th.vh{height:120px;vertical-align:bottom;padding:4px 2px;text-align:center}.rpt .rmx th.vh span{writing-mode:vertical-rl;transform:rotate(180deg);text-transform:none;letter-spacing:0;font-size:10.5px;color:var(--rink);white-space:nowrap}
.rpt .rmx td{padding:2px;text-align:center;border:1px solid #e3e6ea;font-size:10px;min-width:30px}.rpt .rmx td.nm,.rpt .rmx th.nm{text-align:left;padding:3px 6px;min-width:130px;font-size:11.5px}.rpt .rmx tr.grp td{text-align:left}
.rpt .mc-done{background:#e7f5ed;color:#1f8a4c}.rpt .mc-expiring{background:#fdf3e1;color:#9a5b0b;font-weight:700}.rpt .mc-expired{background:#fdece4;color:#b91c1c;font-weight:700}.rpt .mc-missing{color:#b91c1c;font-weight:700}.rpt .mc-planned{color:var(--rmut)}
.rpt .rcal{table-layout:fixed}.rpt .rcal th{text-align:center;padding:4px 2px}.rpt .rcal th.nm{width:24%;text-align:left}.rpt .rcal td{text-align:center;font-size:10px;padding:3px 2px;border:1px solid #e3e6ea}.rpt .rcal td.nm{text-align:left;font-size:11.5px;padding:3px 6px}
.rpt .c-done{background:#e7f5ed;color:#1f8a4c;font-weight:600}.rpt .c-plan{color:var(--rmut)}.rpt .c-miss{background:#fdece4;color:#b91c1c;font-weight:600}
.rpt .legend2{font-size:10.5px;color:var(--rmut);margin:8px 0 0}.rpt .legend2 .mc{display:inline-block;min-width:22px;padding:0 4px;border:1px solid #e3e6ea;text-align:center;margin:0 3px 0 8px}
.rpt tbody tr[data-open]{cursor:pointer}.rpt tbody tr[data-open]:hover td{background:#f6f7f9}
@media screen and (max-width:760px){.rpt{padding:16px}.rpt .rh{flex-wrap:wrap}.rpt .rh img{width:110px}.rpt .rts,.rpt .rts.six,.rpt .kvs.four{grid-template-columns:repeat(2,1fr)}.rpt .r2,.rpt .kvs{grid-template-columns:1fr}.rpt .rphotos img{height:110px}
  .rpt .ag thead{display:none}.rpt .ag tr:not(.grp){display:grid;grid-template-columns:92px 1fr;padding:4px 0;border-bottom:1px solid #eceef1}.rpt .ag tr:not(.grp) td{border:0;padding:2px 6px}.rpt .ag td:nth-child(n+3){grid-column:2}.rpt .ag tr.grp{display:block}.rpt .ag tr.grp td{display:block}}

  .rpt .rts{grid-template-columns:repeat(4,minmax(0,1fr))}.rpt .rts.six{grid-template-columns:repeat(6,minmax(0,1fr))}.rpt .rtab td{padding:3px 6px}

}
</style>

<body>
<header>
  <div class="logo"><span class="chip"><img src="shared/mje-logo.png" alt="MJ Electrical"></span><span id="apps"></span></div>
  <nav id="nav" hidden>
    <button data-v="dash" class="on">Dashboard</button>
    <button data-v="inc">Incidents</button>
    <button data-v="imp">Improvements</button>
    <button data-v="risk">Risks</button>
    <button data-v="assets">Assets</button>
    <button data-v="training">Training</button>
    <button data-v="comp">Compliance</button>
    <button data-v="rpt">Reports</button>
  </nav>
  <div class="who" id="who"></div>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<dialog id="dlg"><form method="dialog" id="frm" novalidate>
  <div class="dh"><span class="dlg-logo"><img id="dlgLogo" alt="MJ Electrical"></span><div class="dt"><span class="kind" id="dlgKind"></span><h2 id="dlgTitle"></h2></div><button type="button" class="btn" id="dlgX" aria-label="Close">✕</button></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><button type="button" class="btn" id="dlgCancel">Cancel</button><button type="submit" class="btn primary" id="dlgSave">Save</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script src="shared/mje-config.js?v=20261005"></script>
<script src="shared/mje-core.js?v=20261005"></script>
<script>
/* =====================================================================
   CONFIG — the Microsoft 365 connection (CLIENT_ID, TENANT_ID, SP_HOST, SITE_PATH)
   lives in shared/mje-config.js so both MJE apps use the same values.
   While CLIENT_ID is left as the placeholder the app runs in DEMO mode
   (nothing is saved).
   ===================================================================== */
const CONFIG = {
  ...MJE_TENANT,
  LISTS: { inc: "MJE_Incidents", imp: "MJE_Improvements", risk: "MJE_Risks", rev: "MJE_RiskReviews", eq: "MJE_Equipment", tt: "MJE_TestTag", photos: "MJE_IncidentPhotos",
           staff: "MJE_Staff", course: "MJE_Courses", trn: "MJE_Training", area: "MJE_InspectionAreas", ins: "MJE_Inspections", leg: "MJE_Legislation" },
  SCOPES: ["Sites.ReadWrite.All", "User.Read"],
  RTW_HOURS_PER_DAY: 9
};
const DEMO = CONFIG.CLIENT_ID.startsWith("<<");
const SEED = {"inc":[],"imp":[],"risk":[],"rev":[],"eq":[],"tt":[],"staff":[],"course":[],"trn":[],"area":[],"ins":[],"leg":[]};

/* ---------------- data layer (generic helpers are in shared/mje-core.js) ---------------- */
const loadList = key => listItems(CONFIG.LISTS[key]);
// Lists added in later phases may not exist yet — don't let that stop the app
async function loadListSafe(key){
  try { return await loadList(key); }
  catch(e){ if (isMissingList(e)) { S.missing.push(key); return []; } throw e; }
}
const saveItem = (key, id, fields) => saveListItem(CONFIG.LISTS[key], id, fields);

/* ---------------- state ---------------- */
const S = { inc:[], imp:[], risk:[], rev:[], eq:[], tt:[], staff:[], course:[], trn:[], area:[], ins:[], leg:[], missing:[], view:"dash", sort:{ inc:["Title",-1], imp:["Title",-1], risk:["Title",1], rev:["RegisterType",1], eq:["Title",1], tt:["NextTestDate",1], staff:["Title",1], course:["Title",1], trn:["Title",1], area:["Title",1], ins:["InspectionDate",-1], leg:["Title",1] },
            filt:{ inc:{ q:"", status:"", year:YEAR, sev:"" }, imp:{ q:"", status:"open", cat:"", pri:"" },
                   risk:{ q:"", reg:"", rating:"", status:"", cell:"", residual:false },
                   assets:{ sub:"eq" }, eq:{ q:"", cat:"", status:"" }, tt:{ q:"", state:"", all:false },

function heatmap(rows, residual){
  const lk = residual ? "ResidualLikelihood" : "Likelihood", ck = residual ? "ResidualConsequence" : "Consequence";
  const cnt = {}; let plotted = 0;
  rows.forEach(r => { if (LV[r[lk]] && CV[r[ck]]) { const k = r[lk] + "|" + r[ck]; cnt[k] = (cnt[k]||0) + 1; plotted++; } });
  const sel = S.filt.risk.cell;
  let h = `<div class="hm"><div class="hm-y">Likelihood</div><div class="hm-grid"><span></span>`;
  h += CONS.map(c => `<span class="hm-h">${c}</span>`).join("");
  [...LIKE].reverse().forEach(l => {
    h += `<span class="hm-r">${l}</span>`;
    CONS.forEach((c, ci) => { const k = l + "|" + c, n = cnt[k] || 0, rt = MX[l][ci];
      h += `<button class="hm-c hm-${rt.replace(" ","")} ${n?"":"z"} ${sel===k?"sel":""}" data-cell="${k}" title="${l} × ${c}: ${rt} (score ${LV[l]+CV[c]}) — ${n} risk${n===1?"":"s"}">${n || ""}</button>`; });
  });
  h += `</div><div class="hm-x">Consequence</div></div>`;
  const missing = rows.length - plotted;
  if (missing) h += `<p class="count">${missing} item${missing===1?"":"s"} not plotted (no ${residual?"residual ":""}likelihood/consequence recorded${residual?"":", e.g. Environmental ratings or opportunities"}).</p>`;
  return h;
}

async function loadPhotos(title){
  const el = $("#phList"); if (!el) return;
  if (DEMO) { el.innerHTML = `<span class="count">Photos aren't saved in demo mode.</span>`; return; }
  const d = await photoDrive();

  el.innerHTML = `<span class="count">Loading photos…</span>`;

  } catch(e){ el.innerHTML = ""; }

async function uploadPhotos(title){
  if (!photoQueue.length) return 0;
  if (DEMO) { photoQueue = []; return 0; }
  const d = await photoDrive(); if (!d) throw new Error("the photo library isn't set up yet");
  let n = 0;
  for (const [i, f] of photoQueue.entries()){
    const blob = await shrink(f), name = `${title}_${Date.now()}_${i+1}.jpg`;

const insYears = () => [...new Set(S.ins.map(i => (i.InspectionDate||"").slice(0,4)).filter(Boolean).concat(YEAR))].sort().reverse();
function areaMonthState(a, y, mi){
  const done = S.ins.filter(i => i.Area === a.Title && (i.InspectionDate||"").startsWith(`${y}-${pad(mi+1)}`));
  const planned = a.PlannedMonth === MONTHS[mi] || a.Frequency === "Monthly" || (a.Frequency === "Quarterly" && MONTHS.indexOf(a.PlannedMonth) % 3 === mi % 3) || (a.Frequency === "Six-monthly" && MONTHS.indexOf(a.PlannedMonth) % 6 === mi % 6);
  const monthEnd = ymd(new Date(+y, mi + 1, 0));
  return { done, planned, overdue: planned && !done.length && monthEnd < TODAY };
}
function insAreasFiltered(){ const f = S.filt.ins, y = f.year;
  return [...S.area].filter(a => !f.missed || MONTHS.some((m, mi) => areaMonthState(a, y, mi).overdue)).sort((a,b) => (MONTHS.indexOf(a.PlannedMonth) + 13) % 13 - (MONTHS.indexOf(b.PlannedMonth) + 13) % 13 || a.Title.localeCompare(b.Title)); }

  const rowsHtml = areas.map(a => `<tr><th class="who-cell" data-open="area:${a.id}"><b>${esc(a.Title)}</b><span>${esc(a.Frequency || "")}${a.PlannedMonth ? "" : " · not scheduled"}</span></th>` +
    MONTHS.map((m, mi) => { const s = areaMonthState(a, y, mi);
      const cls = s.done.length ? "done" : s.overdue ? "expired" : s.planned ? "planned" : "na";
      const label = s.done.length ? s.done.map(d => fmtDate(d.InspectionDate).slice(0,5)).join(" ") : s.planned ? (s.overdue ? "due" : "plan") : "";

  const log = sortRows(S.ins.filter(i => (i.InspectionDate||"").startsWith(y)), "ins");
  return `

/* ---- legislation ---- */
const legDue = r => { if (!r.LastReviewed) return ""; return addMonths(r.LastReviewed, { Monthly:1, Quarterly:3, Annually:12 }[r.ReviewFrequency] || 1); };
const legState = r => !r.LastReviewed ? "none" : legDue(r) < TODAY ? "overdue" : "ok";
function viewLegislation(tabs){
  if (S.missing.includes("leg")) return `<div class="bar"><h2>Compliance</h2></div>${tabs}<div class="banner err">The legislation list hasn't been set up on SharePoint yet. Run the Phase 4 script (Provision-MJE-Phase4.ps1), then refresh.</div>`;
  const f = S.filt.leg, q = f.q.toLowerCase();
  const rows = S.leg.filter(r => (!f.topic || r.Topic === f.topic) && (!f.state || legState(r) !== "ok") && (!q || [r.Title,r.ParentAct,r.ChangesNoted,r.AffectedDocuments].join(" ").toLowerCase().includes(q)));
  const acts = rows.filter(r => r.LegType === "Act");
  const orphans = rows.filter(r => r.LegType !== "Act" && !acts.some(a => a.Title === r.ParentAct));
  const typeOrder = { "Act":0, "Regulation":1, "Subordinate legislation":2 };
  const line = (r, child) => `<tr data-open="leg:${r.id}" class="${child?"child":""}"><td>${child ? "↳ " : ""}<b>${esc(r.Title)}</b>${r.Link ? ` <a href="${esc(r.Link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">open ↗</a>` : ""}</td>
    <td><span class="pill ${r.LegType==="Act"?"p-info":"p-grey"}">${esc(r.LegType)}</span></td><td>${esc(r.Topic)}</td><td>${esc(r.Responsible)}</td>
    <td class="mono">${fmtDate(r.LastReviewed)}</td><td>${{ none:`<span class="pill p-bad">Not reviewed</span>`, overdue:`<span class="pill p-crit">Review due</span>`, ok:`<span class="pill p-ok">Up to date</span>` }[legState(r)]}</td>

  const body = acts.sort((a,b) => a.Title.localeCompare(b.Title)).map(a => line(a) + rows.filter(r => r.ParentAct === a.Title && r.LegType !== "Act")

/* ================= REPORTS ================= */
// Month helpers - "YYYY-MM" strings, local dates only
const ymOf = d => d.slice(0, 7);
const monthEnd = ym => ymd(new Date(+ym.slice(0,4), +ym.slice(5,7), 0));
const prevYm = ym => { const d = new Date(+ym.slice(0,4), +ym.slice(5,7) - 2, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const ymLabel = ym => `${MONTHS[+ym.slice(5,7) - 1]} ${ym.slice(0,4)}`;
const ymShort = ym => MONTHS[+ym.slice(5,7) - 1].slice(0,3);
const inYm = (d, ym) => (d || "").startsWith(ym);
const asAtOf = ym => { const e = monthEnd(ym); return e > TODAY ? TODAY : e; };      // the current month is "as at today"
// Default: last month during the first 10 days (when the report is usually prepared), otherwise this month
const defaultRptMonth = () => +TODAY.slice(8,10) <= 10 ? prevYm(ymOf(TODAY)) : ymOf(TODAY);

// Improvements as at a date: open = issued by then and not closed by then.
// Closed with no DateClosed counts as closed (we can't tell when).
const impOpenAt = (i, d) => (i.DateIssued || "") <= d && !(i.ImprovementStatus === "Closed" && (!i.DateClosed || i.DateClosed <= d));
const impOverdueAt = (i, d) => impOpenAt(i, d) && (i.Recurrence || "One-off") === "One-off" && i.TargetDate && i.TargetDate < d;
// Test & tag as at a date: latest test per item done by then
function ttLatestAt(d){
  const m = new Map();
  S.tt.filter(r => r.TestDate && r.TestDate <= d).forEach(r => { const k = ttKey(r), c = m.get(k);
    if (!c || r.TestDate > c.TestDate || (r.TestDate === c.TestDate && String(r.Title) > String(c.Title))) m.set(k, r); });
  return [...m.values()];
}
const ttBadAt = (r, d) => r.Result === "Fail" || (r.NextTestDate && r.NextTestDate < d);
// Mandatory training as at a date (active staff): current = completed by then and not expired by then
const trnCurrentAt = (r, d) => r.CompletedDate && r.CompletedDate <= d && !(r.ExpiryDate && r.ExpiryDate < d);

function hseFigures(ym){
  const d = asAtOf(ym), y = ym.slice(0,4), mi = +ym.slice(5,7) - 1;
  const inc = S.inc.filter(i => inYm(i.IncidentDate, ym));
  const mand = S.trn.filter(r => r.Requirement === "Mandatory" && activeStaff().some(s => s.Title === r.StaffName));
  const trnOk = mand.filter(r => trnCurrentAt(r, d)).length;
  const ttL = ttLatestAt(d);
  let insPlanned = 0, insDone = 0, ytdPlanned = 0, ytdDone = 0;
  S.area.forEach(a => { for (let k = 0; k <= mi; k++){ const s = areaMonthState(a, y, k);
    if (s.planned) ytdPlanned++; if (s.planned && s.done.length) ytdDone++;
    if (k === mi){ if (s.planned) insPlanned++; if (s.planned && s.done.length) insDone++; } } });
  return {
    ym, d, inc,
    incN: inc.length, lti: inc.filter(i => i.Severity === "Lost Time Injury").length,
    serious: inc.filter(i => ["Medical Treatment","Lost Time Injury","Serious / Notifiable"].includes(i.Severity)).length,
    nearMiss: inc.filter(i => i.Severity === "Near Miss").length,
    cost: inc.reduce((a, i) => a + num(i.TotalEstCost), 0), hrsLost: inc.reduce((a, i) => a + num(i.WorkersTimeLostHrs), 0),
    impOpened: S.imp.filter(i => inYm(i.DateIssued, ym)).length,
    impClosed: S.imp.filter(i => i.ImprovementStatus === "Closed" && inYm(i.DateClosed, ym)).length,
    impOpen: S.imp.filter(i => impOpenAt(i, d)).length,
    overdue: S.imp.filter(i => impOverdueAt(i, d)).sort((a, b) => a.TargetDate.localeCompare(b.TargetDate)),
    trnPct: mand.length ? Math.round(trnOk / mand.length * 100) : null, trnOk, trnN: mand.length,
    trnExpired: mand.filter(r => r.CompletedDate && r.CompletedDate <= d && r.ExpiryDate && r.ExpiryDate < d),
    trnMissing: mand.filter(r => !r.CompletedDate || r.CompletedDate > d).length,
    trnExpiring: mand.filter(r => trnCurrentAt(r, d) && r.ExpiryDate && r.ExpiryDate <= addDays(d, 60)).length,
    ttItems: ttL.length, ttBad: ttL.filter(r => ttBadAt(r, d)).length,
    ttTests: S.tt.filter(r => inYm(r.TestDate, ym)).length, ttFailed: S.tt.filter(r => inYm(r.TestDate, ym) && r.Result === "Fail").length,
    insPlanned, insDone, ytdPlanned, ytdDone,
    insLog: S.ins.filter(i => inYm(i.InspectionDate, ym)).sort((a, b) => (a.InspectionDate || "").localeCompare(b.InspectionDate || "")),
    revDone: S.rev.filter(r => inYm(r.ReviewDate, ym)).length,
    legDone: S.leg.filter(r => inYm(r.LastReviewed, ym)).length,
  };
}

// Change since last month. better: "down" (fewer is better), "up", or "" (neutral)
function delta(cur, prev, better, fmt = v => v){
  if (cur == null || prev == null) return `<span class="dl">no comparison</span>`;
  const df = Math.round((cur - prev) * 100) / 100;
  if (!df) return `<span class="dl">no change</span>`;
  const tone = !better ? "" : (better === "down") === (df < 0) ? "good" : "bad";
  return `<span class="dl ${tone}">${df > 0 ? "▲ +" : "▼ −"}${fmt(Math.abs(df))}</span>`;
}

// 12-month incident bars ending at the report month (single series; report month darker)
function incTrend(ym){
  const months = []; let m = ym; for (let k = 0; k < 12; k++){ months.unshift(m); m = prevYm(m); }
  const rows = months.map(x => { const r = S.inc.filter(i => inYm(i.IncidentDate, x)); return { ym:x, n:r.length, lti:r.filter(i => i.Severity === "Lost Time Injury").length }; });
  const max = Math.max(1, ...rows.map(r => r.n)), W = 520, H = 120, bw = W / 12, top = 16, base = H - 18;
  const bars = rows.map((r, k) => { const h = r.n ? Math.max(3, (base - top) * r.n / max) : 0, x = k * bw + 6, w = bw - 12;
    return `<g><title>${ymLabel(r.ym)}: ${r.n} incident${r.n === 1 ? "" : "s"}${r.lti ? `, ${r.lti} lost time` : ""}</title>
      <rect x="${k * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>
      ${h ? `<path d="M${x},${base} v${-(h - 4)} q0,-4 4,-4 h${w - 8} q4,0 4,4 v${h - 4} z" class="${r.ym === ym ? "cur" : ""}"/>` : `<line x1="${x}" x2="${x + w}" y1="${base}" y2="${base}" class="zero"/>`}
      ${r.n ? `<text x="${x + w / 2}" y="${base - h - 4}" class="v">${r.n}</text>` : ""}
      <text x="${x + w / 2}" y="${H - 4}" class="m${r.ym === ym ? " cur" : ""}">${ymShort(r.ym)}</text></g>`; }).join("");
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Incidents per month, last 12 months">${bars}</svg>`;
}

function rptNoteKey(ym){ return "mjeHseNote:" + ym; }

  return `<article class="rpt" id="rpt">

/* ---------------- lookahead: everything falling due ---------------- */
const AHEAD_TYPES = { trn:["Training","var(--c-trn)","Training"], tt:["Test & tag","var(--c-tt)","Test & tag"], ins:["Inspection","var(--c-ins)","Inspections"], rev:["Risk review","var(--c-rev)","Risk reviews"], leg:["Legislation","var(--c-leg)","Legislation"], imp:["Improvement action","var(--c-imp)","Actions"] };
const AHEAD_DAYS = [30, 60, 90, 180];
function aheadItems(end){
  const out = [], on = k => !S.missing.includes(k);
  const add = (type, due, item, who, note, open, overdue) => out.push({ type, due, item, who, note, open, overdue: overdue ?? (!due || due < TODAY) });
  if (on("trn") && on("staff")) S.trn.filter(r => r.CompletedDate && r.ExpiryDate && r.ExpiryDate <= end && activeStaff().some(s => s.Title === r.StaffName))
    .forEach(r => add("trn", r.ExpiryDate, r.Course, r.StaffName, `${r.Requirement || "Training"} · ${r.ExpiryDate < TODAY ? "expired" : "expires"}`, `trn:${r.id}`));
  if (on("tt")) ttLatest().forEach(r => {
    const item = [r.PlantID, r.Description].filter(Boolean).join(" — ");
    if (r.Result === "Fail") add("tt", r.TestDate, item, r.Location, `Failed test${r.ReportedFault ? ": " + r.ReportedFault : ""} — repair and retest`, `tt:${r.id}`, true);
    else if (r.NextTestDate && r.NextTestDate <= end) add("tt", r.NextTestDate, item, r.Location, `Retest${r.TestPeriod ? " (" + r.TestPeriod + ")" : ""}`, `tt:${r.id}`);
  });
  if (on("area")){
    const start = new Date(+TODAY.slice(0,4), +TODAY.slice(5,7) - 13, 1), endM = ymOf(end);
    S.area.forEach(a => {
      let missed = [];
      for (let dt = new Date(start); ; dt.setMonth(dt.getMonth() + 1)){
        const ym = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; if (ym > endM) break;
        const st = areaMonthState(a, String(dt.getFullYear()), dt.getMonth()), me = monthEnd(ym);
        if (!st.planned || st.done.length) continue;
        if (me < TODAY){ if (!S.ins.some(i => i.Area === a.Title && (i.InspectionDate || "") >= ym + "-01")) missed.push(ym); }
        else { add("ins", me, a.Title, a.Responsible, (a.Frequency ? `Inspection ${a.Frequency}` : "Inspection planned"), `area:${a.id}`, false); out.at(-1).month = ym; }
      }
      if (missed.length) add("ins", monthEnd(missed.at(-1)), a.Title, a.Responsible,
        missed.length === 1 ? `Planned for ${ymLabel(missed[0])} — not done` : `${missed.length} planned inspections missed since ${ymLabel(missed[0])}`, `area:${a.id}`, true);
    });
  }
  if (on("rev")) S.rev.forEach(r => { const n = nextDue(r);
    if (!n) add("rev", "", r.Title, r.Responsible, `${r.RegisterType || ""} · no review recorded`, `rev:${r.id}`, true);
    else if (n <= end) add("rev", n, r.Title, r.Responsible, `${r.RegisterType || ""} · ${r.ReviewFrequency || ""}`, `rev:${r.id}`); });
  if (on("leg")) S.leg.forEach(r => { const n = legDue(r);
    if (!n) add("leg", "", r.Title, r.Responsible, "Never reviewed", `leg:${r.id}`, true);
    else if (n <= end) add("leg", n, r.Title, r.Responsible, `${r.ReviewFrequency || "Monthly"} review`, `leg:${r.id}`); });
  S.imp.filter(i => i.ImprovementStatus !== "Closed" && (i.Recurrence || "One-off") === "One-off" && i.TargetDate && i.TargetDate <= end)
    .forEach(i => add("imp", i.TargetDate, `${i.Title} — ${i.NatureOfImprovement || ""}`, i.ActionedBy, `Priority ${i.Priority || "—"} · ${i.ImprovementStatus || ""}`, `imp:${i.id}`));
  return out.sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || a.type.localeCompare(b.type) || String(a.item).localeCompare(String(b.item)));
}
// Test & tag: one line per location (earliest date first) instead of one line per item
function groupTestTag(rows){
  const by = new Map();
  rows.filter(r => r.type === "tt").forEach(r => { const k = r.who || "No location recorded"; if (!by.has(k)) by.set(k, []); by.get(k).push(r); });
  const out = rows.filter(r => r.type !== "tt" || by.get(r.who || "No location recorded").length === 1);
  by.forEach((list, loc) => { if (list.length === 1) return;
    const dates = list.map(r => r.due).filter(Boolean).sort(), failed = list.filter(r => /^Failed/.test(r.note)).length;
    const cnt = new Map(); list.forEach(r => { const n = String(r.item).split(" — ").pop() || "Item"; cnt.set(n, (cnt.get(n) || 0) + 1); });
    const names = [...cnt].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([n, c]) => c > 1 ? `${n} ×${c}` : n);
    out.push({ type:"tt", due: dates[0] || "", overdue: list[0].overdue, who: loc, ttloc: loc,
      item: `${list.length} items — ${names.slice(0, 3).join(", ")}${names.length > 3 ? `, + ${names.length - 3} other type${names.length - 3 === 1 ? "" : "s"}` : ""}`,
      note: list[0].overdue ? [failed ? `${failed} failed` : "", list.length - failed ? `${list.length - failed} retest${list.length - failed === 1 ? "" : "s"} overdue` : ""].filter(Boolean).join(" · ")
                            : `Retests due ${fmtDate(dates[0])}${dates.at(-1) !== dates[0] ? " – " + fmtDate(dates.at(-1)) : ""}` }); });
  return out.sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || a.type.localeCompare(b.type) || String(a.item).localeCompare(String(b.item)));
}
// rows of one period; grouped = a subheading per type (in the order of the summary boxes)
const AHEAD_PLURAL = { trn:"Training", tt:"Test & tag", ins:"Inspections", rev:"Risk reviews", leg:"Legislation reviews", imp:"Improvement actions" };
const nItems = rs => rs.reduce((n, r) => n + (r.ttloc ? +r.item.split(" ")[0] : 1), 0);
function aheadRow(r){
  const due = r.month ? `${ymShort(r.month)} ${r.month.slice(0,4)}` : !r.due ? `<span class="late">no date</span>` : r.overdue ? `<span class="late">${fmtDate(r.due)}</span>` : fmtDate(r.due);

}
function groupRows(rs, grouped){
  if (!grouped) return rs.map(aheadRow).join("");

}
function viewLookahead(tabs){

  <article class="rpt" id="rpt">

  </tbody></table>` : `<p class="rk">Nothing falls due in the next ${f.days} days${label ? " for " + esc(label.toLowerCase()) : ""}.</p>`}

/* ---------------- incident trends ---------------- */
function trendMonths(p){ const end = p === "12m" ? ymOf(TODAY) : `${p}-12`; const out = []; let m = end; for (let k = 0; k < 12; k++){ out.unshift(m); m = prevYm(m); } return out; }
function costChart(months){
  const rows = months.map(m => S.inc.filter(i => inYm(i.IncidentDate, m)).reduce((a, i) => a + num(i.TotalEstCost), 0));
  let run = 0; const cum = rows.map(v => run += v);
  const W = 520, H = 130, bw = W / 12, top = 14, base = H - 18, max = Math.max(1, ...rows), cmax = Math.max(1, run);
  const bars = rows.map((v, k) => { const h = v ? Math.max(3, (base - top) * v / max) : 0, x = k * bw + 8, w = bw - 16;
    return `<g><title>${ymLabel(months[k])}: ${kina(v)} (running total ${kina(cum[k])})</title>${h ? `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" rx="3" class="cb"/>` : `<line x1="${x}" x2="${x + w}" y1="${base}" y2="${base}" class="zero"/>`}
      <text x="${x + w / 2}" y="${H - 4}" class="m">${ymShort(months[k])}</text></g>`; }).join("");
  const pts = cum.map((v, k) => `${k * bw + bw / 2},${base - (base - top) * v / cmax}`).join(" ");
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Incident cost per month with running total">${bars}<polyline points="${pts}" class="cum"/>
</svg>`;
}
function viewTrendReport(tabs){
  const f = S.filt.rpt, months = trendMonths(f.trPeriod), from = months[0] + "-01", to = monthEnd(months[11]);
  const inc = S.inc.filter(i => (i.IncidentDate || "") >= from && (i.IncidentDate || "") <= to);
  const years = [...new Set(S.inc.map(i => (i.IncidentDate || "").slice(0, 4)).filter(Boolean).concat(YEAR))].sort().reverse();
  const count = key => { const m = new Map(); inc.forEach(i => { const v = String(i[key] || "").trim() || "Not recorded"; const k = v.toLowerCase(); const c = m.get(k) || [v, 0]; c[1]++; m.set(k, c); }); return [...m.values()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])); };
  const injuries = inc.filter(i => !["Near Miss","Property Damage Only","No Injury"].includes(i.Severity) && !["No Injury","Property Damage Only","N/A"].includes(i.ActualInjury));
  const lti = inc.filter(i => i.Severity === "Lost Time Injury"), cost = inc.reduce((a, i) => a + num(i.TotalEstCost), 0), hrs = inc.reduce((a, i) => a + num(i.WorkersTimeLostHrs), 0);
  const sev = INC_SEV.map(s => [s, inc.filter(i => i.Severity === s).length]).filter(r => r[1]);
  let run = 0;
  const monthRows = months.map(m => { const r = inc.filter(i => inYm(i.IncidentDate, m)), c = r.reduce((a, i) => a + num(i.TotalEstCost), 0); run += c;
    return `<tr><td>${ymLabel(m)}</td><td class="n">${r.length || ""}</td><td class="n">${r.filter(i => i.Severity === "Near Miss").length || ""}</td><td class="n">${r.filter(i => i.Severity === "Lost Time Injury").length || ""}</td><td class="n">${r.reduce((a, i) => a + num(i.WorkersTimeLostHrs), 0) || ""}</td><td class="n">${c ? kina(c) : ""}</td><td class="n">${run ? kina(run) : ""}</td></tr>`; }).join("");
  const period = f.trPeriod === "12m" ? `${ymLabel(months[0])} to ${ymLabel(months[11])}` : `Calendar year ${f.trPeriod}`;
  return rptBar(`<label class="count">Period</label>${rsel("trPeriod", [["12m","Last 12 months"], ...years.map(y => [y, y])], f.trPeriod)}`, `MJE Incident Trends ${f.trPeriod}`) + tabs + `
  <article class="rpt" id="rpt">${rptHead("Incident Trends", period, `${inc.length} incident${inc.length === 1 ? "" : "s"}`)}
  <section><div class="rts">${rtile("Incidents", inc.length, (n => `${n} near miss${n === 1 ? "" : "es"}`)(inc.filter(i => i.Severity === "Near Miss").length))}${rtile("Injuries", injuries.length, "excluding near misses & damage only")}
    ${rtile("Lost time injuries", lti.length, `${hrs} working hours lost`, lti.length ? "bad" : "")}${rtile("Est. cost", kina(cost), inc.length ? `average ${kina(cost / inc.length)} per incident` : "")}</div></section>
  <section class="r2"><div><h2>Incidents per month</h2>${incTrend(months[11])}</div><div><h2>Cost per month <small>bars; line = running total (${kina(cost)})</small></h2>${costChart(months)}</div></section>
  <section class="r2"><div><h2>Agency of injury <small>what caused it</small></h2>${rbars(count("AgencyOfInjury").map(r => [r[0], r[1]]), "var(--c-inc)")}</div>
    <div><h2>Part of body</h2>${rbars(count("BodyPart").slice(0, 10), "var(--c-inc)")}${count("BodyPart").length > 10 ? `<p class="rk">+ ${count("BodyPart").length - 10} more</p>` : ""}</div></section>
  <section class="r2"><div><h2>Injury or disease</h2>${rbars(count("ActualInjury"), "var(--c-imp)")}</div><div><h2>Severity</h2>${rbars(sev, "var(--c-imp)")}</div></section>
  <section class="r2"><div><h2>Location <small>top 8</small></h2>${rbars(count("Location").slice(0, 8), "var(--c-rev)")}</div><div><h2>Cost by agency</h2>${rbars([...new Set(inc.map(i => i.AgencyOfInjury || "Not recorded"))].map(a => [a, inc.filter(i => (i.AgencyOfInjury || "Not recorded") === a).reduce((s, i) => s + num(i.TotalEstCost), 0)]).filter(r => r[1]).sort((a, b) => b[1] - a[1]), "var(--c-rev)", kina)}</div></section>
  <section><h2>Month by month</h2><table class="rtab sm"><thead><tr><th>Month</th><th class="n">Incidents</th><th class="n">Near misses</th><th class="n">LTI</th><th class="n">Hours lost</th><th class="n">Est. cost</th><th class="n">Running total</th></tr></thead><tbody>${monthRows}
    <tr class="tot"><td>Total</td><td class="n">${inc.length}</td><td class="n">${inc.filter(i => i.Severity === "Near Miss").length}</td><td class="n">${lti.length}</td><td class="n">${hrs}</td><td class="n">${kina(cost)}</td><td></td></tr></tbody></table></section>
  <footer class="rf">Source: Safety Incident Register, by incident date. Part of body and location are grouped on the text as typed (capital letters ignored), so similar spellings show separately — keep entries consistent for best results.</footer></article>`;
}

// static 5x5 matrix for paper (counts per cell)
function rptHeat(rows, residual){
  const lk = residual ? "ResidualLikelihood" : "Likelihood", ck = residual ? "ResidualConsequence" : "Consequence", cnt = {};
  let plotted = 0; rows.forEach(r => { if (LV[r[lk]] && CV[r[ck]]) { const k = r[lk] + "|" + r[ck]; cnt[k] = (cnt[k] || 0) + 1; plotted++; } });
  return `<div class="rhm"><div class="rhm-y">Likelihood</div><div class="rhm-g"><span></span>${CONS.map(c => `<span class="rhm-h">${c}</span>`).join("")}
    ${[...LIKE].reverse().map(l => `<span class="rhm-r">${l}</span>` + CONS.map((c, ci) => { const n = cnt[l + "|" + c] || 0, rt = MX[l][ci];
      return `<span class="rhm-c" style="${RATE_STYLE[rt]}${n ? "" : ";opacity:.45"}" title="${l} × ${c}: ${rt} (score ${LV[l] + CV[c]})">${n || ""}</span>`; }).join("")).join("")}</div>
    <div class="rhm-x">Consequence</div></div>${rows.length - plotted ? `<p class="sm">${rows.length - plotted} not plotted (no ${residual ? "residual " : ""}likelihood / consequence).</p>` : ""}`;
}

/* ---------------- report controls ---------------- */
function bindReports(){
  if (S.view !== "rpt") return;
  const f = S.filt.rpt;
  document.querySelectorAll("[data-rsub]").forEach(b => b.onclick = () => { f.sub = b.dataset.rsub; f.from = ""; render(); });
  document.querySelectorAll("[data-rback]").forEach(b => b.onclick = () => { const y = f.fromScroll || 0; S.view = f.from; f.from = ""; render(); window.scrollTo({ top:y }); });
  document.querySelectorAll("[data-rprint]").forEach(b => b.onclick = () => printReport(b.dataset.rprint));
  const sel = $("#rptMonth"); if (sel) sel.onchange = () => { f.month = sel.value; render(); };
  const n = $("#rptNote"); if (n) n.oninput = () => { try { localStorage.setItem(rptNoteKey(f.month), n.innerText.trim()); } catch {} };
  const ri = $("#rptInc"); if (ri) ri.onchange = () => { f.inc = ri.value; render(); };
  const ph = $("#rptPhotos"); if (ph) loadReportPhotos(ph);
  const dd = $("#rptDays"); if (dd) dd.onchange = () => { f.days = +dd.value; render(); };

async function printReport(title){

/* ---------------- derived ---------------- */
const isOverdue = i => i.ImprovementStatus !== "Closed" && (i.Recurrence || "One-off") === "One-off" && i.TargetDate && i.TargetDate < TODAY;
const isDueSoon = i => i.ImprovementStatus !== "Closed" && (i.Recurrence || "One-off") === "One-off" && i.TargetDate && i.TargetDate >= TODAY && i.TargetDate <= addDays(TODAY, 30);
function calcIncident(f){
  f.RTWHours = num(f.RTWDays) * CONFIG.RTW_HOURS_PER_DAY;
  f.TotalEstCost = num(f.EstDirectCost) + num(f.EstIndirectCost) + num(f.WorkcoverExcess) + num(f.EstCostRTW);
  return f;
}
function nextNumber(list, prefix, width = 2){
  const re = new RegExp("^" + prefix.replace(/[-]/g,"\\-") + "(\\d+)$");
  const max = list.reduce((m, i) => { const r = re.exec(i.Title || ""); return r ? Math.max(m, +r[1]) : m; }, 0);
  return prefix + String(max + 1).padStart(width, "0");
}

const statPill = s => { const c = {"Open":"p-warn","Under Investigation":"p-info","In Progress":"p-info","Ongoing":"p-grey","Closed":"p-ok"}[s]; return s ? `<span class="pill ${c||"p-grey"}">${esc(s)}</span>` : ""; };
const priPill = p => { const c = {H:"p-crit",M:"p-warn",L:"p-grey"}[p]; return p ? `<span class="pill ${c}">${esc(p)}</span>` : ""; };

  document.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => { const k = b.dataset.clear;
    if (k === "rev") S.filt.rev.state = ""; if (k === "trn") S.filt.trn.gaps = false; if (k === "ins") S.filt.ins.missed = false; render(); });
  document.querySelectorAll("[data-revover]").forEach(b => b.onclick = () => { S.tile = null; S.filt.rev.state = S.filt.rev.state ? "" : "due"; render(); $("#revSection")?.scrollIntoView({ block:"start" }); });
  document.querySelectorAll("[data-gaps]").forEach(b => b.onclick = () => { S.tile = null; S.filt.trn.gaps = !S.filt.trn.gaps; render(); });
  document.querySelectorAll("[data-missed]").forEach(b => b.onclick = () => { S.tile = null; S.filt.ins.missed = !S.filt.ins.missed; render(); });
  document.querySelectorAll("[data-clearall]").forEach(b => b.onclick = () => { resetFilt(); render(); window.scrollTo({ top:0 }); });
  document.querySelectorAll("[data-rpt]").forEach(b => b.onclick = () => openReportFor(b.dataset.rpt,
    { leglog:{ legTopic: S.filt.leg.topic }, assets:{ eqDisposed: S.filt.eq.status !== "In service" && S.filt.eq.status !== "Out of service" } }[b.dataset.rpt] || {}));
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { S.view = b.dataset.goto; render(); });
}

/* ---------------- dashboard tile links ---------------- */
function resetFilt(){
  S.tile = null; S.filt.rpt.from = "";
  S.sort.inc = ["Title",-1]; S.sort.imp = ["Title",-1]; S.sort.risk = ["Title",1];
  Object.assign(S.filt.inc, { q:"", status:"", year:YEAR, sev:"" }); Object.assign(S.filt.imp, { q:"", status:"open", cat:"", pri:"" });
  Object.assign(S.filt.risk, { q:"", reg:"", rating:"", status:"", cell:"", residual:false }); S.filt.rev.state = "";
  Object.assign(S.filt.tt, { q:"", state:"", all:false }); Object.assign(S.filt.trn, { q:"", dept:"", gaps:false });
  Object.assign(S.filt.ins, { year:YEAR, missed:false }); Object.assign(S.filt.leg, { q:"", topic:"", state:"" });
}
const GO_LABEL = { inc:["Incidents in "+YEAR,"inc"], lti:["Lost time injuries in "+YEAR,"inc"], cost:["Incidents in "+YEAR+", highest cost first","inc"],
  impopen:["Open improvements","imp"], impover:["Overdue improvement actions","imp"], risk:["Open high & very high risks, highest score first","risk"],
  rev:["Risk reviews overdue or not recorded","rev"], tt:["Items overdue for test or failed last test","tt"], trn:["Staff with missing or expired mandatory training","trn"],
  ins:["Areas with missed inspections in "+YEAR,"ins"], leg:["Legislation due for review","leg"] };
const GO = {
  inc:      () => { S.view = "inc"; S.sort.inc = ["Title",-1]; },
  lti:      () => { S.view = "inc"; S.filt.inc.sev = "Lost Time Injury"; },
  cost:     () => { S.view = "inc"; S.sort.inc = ["TotalEstCost",-1]; },
  impopen:  () => { S.view = "imp"; S.filt.imp.status = "open"; },
  impover:  () => { S.view = "imp"; S.filt.imp.status = "overdue"; S.sort.imp = ["TargetDate",1]; },
  risk:     () => { S.view = "risk"; S.filt.risk.rating = "hi"; S.sort.risk = ["RiskScore",-1]; },
  rev:      () => { S.view = "risk"; S.filt.rev.state = "due"; return "#revSection"; },
  tt:       () => { S.view = "assets"; S.filt.assets.sub = "tt"; S.filt.tt.state = "attn"; },
  trn:      () => { S.view = "training"; S.filt.training.sub = "matrix"; S.filt.trn.gaps = true; },
  ins:      () => { S.view = "comp"; S.filt.comp.sub = "ins"; S.filt.ins.missed = true; },
  leg:      () => { S.view = "comp"; S.filt.comp.sub = "leg"; S.filt.leg.state = "due"; },
};
function goTile(k){ resetFilt(); const anchor = GO[k](); S.tile = k; render(); const el = anchor && $(anchor); el ? el.scrollIntoView({ behavior:"smooth", block:"start" }) : window.scrollTo({ top:0 }); }

/* ---------------- form ---------------- */
let editing = null;
function fieldHtml([name, label, type, o = {}], v){
  const cls = `fld ${o.w===3?"w3":o.w===2?"w2":""}`, lab = `<span class="${o.req?"req":""}">${label}</span>`;
  const attrs = `name="${name}" ${o.req?"required":""} ${o.ro?"readonly tabindex=-1":""}`;
  if (type === "textarea") return `<label class="${cls}">${lab}<textarea ${attrs}>${esc(v)}</textarea></label>`;
  if (type === "select"){
    const base = o.dyn ? (o.dyn === "staff" ? activeStaff() : S[o.dyn]).map(r => r.Title).sort((a,b) => a.localeCompare(b)) : o.opts;
    const list = base.includes(v) || !v ? base : [...base, v];     // keep fill-in values
    return `<label class="${cls}">${lab}<select ${attrs}><option value=""></option>${list.map(x => `<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`;
  }
  return `<label class="${cls}">${lab}<input type="${type}" ${type==="number"?'step="any" min="0"':""} ${attrs} value="${esc(v ?? "")}"></label>`;
}
function newTitle(key, f = {}){
  if (key === "inc") return nextNumber(S.inc, YEAR + "-");
  if (key === "imp") return nextNumber(S.imp, `IR-${YEAR}-`);
  if (key === "risk") return nextNumber(S.risk.filter(r => r.RegisterType === f.RegisterType), REF_PREFIX[f.RegisterType] || "R");
  if (key === "eq") return nextNumber(S.eq, "EQ-", 3);
  if (key === "ins") return nextNumber(S.ins, `INS-${YEAR}-`, 3);
  if (key === "trn") return `${f.StaffName} — ${f.Course}`;
  if (key === "tt") return nextNumber(S.tt, `TT-${YEAR}-`, 3);
  return f.Title || "";
}
function newDefaults(key){
  if (key === "inc") return { Title: newTitle("inc"), IncidentDate: TODAY, IncidentStatus: "Open", RTWProgram: "No" };
  if (key === "imp") return { Title: newTitle("imp"), DateIssued: TODAY, ImprovementStatus: "Open", Recurrence: "One-off", Priority: "M" };
  if (key === "eq") return { Title: newTitle("eq"), Category: "Tool", EquipStatus: "In service" };
  if (key === "staff") return { StaffStatus: "Active", Department: "Service" };
  if (key === "course") return {};
  if (key === "trn") return { Requirement: "Mandatory" };
  if (key === "area") return { Frequency: "Annually" };
  if (key === "ins") return { Title: newTitle("ins"), InspectionDate: TODAY, Outcome: "Satisfactory" };
  if (key === "leg") return { LegType: "Act", ReviewFrequency: "Monthly", ComplianceStatus: "Not assessed" };
  if (key === "tt") return { Title: newTitle("tt"), TestDate: TODAY, TestPeriod: "Yearly", NextTestDate: addMonths(TODAY, 12), Result: "Pass", Location: "Office" };
  const reg = S.filt.risk.reg || "OH&S";
  if (key === "risk") return { Title: newTitle("risk", { RegisterType: reg }), RegisterType: reg, RiskType: "Risk", RiskStatus: "Active" };
  return { RegisterType: reg, Signed: "No" };
}
function openForm(key, item, prefill = {}){
  editing = { key, item };
  photoQueue = [];
  const defs = FORMS[key];
  const v = item ? { ...item } : { ...newDefaults(key), ...prefill };
  const setTitle = t => $("#dlgTitle").textContent = (item ? "" : "New ") + NAMES[key].toLowerCase().replace(/^./, c => c.toUpperCase()) + (t ? " " + t : "");
  const KIND = { inc:"Safety Incident Register", imp:"Improvement Register", risk:"Risk Register", rev:"Risk Review Schedule", eq:"Plant & Equipment Register", tt:"Test & Tag Register", staff:"Training & Competency · Staff", course:"Training & Competency · Courses", trn:"Training & Competency", area:"Workplace Inspection Program", ins:"Workplace Inspection", leg:"Legislative Compliance Register" };
  $("#dlg").className = "f-" + key;
  $("#dlgKind").textContent = KIND[key] + (key === "risk" && v.RegisterType ? " · " + v.RegisterType : "");
  setTitle(v.Title);
  const sections = defs.map(([leg, fs]) => `<fieldset><legend>${leg}</legend><div class="fg">${fs.map(f => fieldHtml(f, v[f[0]])).join("")}</div></fieldset>`);
  if (key === "inc") sections.splice(1, 0, photosHtml());      // photos straight after the incident details
  $("#dlgBody").innerHTML = sections.join("")
    + (key === "risk" ? `<p class="hint" id="mxHint"></p>` : "")
    + (key === "rev" ? `<button type="button" class="btn" id="revToday">✓ Record a review today</button>` : "")
    + (key === "tt" && item ? `<button type="button" class="btn" id="ttRetest">↻ Record a new test for this item</button>` : "")
    + (key === "leg" ? `<button type="button" class="btn" id="legToday">✓ Record a review today</button>` : "")
    + (key === "inc" && item ? `<button type="button" class="btn" id="incPrint">🖨 Print incident report</button>` : "")
    + (key === "staff" && item ? `<button type="button" class="btn" id="staffPrint">🖨 Print training record</button>` : "")
;
  if (key === "inc"){
    $("#phInput").onchange = e => { [...e.target.files].forEach(f => { f._url = URL.createObjectURL(f); photoQueue.push(f); }); e.target.value = ""; renderQueue(); };
    loadPhotos(item?.Title);
    if (item) $("#incPrint").onclick = () => openReportFor("inc", { inc:item.id });
  }
  if (key === "risk"){
    const upd = (lName, cName, sName, rName, e) => {
      const m = matrix($(`[name=${lName}]`).value, $(`[name=${cName}]`).value);
      $(`[name=${sName}]`).value = m ? m.score : "";
      if (m && (e === lName || e === cName)) $(`[name=${rName}]`).value = m.rating;
    };
    const hint = () => { const m = matrix($("[name=Likelihood]").value, $("[name=Consequence]").value), r = $("[name=Rating]").value;
      $("#mxHint").textContent = m && r && r !== m.rating && r !== "Positive" ? `Note: the matrix gives ${m.rating} (score ${m.score}) for ${$("[name=Likelihood]").value} × ${$("[name=Consequence]").value}; the rating has been set manually to ${r}.` : ""; };
    $("#dlgBody").oninput = e => {
      const n = e.target.name;
      if (n === "Likelihood" || n === "Consequence") upd("Likelihood","Consequence","RiskScore","Rating", n);
      if (n === "ResidualLikelihood" || n === "ResidualConsequence") upd("ResidualLikelihood","ResidualConsequence","ResidualScore","ResidualRating", n);
      if (n === "RiskType" && e.target.value === "Opportunity" && !$("[name=Rating]").value) $("[name=Rating]").value = "Positive";
      if (n === "RegisterType"){ $("#dlgKind").textContent = "Risk Register · " + e.target.value; if (!item){ const t = newTitle("risk", { RegisterType: e.target.value }); $("[name=Title]").value = t; setTitle(t); } }
      hint();
    };
    upd("Likelihood","Consequence","RiskScore","Rating"); upd("ResidualLikelihood","ResidualConsequence","ResidualScore","ResidualRating"); hint();
  } else if (key === "tt"){
    $("#dlgBody").oninput = e => { if (e.target.name === "TestDate" || e.target.name === "TestPeriod"){ const d = $("[name=TestDate]").value, m = TT_MONTHS[$("[name=TestPeriod]").value]; if (d && m) $("[name=NextTestDate]").value = addMonths(d, m); } };
    if (item) $("#ttRetest").onclick = () => openForm("tt", undefined, { ItemKey: ttKey(item), PlantID:item.PlantID, Description:item.Description, Location:item.Location, TestPeriod:item.TestPeriod, CompetentPerson:item.CompetentPerson,
      NextTestDate: addMonths(TODAY, TT_MONTHS[item.TestPeriod] || 12) });
  } else if (key === "leg"){
    $("#dlgBody").oninput = null;
    $("#legToday").onclick = () => { $("[name=LastReviewed]").value = TODAY; if ($("[name=ComplianceStatus]").value === "Not assessed") $("[name=ComplianceStatus]").value = "Compliant"; toast("Review date set to today — click Save to record it"); };
  } else if (key === "trn"){
    const exp = () => { const c = S.course.find(x => x.Title === $("[name=Course]").value), d = $("[name=CompletedDate]").value;
      if (c && num(c.RefresherMonths) && d && !$("[name=ExpiryDate]").value) $("[name=ExpiryDate]").value = addMonths(d, num(c.RefresherMonths)); };
    $("#dlgBody").oninput = e => { if (e.target.name === "CompletedDate" || e.target.name === "Course") exp(); };
  } else if (key === "rev"){
    $("#dlgBody").oninput = null;
    $("#revToday").onclick = () => { $("[name=ReviewDate]").value = TODAY; $("[name=Signed]").value = "Yes"; toast("Review date set to today — click Save to record it"); };
  } else if (key === "inc"){
    const recalc = () => { const f = calcIncident(readForm()); $("[name=RTWHours]").value = f.RTWHours || ""; $("[name=TotalEstCost]").value = f.TotalEstCost || ""; };
    $("#dlgBody").oninput = e => { if (NUMERIC.has(e.target.name)) recalc(); };
    recalc();
  } else {
    $("#dlgBody").oninput = e => {
      if (e.target.name === "ImprovementStatus" && e.target.value === "Closed" && !$("[name=DateClosed]").value) $("[name=DateClosed]").value = TODAY;
    };
  }
  if (key === "staff" && item) $("#staffPrint").onclick = () => openReportFor("trnrec", { staff:item.id });
  $("#dlg").showModal();
}
// Jump from a record to its printable report, remembering where we came from for the Back button
function openReportFor(sub, sel){
  $("#dlg").close();
  Object.assign(S.filt.rpt, { sub, from: S.view === "rpt" ? S.filt.rpt.from : S.view, fromScroll: window.scrollY }, sel);
  S.view = "rpt"; render(); window.scrollTo({ top:0 });
}
function readForm(){
  const o = {};
  $("#dlgBody").querySelectorAll("[name]").forEach(el => { o[el.name] = el.value.trim(); });
  return o;
}
async function submitForm(e){
  e.preventDefault();
  const { key, item } = editing;
  const missing = [...$("#dlgBody").querySelectorAll("[required]")].filter(el => !el.value.trim());
  if (missing.length){ missing[0].focus(); toast("Please fill in: " + missing.map(m => m.closest("label").innerText.replace(" *","").trim()).join(", ")); return; }
  let f = readForm();
  if (key === "inc") f = calcIncident(f);
  if (key === "tt" && !f.ItemKey) f.ItemKey = f.Title;
  if (key === "trn"){ f.Title = `${f.StaffName} — ${f.Course}`; const dup = trnFor(f.StaffName, f.Course); if (dup && dup !== item){ toast(`${f.StaffName} already has a ${f.Course} record — open that one instead.`); return; } }
  if (key === "imp" && f.ImprovementStatus === "Closed" && !f.DateClosed) f.DateClosed = TODAY;
  // types: numbers as numbers, blanks → null on update / omitted on create
  const out = {};
  for (const [k, val] of Object.entries(f)){
    if (NUMERIC.has(k) || (typeof val === "number")) { const n = val === "" ? null : +val; if (n !== null || item) out[k] = n; }
    else if (val !== "" || item) out[k] = val === "" ? null : val;
  }
  if (item && !USER_TITLE.has(key)) delete out.Title;
  $("#dlgSave").disabled = true;
  try {
    let saved;
    if (DEMO) saved = { ...(item || { id: "demo" + Date.now() }), ...out, ...(item && !USER_TITLE.has(key) ? {} : { Title: f.Title }) };
    else {
      // guard against duplicate number if someone else saved first
      if (!item && !USER_TITLE.has(key) || key === "ins" && !item){ S[key] = await loadList(key); out.Title = newTitle(key, f); if (key === "tt" && out.ItemKey === f.Title) out.ItemKey = out.Title; }
      saved = { ...(item || {}), ...(await saveItem(key, item?.id, out)) };
    }
    const idx = S[key].findIndex(i => i.id === saved.id);
    idx >= 0 ? S[key].splice(idx, 1, saved) : S[key].push(saved);
    let msg = `Saved ${saved.Title}`;
    if (key === "inc" && photoQueue.length){
      try { const n = await uploadPhotos(saved.Title); if (n) msg += ` with ${n} photo${n===1?"":"s"}`; }
      catch(pe){ msg += ` — but the photos weren't uploaded: ${pe.message}`; }
    }
    $("#dlg").close(); render(); toast(msg);
  } catch(err){ console.error(err); toast(isForbidden(err) ? NO_PERMISSION : "Save failed: " + err.message); }
  finally { $("#dlgSave").disabled = false; }
}

/* ---------------- CSV export ---------------- */
function exportCsv(key){
  const cols = FORMS[key].flatMap(s => s[1]);
  const cell = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const lines = [cols.map(c => cell(c[1])).join(",")].concat(sortRows(S[key], key).map(r => cols.map(c => cell(c[2]==="date" ? fmtDate(r[c[0]]) : r[c[0]])).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type:"text/csv" }));
  a.download = `MJE_${FILE_NAMES[key]}_${TODAY}.csv`; a.click();
}

/* ---------------- link from the Service Hub: log an incident against a job ---------------- */
function openIncidentFromLink(){
  let link = /^#new-incident\?/.test(location.hash) ? location.hash : "";
  try { link = link || sessionStorage.getItem("mjeIncidentLink") || ""; sessionStorage.removeItem("mjeIncidentLink"); } catch {}
  const m = /^#new-incident\?(.*)$/.exec(link); if (!m) return;
  const p = new URLSearchParams(m[1]); history.replaceState(null, "", location.pathname + location.search);
  S.view = "inc"; render();
  const job = p.get("job") || "";
  openForm("inc", undefined, { IncidentDate: /^\d{4}-\d{2}-\d{2}$/.test(p.get("date") || "") ? p.get("date") : TODAY, Location: p.get("location") || "", JobNo: job,
    ReportedBy: account?.name || "" });
  if (job) toast(`Logging an incident for job ${job}`);
}

/* ---------------- boot ---------------- */
function showSignIn(msg){
  $("#main").innerHTML = `<div class="card signin"><div class="full"><img src="${MJE_SHARED}mje-logo-full.png" alt="MJ Electrical — Electrical | Communications | Security | Fire"></div><h2>Safety Hub</h2><p>Safety incident and improvement registers for MJ Electrical.</p>
    ${msg ? `<div class="banner err">${esc(msg)}</div>` : ""}<button class="btn primary" id="si">Sign in with Microsoft 365</button></div>`;
  $("#si").onclick = signIn;
}
async function start(){
  // keep a "log an incident for job …" link safe across a Microsoft sign-in redirect
  if (/^#new-incident\?/.test(location.hash)) { try { sessionStorage.setItem("mjeIncidentLink", location.hash); } catch {} }
  mjeRenderApps("safety");
  if (mjeAppState("safety") === "off") { $("#main").innerHTML = mjeUnavailable("safety"); return; }
  $("#dlgLogo").src = $(".logo .chip img").src;
  $("#frm").onsubmit = submitForm;
  $("#dlgX").onclick = $("#dlgCancel").onclick = () => $("#dlg").close();
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { resetFilt(); S.view = b.dataset.v; render(); window.scrollTo({ top:0 }); });
  if (DEMO){
    S.inc = SEED.inc.map((r,k) => calcIncident({ id:"i"+k, ...r })); S.imp = SEED.imp.map((r,k) => ({ id:"m"+k, ...r }));
    const toNum = r => { ["RiskScore","ResidualScore"].forEach(n => { if (r[n] !== undefined && r[n] !== "") r[n] = +r[n]; }); return r; };
    S.risk = (SEED.risk || []).map((r,k) => toNum({ id:"r"+k, ...r })); S.rev = (SEED.rev || []).map((r,k) => ({ id:"v"+k, ...r }));
    const toNum2 = r => { ["Cost","DisposalValue"].forEach(n => { if (r[n] !== undefined && r[n] !== "") r[n] = +r[n]; }); return r; };
    S.eq = (SEED.eq || []).map((r,k) => toNum2({ id:"e"+k, ...r })); S.tt = (SEED.tt || []).map((r,k) => ({ id:"t"+k, ...r }));
    ["staff","course","trn","area","ins","leg"].forEach(k => S[k] = (SEED[k] || []).map((r,i) => ({ id:k+i, ...r })));
    S.course.forEach(c => { if (c.RefresherMonths) c.RefresherMonths = +c.RefresherMonths; });
    $("#who").innerHTML = `<span>Demo user</span>`; $("#nav").hidden = false; render(); openIncidentFromLink(); return;
  }
  try { await initAuth(); } catch(e){ showSignIn("Sign-in error: " + e.message); return; }
  if (!account) return showSignIn();
  $("#who").innerHTML = `<span>${esc(account.name || account.username)}</span><button id="so">Sign out</button>`;
  $("#so").onclick = signOut;
  mjeRenderApps("safety");                                  // preview Hubs need the sign-in email
  if (!mjeAppAllowed("safety")) { $("#main").innerHTML = mjeUnavailable("safety"); return; }
  try {
    await getSite();
    [S.inc, S.imp, S.risk, S.rev, S.eq, S.tt] = await Promise.all([loadList("inc"), loadList("imp"), loadListSafe("risk"), loadListSafe("rev"), loadListSafe("eq"), loadListSafe("tt")]);
    [S.staff, S.course, S.trn, S.area, S.ins, S.leg] = await Promise.all(["staff","course","trn","area","ins","leg"].map(loadListSafe));
    $("#nav").hidden = false; render(); openIncidentFromLink();
  } catch(e){
    $("#main").innerHTML = `<div class="banner err">Couldn't load data from SharePoint: ${esc(e.message)}<br>Check the site ${esc(CONFIG.SP_HOST + CONFIG.SITE_PATH)} exists, the lists have been provisioned, and you have access.</div>`;
  }
}
start();
