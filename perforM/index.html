<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>perforM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
  :root {
    --blue: #3A3FF0;
    --blue-dark: #211CC7;
    --blue-light: #E8E9FD;
    --teal: #00FF00;   --teal-l: #E9F9D9;  --teal-d: #2B7A0B;
    --gold: #FFB300;   --gold-l: #FFF3D6;  --gold-d: #8A5A00;
    --purple: #7B3FE4; --purple-l: #EFE8FE; --purple-d: #4A1D9E;
    --coral: #FF5C39;  --coral-l: #FFE8E0; --coral-d: #B23405;
    --pink: #EC4899;   --pink-l: #FDE6F1;  --pink-d: #99215F;
    --red: #FF3B5C;
    --amber-l: #FDEFD6; --amber-d: #7A4A06;
    --gray-l: #EEEEF0; --gray-d: #52545E;
    --border: #E5E4EE;
    --text-primary: #1A1B23;
    --text-muted: #6E7080;
    --page-bg: #F4F4F8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', 'Segoe UI', Arial, Helvetica, sans-serif;
    background: var(--page-bg); color: var(--text-primary);
  }
  .app-shell { max-width: 460px; margin: 0 auto; background: #fff; min-height: 100vh; padding-bottom: 76px; position: relative; }

  header.app-header {
    background: linear-gradient(135deg, #FAAF00, #D89300);
    color: var(--text-primary); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
  }
  .header-brand { display: flex; align-items: center; gap: 0; }
  .header-partner { height: 20px; width: auto; flex-shrink: 0; }
  .logo-mark {
    height: 26px; width: auto; flex-shrink: 0; display: block;
  }
  header.app-header h1 { font-size: 15px; margin: 0; font-weight: 700; }

  #signin-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 70vh; text-align: center; padding: 20px;
  }
  #signin-screen button {
    background: var(--blue); color: #fff; border: none; border-radius: 8px;
    padding: 12px 28px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px;
  }

  main { display: none; padding: 16px; }

  .greeting-row { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
  .avatar-circle {
    width: 46px; height: 46px; border-radius: 50%; background: var(--purple-l); color: var(--purple-d);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .greeting-row .welcome { font-size: 12px; color: var(--text-muted); margin: 0; }
  .greeting-row .name { font-size: 17px; font-weight: 700; margin: 1px 0 0; }
  .greeting-row .sub { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }

  .hero-card {
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    border-radius: 16px; padding: 18px; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .hero-card .label { font-size: 11px; opacity: 0.85; margin: 0 0 6px; }
  .hero-card .rating { font-size: 30px; font-weight: 800; margin: 0; }
  .hero-card .rating-word { font-size: 12px; font-weight: 600; margin: 2px 0 0; }
  .hero-card .trend { font-size: 11px; margin: 6px 0 0; opacity: 0.9; }
  .hero-ring { position: relative; width: 92px; height: 92px; flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18)); }
  .hero-ring .ring-outer { width: 92px; height: 92px; border-radius: 50%; box-shadow: 0 0 0 3px #fff; }
  .hero-ring .ring-hole { position: absolute; top: 13px; left: 13px; width: 66px; height: 66px; border-radius: 50%; background: #fff; }
  .hero-ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: var(--blue-dark); }

  .tile-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
  .tile { border-radius: 12px; padding: 10px 8px; text-align: center; }
  .tile .num { font-size: 17px; font-weight: 800; margin: 4px 0 0; }
  .tile .lbl { font-size: 10px; color: var(--text-muted); margin: 1px 0 0; line-height: 1.2; }
  .tile-icon { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .panel { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: #fff; }
  .panel .panel-title { font-size: 12px; font-weight: 700; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .panel .panel-title a { font-size: 11px; color: var(--blue); font-weight: 600; text-decoration: none; }

  .review-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--purple-l); color: var(--purple-d); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .review-title { font-size: 13px; font-weight: 700; margin: 0; }
  .review-sub { font-size: 11px; color: var(--text-muted); margin: 2px 0 6px; }
  .status-chip { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600; margin-bottom: 6px; }
  .due-line { font-size: 10px; color: var(--text-muted); margin: 4px 0 8px; }
  .progress-track { height: 6px; background: var(--gray-l); border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
  .progress-fill { height: 100%; background: var(--blue); }
  .continue-btn { display: block; width: 100%; background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }

  .goals-summary-ring { width: 70px; height: 70px; margin: 4px auto 10px; position: relative; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.10)); }
  .goals-summary-ring .ring-outer { box-shadow: 0 0 0 3px #fff; border-radius: 50%; }
  .goals-summary-ring .donut-hole { position: absolute; top: 12px; left: 12px; width: 46px; height: 46px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); }
  .goals-summary-ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .goals-summary-ring .center .n { font-size: 15px; font-weight: 800; line-height: 1.1; }
  .goals-summary-ring .center .l { font-size: 7px; color: var(--text-muted); font-weight: 600; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; margin: 3px 0; }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .encourage-box { background: var(--teal-l); color: var(--teal-d); border-radius: 8px; padding: 6px 8px; font-size: 10.5px; margin-top: 8px; display: flex; align-items: center; gap: 6px; }

  .growth-banner { background: var(--blue-light); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; margin: 14px 0; }
  .growth-banner .star { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--blue); font-size: 16px; }
  .growth-banner .title { font-size: 12px; font-weight: 700; margin: 0; }
  .growth-banner .desc { font-size: 10.5px; color: var(--text-muted); margin: 2px 0 0; }
  .growth-banner .go-btn { margin-left: auto; background: var(--blue); color: #fff; border: none; border-radius: 7px; padding: 7px 10px; font-size: 10.5px; font-weight: 700; white-space: nowrap; cursor: pointer; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 20px 0 10px; }
  .goal-grid { display: flex; flex-direction: column; gap: 10px; }
  .goal-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; background: #fff; }
  .ring { flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.12)); box-shadow: 0 0 0 2px #fff; }
  .ring .hole { width: 32px; height: 32px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
  .badge { display: inline-block; font-size: 10.5px; padding: 2px 9px; border-radius: 20px; margin-bottom: 5px; font-weight: 600; }
  .goal-card .title { font-size: 13px; font-weight: 700; margin: 0 0 2px; }
  .goal-card .due { font-size: 11px; color: var(--text-muted); margin: 0; }

  .checkin-panel { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .checkin-row { padding: 10px 14px; border-top: 1px solid var(--border); }
  .checkin-row:first-child { border-top: none; }
  .checkin-row .who { font-size: 12px; font-weight: 700; margin: 0; }
  .checkin-row .notes { font-size: 11px; color: var(--text-muted); margin: 3px 0 0; }
  .checkin-row .date { font-size: 10px; color: var(--text-muted); margin: 3px 0 0; }

  table.roster { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 11.5px; }
  table.roster th { text-align: left; font-size: 10.5px; color: var(--text-muted); background: var(--page-bg); padding: 8px 10px; font-weight: 600; }
  table.roster td { padding: 8px 10px; border-top: 1px solid var(--border); }
  .avatar-sm { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; margin-right: 6px; vertical-align: middle; }

  .peer-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-top: 1px solid var(--border); }
  .peer-row:first-child { border-top: none; }
  .peer-row .info { flex: 1; min-width: 0; }
  .peer-row .pname { font-size: 13px; font-weight: 700; margin: 0; }
  .peer-row .prole { font-size: 11px; color: var(--text-muted); margin: 1px 0 0; }
  .rating-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; }

  .nominee-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .nominee-row:last-child { border-bottom: none; }
  .nominee-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--blue); flex-shrink: 0; }
  .nominee-row .nname { font-size: 13px; font-weight: 600; flex: 1; }

  .focus-item { margin-bottom: 12px; }
  .focus-item:last-child { margin-bottom: 0; }
  .focus-item .flabel { font-size: 12px; font-weight: 600; margin: 0 0 5px; display: flex; justify-content: space-between; }
  .focus-item .ftrack { height: 6px; background: var(--gray-l); border-radius: 4px; overflow: hidden; }
  .focus-item .ffill { height: 100%; background: var(--blue); border-radius: 4px; }

  .feedback-row { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .feedback-row .top { display: flex; justify-content: space-between; align-items: center; }
  .feedback-row .from { font-size: 12px; font-weight: 700; }
  .feedback-row .msg { font-size: 11.5px; color: var(--text-muted); margin: 5px 0 0; }
  .feedback-row .date { font-size: 10px; color: var(--text-muted); margin: 5px 0 0; }
  .dot-unread { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); display: inline-block; margin-left: 6px; }

  .me-hero { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); border-radius: 16px; padding: 26px 20px 22px; text-align: center; margin-top: 4px; }
  .me-hero-avatar { width: 76px; height: 76px; margin: 0 auto 12px; font-size: 24px; background: rgba(255,255,255,0.25); color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.4); }
  .me-hero-name { color: #fff; font-size: 17px; font-weight: 800; margin: 0; }
  .me-hero-role { color: rgba(255,255,255,0.85); font-size: 12px; margin: 3px 0 0; }
  .me-menu-list { margin-top: 16px; }
  .me-menu-row { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .me-menu-row:last-child { border-bottom: none; }
  .me-menu-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .me-menu-label { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
  .me-menu-chevron { color: var(--text-muted); font-size: 15px; }
  #signout-btn { width: 100%; margin-top: 24px; background: var(--gray-l); color: var(--pink-d); border: none; border-radius: 10px; padding: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; }

  nav.tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 460px; background: #fff; border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(5, 1fr); z-index: 10;
  }
  nav.tab-bar button {
    background: none; border: none; padding: 9px 0 8px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; font-size: 9.5px; color: var(--text-muted); cursor: pointer; font-family: inherit;
  }
  nav.tab-bar button .icon { font-size: 16px; }
  nav.tab-bar button.active { color: var(--blue); font-weight: 700; }

  .loading, .empty-state, .error-state { padding: 24px; text-align: center; color: var(--text-muted); font-size: 12.5px; }
  .error-state { color: var(--pink-d); }

  .row-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btn-sm { font-size: 10.5px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--text-primary); cursor: pointer; font-family: inherit; font-weight: 600; }
  .btn-sm.primary { background: var(--blue); color: #fff; border: none; }
  .goal-update-btn { background: none; border: 1px solid var(--border); border-radius: 7px; padding: 4px 9px; font-size: 10px; font-weight: 700; color: var(--blue); cursor: pointer; font-family: inherit; margin-top: 8px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20,20,30,0.5); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-box {
    background: #fff; border-radius: 20px 20px 0 0; padding: 10px 22px 24px; width: 100%; max-width: 460px;
    max-height: 85vh; overflow-y: auto;
    box-shadow: 0 -12px 40px rgba(20,20,40,0.22), inset 0 0 0 3px var(--blue);
  }
  .modal-box::before { content: ""; display: block; width: 38px; height: 4px; background: var(--gray-l); border-radius: 3px; margin: 0 auto 18px; }
  .modal-box h3 { margin: 0 0 3px; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
  .modal-box .modal-sub { margin: 0 0 14px; color: var(--text-muted); font-size: 12.5px; }
  .modal-box label { display: block; font-size: 10.5px; font-weight: 700; color: var(--text-muted); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .modal-box textarea, .modal-box select, .modal-box input[type="date"], .modal-box input[type="text"] {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; box-sizing: border-box; color: var(--text-primary);
    background: var(--page-bg); transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .modal-box textarea:focus, .modal-box select:focus, .modal-box input:focus {
    outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px var(--blue-light);
  }
  .modal-box textarea { min-height: 70px; resize: vertical; }
  .modal-box input[type="range"] { width: 100%; accent-color: var(--blue); background: none; padding: 0; border: none; }
  .range-value { font-size: 13px; font-weight: 700; color: var(--blue); }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 11px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; }
  .modal-actions .btn-cancel { background: var(--gray-l); color: var(--text-primary); }
  .modal-actions .btn-save { background: var(--blue); color: #fff; box-shadow: 0 6px 16px rgba(58,63,240,0.3); }
  .modal-actions .btn-save:disabled { opacity: 0.6; cursor: default; box-shadow: none; }
  .delete-link { display: block; background: none; border: none; color: var(--pink-d); font-size: 12px; font-weight: 700; cursor: pointer; padding: 0; margin: 16px 0 0; font-family: inherit; }
  .delete-icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 2px 4px; font-family: inherit; flex-shrink: 0; }
  .locked-field { font-size: 14px; font-weight: 600; margin: 0; padding: 10px 12px; background: var(--page-bg); border-radius: 10px; color: var(--text-primary); }

  .learning-row { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .learning-row .l-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--purple-l); color: var(--purple-d); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .learning-row .l-info { flex: 1; min-width: 0; }
  .learning-row .l-title { font-size: 13px; font-weight: 700; margin: 0; }
  .learning-row .l-date { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }

  .course-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--blue-light); }
  .course-card .course-title { font-size: 13px; font-weight: 700; margin: 0 0 4px; }
  .course-card .course-meta { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }
  .course-card .express-btn { display: inline-block; margin-top: 9px; background: var(--blue); color: #fff; text-decoration: none; font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 7px; }

  .achievement-row { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .achievement-row .a-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--gold); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .achievement-row .a-info { flex: 1; min-width: 0; }
  .achievement-row .a-title { font-size: 13px; font-weight: 700; margin: 0; }
  .achievement-row .a-date { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }

  .evidence-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .evidence-row:last-child { border-bottom: none; }
  .evidence-row a { color: var(--blue); text-decoration: none; font-weight: 600; font-size: 12.5px; }
  .modal-box label.upload-link {
    display: inline-flex; align-items: center; gap: 4px; text-transform: none; letter-spacing: normal;
    background: var(--page-bg); border: 1px dashed var(--border); border-radius: 8px; padding: 8px 12px;
    font-size: 12px; font-weight: 700; color: var(--blue); cursor: pointer; margin: 0;
  }
  .upload-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--text-primary); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 12.5px; z-index: 60; }

  .review-close { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; margin: 4px 0 14px; padding: 0; font-family: inherit; }
  .review-step-label { font-size: 11px; color: var(--text-muted); margin: 0 0 6px; font-weight: 600; }
  .review-progress-track { height: 6px; background: var(--gray-l); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
  .review-progress-fill { height: 100%; background: var(--blue); border-radius: 4px; transition: width 0.25s ease; }
  .review-step-title { font-size: 16px; font-weight: 800; margin: 0 0 3px; }
  .review-step-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 16px; }
  .criterion-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .criterion-row:last-of-type { border-bottom: none; }
  .criterion-label { font-size: 13.5px; font-weight: 600; flex: 1; }
  .star-rating { display: flex; gap: 3px; flex-shrink: 0; }
  .star { font-size: 21px; line-height: 1; cursor: pointer; color: #DEDCE8; user-select: none; transition: color 0.1s; }
  .star.filled { color: var(--gold); }
  .review-info-box { background: var(--purple-l); color: var(--purple-d); border-radius: 10px; padding: 12px 14px; font-size: 11.5px; margin: 18px 0 4px; display: flex; gap: 9px; align-items: flex-start; line-height: 1.4; }
  .review-info-box b { display: block; margin-bottom: 2px; }
  .review-nav { display: flex; gap: 10px; margin-top: 22px; }
  .review-nav button { flex: 1; padding: 12px; border-radius: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; }

<script>
/* ============================================================================
   CONFIG
   ============================================================================ */
const CONFIG = {
  clientId: "d5aef866-584f-4226-ab11-c941888fb519",
  tenantId: "conceptcompg.onmicrosoft.com",
  redirectUri: window.location.origin + window.location.pathname,
  siteHostname: "conceptcompg.sharepoint.com",
  sitePath: "/sites/perforM",
  scopes: ["Sites.ReadWrite.All", "User.Read", "User.ReadBasic.All"]
};

const LISTS = {
  employees: "PMS_Employees",
  establishment: "PMS_Establishment",
  goals: "PMS_Goals",
  goalUpdates: "PMS_GoalUpdates",
  checkIns: "PMS_CheckIns",
  reviews: "PMS_Reviews",
  reviewCycles: "PMS_ReviewCycles",
  reviewCriteria: "PMS_ReviewCriteria",
  reviewResponses: "PMS_ReviewResponses",
  feedback: "PMS_Feedback",
  developmentPlan: "PMS_DevelopmentPlan",
  evidence: "PMS_Evidence"
};

const TRAINING_SITE = {
  hostname: "conceptcompg.sharepoint.com",
  sitePath: "/sites/training.admin",
  courseRunsList: "CG_CourseRuns",
  interestEmail: "training@concept.com.pg"
};

const CATEGORY_COLORS = {
  Finance:  { bg: "var(--purple-l)", fg: "var(--purple-d)", ring: "var(--purple)" },
  People:   { bg: "var(--teal-l)",   fg: "var(--teal-d)",   ring: "var(--teal)" },
  Customer: { bg: "var(--coral-l)",  fg: "var(--coral-d)",  ring: "var(--coral)" },
  Company:  { bg: "var(--purple-l)", fg: "var(--purple-d)", ring: "var(--purple)" }
};
const AT_RISK = { bg: "var(--pink-l)", fg: "var(--pink-d)", ring: "var(--pink)" };

/* ============================================================================
   AUTH (MSAL PKCE)
   ============================================================================ */
const msalInstance = new msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: CONFIG.redirectUri
  },
  cache: { cacheLocation: "sessionStorage" }
});

let currentAccount = null;

async function initAuth() {
  await msalInstance.initialize();
  const result = await msalInstance.handleRedirectPromise();
  if (result && result.account) {
    currentAccount = result.account;
  } else {
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) currentAccount = accounts[0];
  }
  if (currentAccount) {
    showApp();
  } else {
    document.getElementById("signin-screen").style.display = "flex";
  }
}

document.getElementById("signin-btn").addEventListener("click", () => {
  msalInstance.loginRedirect({ scopes: CONFIG.scopes });
});

async function getAccessToken() {
  const request = { scopes: CONFIG.scopes, account: currentAccount };
  try {
    const result = await msalInstance.acquireTokenSilent(request);
    return result.accessToken;
  } catch (e) {
    const result = await msalInstance.acquireTokenRedirect(request);
    return result.accessToken;
  }
}

/* ============================================================================
   GRAPH API HELPERS
   ============================================================================ */
let siteIdCache = null;
let listIdCache = {};

async function graphFetch(path, options = {}) {
  const token = await getAccessToken();
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    ...options,
    headers: {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json",
      "Prefer": "HonorNonIndexedQueriesWarningMayFailRandomly",
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`Graph request failed (${res.status}): ${body}`);
  }
  return res.status === 204 ? null : res.json();
}

async function getSiteId() {
  if (siteIdCache) return siteIdCache;
  const data = await graphFetch(`/sites/${CONFIG.siteHostname}:${CONFIG.sitePath}`);
  siteIdCache = data.id;
  return siteIdCache;
}

async function getListId(displayName) {
  if (listIdCache[displayName]) return listIdCache[displayName];
  const siteId = await getSiteId();
  const data = await graphFetch(`/sites/${siteId}/lists?$filter=displayName eq '${displayName}'`);
  if (!data.value || data.value.length === 0) throw new Error(`List not found: ${displayName}`);
  listIdCache[displayName] = data.value[0].id;
  return listIdCache[displayName];
}

async function getListItems(displayName, filter) {
  const siteId = await getSiteId();
  const listId = await getListId(displayName);
  let path = `/sites/${siteId}/lists/${listId}/items?expand=fields`;
  if (filter) path += `&$filter=${encodeURIComponent(filter)}`;
  const data = await graphFetch(path);
  return (data.value || []).map(item => ({ id: item.id, ...item.fields }));
}

/* ============================================================================
   CROSS-SITE READ — CG Training Hub (training.admin site)
   Read-only: perforM never writes back to this site.
   ============================================================================ */
let trainingSiteIdCache = null;
async function getTrainingSiteId() {
  if (trainingSiteIdCache) return trainingSiteIdCache;
  const data = await graphFetch(`/sites/${TRAINING_SITE.hostname}:${TRAINING_SITE.sitePath}`);
  trainingSiteIdCache = data.id;
  return trainingSiteIdCache;
}

const trainingListIdCache = {};
async function getTrainingListId(displayName) {
  if (trainingListIdCache[displayName]) return trainingListIdCache[displayName];
  const siteId = await getTrainingSiteId();
  const data = await graphFetch(`/sites/${siteId}/lists?$filter=displayName eq '${displayName}'`);
  if (!data.value || data.value.length === 0) throw new Error(`List not found: ${displayName}`);
  trainingListIdCache[displayName] = data.value[0].id;
  return trainingListIdCache[displayName];
}

async function getTrainingListItems(displayName, filter) {
  const siteId = await getTrainingSiteId();
  const listId = await getTrainingListId(displayName);
  let path = `/sites/${siteId}/lists/${listId}/items?expand=fields`;
  if (filter) path += `&$filter=${encodeURIComponent(filter)}`;
  const data = await graphFetch(path);
  return (data.value || []).map(item => ({ id: item.id, ...item.fields }));
}

async function getUpcomingInternalCourses() {
  const todayIso = new Date().toISOString().slice(0, 10) + "T00:00:00Z";
  const filter = `fields/StartDate ge '${todayIso}' and (fields/Status eq 'Scheduled' or fields/Status eq 'Active')`;
  const items = await getTrainingListItems(TRAINING_SITE.courseRunsList, filter);
  items.sort((a, b) => new Date(a.StartDate || 0) - new Date(b.StartDate || 0));
  return items;
}

function cleanCourseTitle(title) {
  return (title || "").replace(/\s+\d{4}-\d{2}-\d{2}$/, "");
}

function courseInterestMailto(course) {
  const title = cleanCourseTitle(course.Title);
  const subject = encodeURIComponent(`Internal Request: Expression of Interest — ${title}`);
  const body = encodeURIComponent(
    `Hi,\n\nI'd like to express interest in the following internal training course:\n\n` +
    `Course: ${title}\n` +
    `Dates: ${fmtDate(course.StartDate)} - ${fmtDate(course.EndDate)}\n` +
    `Trainer: ${course.Trainer || "TBC"}\n` +
    `Venue: ${course.Venue || "TBC"}\n\n` +
    `Requested by: ${me.GivenName} ${me.FamilyName} (${me.EmployeeID})\n\n` +
    `Thanks.`
  );
  return `mailto:${TRAINING_SITE.interestEmail}?subject=${subject}&body=${body}`;

/* ============================================================================
   DRIVE API — PMS_Documents library (file upload/list/delete)
   ============================================================================ */
const MAX_UPLOAD_BYTES = 4 * 1024 * 1024; // 4MB — simple PUT upload limit, larger files need a resumable session (not implemented)

let driveIdCache = null;
async function getDocumentsDriveId() {
  if (driveIdCache) return driveIdCache;
  const siteId = await getSiteId();
  const data = await graphFetch(`/sites/${siteId}/drives`);
  const drive = (data.value || []).find(d => d.name === "PMS_Documents");
  if (!drive) throw new Error("PMS_Documents library not found. Has it been created in SharePoint yet?");
  driveIdCache = drive.id;
  return driveIdCache;
}

async function ensureUserFolder(employeeId) {
  const driveId = await getDocumentsDriveId();
  const token = await getAccessToken();
  const checkRes = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${employeeId}`, {
    headers: { "Authorization": `Bearer ${token}` }
  });
  if (checkRes.ok) return;
  await graphFetch(`/drives/${driveId}/root/children`, {
    method: "POST",
    body: JSON.stringify({ name: employeeId, folder: {}, "@microsoft.graph.conflictBehavior": "replace" })
  });
}

async function listUserFolderFiles(employeeId) {
  const driveId = await getDocumentsDriveId();
  try {
    const data = await graphFetch(`/drives/${driveId}/root:/${employeeId}:/children`);
    return data.value || [];
  } catch (e) {
    return []; // folder doesn't exist yet — nothing uploaded
  }
}

async function uploadFileToUserFolder(employeeId, file) {
  const driveId = await getDocumentsDriveId();
  await ensureUserFolder(employeeId);
  const token = await getAccessToken();
  const safeName = file.name.replace(/[#%*:<>?/\\{|}]/g, "_");
  const res = await fetch(
    `https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${employeeId}/${encodeURIComponent(safeName)}:/content`,
    {
      method: "PUT",
      headers: { "Authorization": `Bearer ${token}`, "Content-Type": file.type || "application/octet-stream" },
      body: file
    }
  );
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`Upload failed (${res.status}): ${body}`);
  }
  return res.json();
}

async function deleteDriveItem(itemId) {
  const driveId = await getDocumentsDriveId();
  const token = await getAccessToken();
  const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}`, {
    method: "DELETE",
    headers: { "Authorization": `Bearer ${token}` }
  });
  if (!res.ok && res.status !== 404) {
    throw new Error(`Delete failed (${res.status})`);
  }
}

function formatFileSize(bytes) {
  if (!bytes) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
  return (bytes / 1024 / 1024).toFixed(1) + " MB";
}

async function resolveCurrentEmployee() {
  const email = currentAccount.username;
  const matches = await getListItems(LISTS.employees, `fields/EmailAddress eq '${email}'`);
  if (matches.length === 0) {
    throw new Error(`No PMS_Employees record found with EmailAddress = ${email}.`);
  }
  me = matches[0];
  const posMatches = await getListItems(LISTS.establishment, `fields/EmployeeID eq '${me.EmployeeID}'`);
  myPosition = posMatches[0] || null;
}

async function getDirectReports() {
  if (!myPosition) return [];
  const reports = await getListItems(LISTS.establishment, `fields/ReportsTo eq '${myPosition.JobKey}'`);
  return attachEmployeeDetails(reports);
}
async function getPeers() {
  if (!myPosition || !myPosition.ReportsTo) return [];
  const peers = await getListItems(LISTS.establishment, `fields/ReportsTo eq '${myPosition.ReportsTo}'`);
  return attachEmployeeDetails(peers.filter(p => p.JobKey !== myPosition.JobKey));
}
async function attachEmployeeDetails(positionRows) {
  const results = [];
  for (const pos of positionRows) {
    if (!pos.EmployeeID || pos.EmployeeID === "0") continue;
    const empMatches = await getListItems(LISTS.employees, `fields/EmployeeID eq '${pos.EmployeeID}'`);
    if (empMatches.length > 0) results.push({ ...empMatches[0], PositionTitle: pos.PositionTitle });
  }
  return results;
}

async function getManager() {
  if (!myPosition || !myPosition.ReportsTo) return null;
  const mgrPos = await getListItems(LISTS.establishment, `fields/JobKey eq '${myPosition.ReportsTo}'`);
  if (!mgrPos[0] || !mgrPos[0].EmployeeID || mgrPos[0].EmployeeID === "0") return null;
  const mgrEmp = await getListItems(LISTS.employees, `fields/EmployeeID eq '${mgrPos[0].EmployeeID}'`);
  if (!mgrEmp[0]) return null;
  return { ...mgrEmp[0], PositionTitle: mgrPos[0].PositionTitle };
}

const employeeNameCache = {};
async function getEmployeeName(employeeId) {
  if (employeeNameCache[employeeId]) return employeeNameCache[employeeId];
  const rows = await getListItems(LISTS.employees, `fields/EmployeeID eq '${employeeId}'`);
  const name = rows[0] ? `${rows[0].GivenName} ${rows[0].FamilyName}` : employeeId;
  employeeNameCache[employeeId] = name;
  return name;
}

function initials(emp) {
  const g = (emp.GivenName || "?")[0] || "?";
  const f = (emp.FamilyName || "?")[0] || "?";
  return (g + f).toUpperCase();
}
function ringHtml(pct, color, size, holeSize, fontSize) {
  return `<div class="ring" style="width:${size}px;height:${size}px;background: conic-gradient(${color} ${pct * 3.6}deg, #EEEEF0 0deg)">
            <div class="hole" style="width:${holeSize}px;height:${holeSize}px;font-size:${fontSize}px">${pct}%</div>
          </div>`;
}
function ratingWord(rating) {
  if (rating === null || rating === undefined) return "Not rated";
  if (rating >= 4.5) return "Excellent";
  if (rating >= 4.0) return "Very Good";
  if (rating >= 3.0) return "Good";
  if (rating >= 2.0) return "Needs Improvement";
  return "Unsatisfactory";
}
function escAttr(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function ratingBadgeColor(rating) {
  if (rating == null) return { bg: "var(--gray-l)", fg: "var(--gray-d)" };
  if (rating >= 4.5) return { bg: "var(--teal-l)", fg: "var(--teal-d)" };
  if (rating >= 4.0) return { bg: "var(--purple-l)", fg: "var(--purple-d)" };
  if (rating >= 3.0) return { bg: "var(--amber-l)", fg: "var(--amber-d)" };
  return { bg: "var(--pink-l)", fg: "var(--pink-d)" };
}
function fmtDate(d) {
  return d ? new Date(d).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" }) : "—";
}

let profilePhotoUrl; // undefined = not checked yet, null = checked and none exists, string = usable blob URL
async function getMyPhotoUrl() {
  if (profilePhotoUrl !== undefined) return profilePhotoUrl;
  try {
    const token = await getAccessToken();
    const res = await fetch("https://graph.microsoft.com/v1.0/me/photo/$value", {
      headers: { "Authorization": `Bearer ${token}` }
    });
    if (!res.ok) { profilePhotoUrl = null; return null; }
    const blob = await res.blob();
    profilePhotoUrl = URL.createObjectURL(blob);
  } catch (e) {
    profilePhotoUrl = null;
  }
  return profilePhotoUrl;
}
function applyPhotoTo(elementId) {
  getMyPhotoUrl().then(url => {
    const el = document.getElementById(elementId);
    if (url && el) {
      el.innerHTML = `<img src="${url}" alt="${me.GivenName} ${me.FamilyName}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    }
  });
}

const userPhotoCache = new Map();
async function getPhotoUrlForUser(identifier) {
  if (!identifier) return null;
  if (userPhotoCache.has(identifier)) return userPhotoCache.get(identifier);
  let url = null;
  try {
    const token = await getAccessToken();
    const res = await fetch(`https://graph.microsoft.com/v1.0/users/${encodeURIComponent(identifier)}/photo/$value`, {
      headers: { "Authorization": `Bearer ${token}` }
    });
    if (res.ok) {
      const blob = await res.blob();
      url = URL.createObjectURL(blob);
    }
  } catch (e) { /* no photo or no access — fall back to initials */ }
  userPhotoCache.set(identifier, url);
  return url;
}
function applyUserPhotoTo(elementId, identifier) {
  if (!identifier) return;
  getPhotoUrlForUser(identifier).then(url => {
    const el = document.getElementById(elementId);
    if (url && el) {
      el.innerHTML = `<img src="${url}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    }
  });
}

function openModal(html) {
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal-overlay").style.display = "flex";
}
function closeModal() {
  document.getElementById("modal-overlay").style.display = "none";
  document.getElementById("modal-box").innerHTML = "";
}
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") closeModal();
});
function showToast(message) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = message;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

async function submitGoalUpdate(goalId) {
  const btn = document.getElementById("goal-save-btn");
  const title = document.getElementById("eg-title").value.trim();
  const category = document.getElementById("eg-category").value;
  const dueVal = document.getElementById("eg-due").value;
  const progress = parseInt(document.getElementById("prog-input").value, 10);
  const status = document.getElementById("status-input").value;
  const comment = document.getElementById("comment-input").value;
  if (!title) { showToast("Title can't be empty"); return; }
  btn.disabled = true;
  btn.textContent = "Saving...";
  try {
    const fields = { Title: title, Category: category, ProgressPercent: progress, Status: status };
    if (dueVal) fields.DueDate = new Date(dueVal).toISOString();
    await updateListItemFields(LISTS.goals, goalId, fields);
    await createListItem(LISTS.goalUpdates, {
      Title: "Update",
      GoalID: goalId,
      UpdateDate: new Date().toISOString(),
      ProgressPercent: progress,
      Comment: comment,
      UpdatedByEmployeeID: me.EmployeeID
    });
    closeModal();
    showToast("Goal updated");
    renderedTabs.delete("dashboard");
    await renderGoals();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Save";
    showToast("Couldn't save — try again");
  }
}

async function deleteGoal(goalId) {
  const goal = goalsCache[goalId];
  if (!confirm(`Delete "${goal ? goal.Title : "this goal"}"? This can't be undone.`)) return;
  try {
    await deleteListItem(LISTS.goals, goalId);
    closeModal();
    showToast("Goal deleted");
    renderedTabs.delete("dashboard");
    await renderGoals();
  } catch (e) {
    showToast("Couldn't delete — try again");
  }
}

async function getParentGoalOptions(forEmployeeId) {
  const myCompanyGoals = await getListItems(LISTS.goals, `fields/OwnerEmployeeID eq '${me.EmployeeID}' and fields/Category eq 'Company'`);
  let options = [...myCompanyGoals];
  if (forEmployeeId === me.EmployeeID && myPosition && myPosition.ReportsTo) {
    const mgrPos = await getListItems(LISTS.establishment, `fields/JobKey eq '${myPosition.ReportsTo}'`);
    const mgrEmployeeId = mgrPos[0] ? mgrPos[0].EmployeeID : null;
    if (mgrEmployeeId && mgrEmployeeId !== "0") {
      const mgrGoals = await getListItems(LISTS.goals, `fields/OwnerEmployeeID eq '${mgrEmployeeId}' and fields/Category eq 'Company'`);
      options.push(...mgrGoals);
    }
  }
  const seen = new Set();
  return options.filter(g => (seen.has(g.id) ? false : (seen.add(g.id), true)));
}

async function submitNewGoal(employeeId) {
  const btn = document.getElementById("ng-save-btn");
  const isAssigning = employeeId !== me.EmployeeID;
  const title = document.getElementById("ng-title").value.trim();
  const desc = document.getElementById("ng-desc").value;
  const category = document.getElementById("ng-category").value;
  const dueVal = document.getElementById("ng-due").value;
  const visibility = document.getElementById("ng-visibility").value;
  const parent = document.getElementById("ng-parent").value;
  if (!title) { showToast("Add a title before saving"); return; }
  if (!dueVal) { showToast("Pick a due date"); return; }
  btn.disabled = true;
  btn.textContent = "Saving...";
  try {
    await createListItem(LISTS.goals, {
      Title: title,
      GoalDescription: desc,
      OwnerEmployeeID: employeeId,
      Category: category,
      ParentGoalID: parent || "",
      StartDate: new Date().toISOString(),
      DueDate: new Date(dueVal).toISOString(),
      ProgressPercent: 0,
      PacingPercent: 0,
      Status: "On Track",
      Visibility: visibility
    });
    closeModal();
    showToast(isAssigning ? "Goal assigned" : "Goal added");
    renderedTabs.delete("dashboard");

      await openPersonDetail(employeeId, personDetailContext ? personDetailContext.isDirectReport : false);

  } catch (e) {

    showToast("Couldn't save — try again");

}

async function renderFeedback() {
  const el = document.getElementById("view-feedback");
  el.innerHTML = `<div class="loading">Loading feedback...</div>`;

  const [toMe, awaitingMe] = await Promise.all([
    getListItems(LISTS.feedback, `fields/ToEmployeeID eq '${me.EmployeeID}'`),
    getListItems(LISTS.feedback, `fields/FromEmployeeID eq '${me.EmployeeID}' and fields/RequestStatus eq 'Pending'`)
  ]);

  const aboutMe = toMe.filter(f => f.RequestStatus !== "Pending");
  const sentRequests = toMe.filter(f => f.RequestStatus === "Pending");
  aboutMe.sort((a, b) => new Date(b.DateSubmitted || 0) - new Date(a.DateSubmitted || 0));

  const aboutMeRows = await Promise.all(aboutMe.map(async f => ({ ...f, fromName: await getEmployeeName(f.FromEmployeeID) })));
  const sentRows = await Promise.all(sentRequests.map(async f => ({ ...f, fromName: await getEmployeeName(f.FromEmployeeID) })));
  const awaitingRows = await Promise.all(awaitingMe.map(async f => ({ ...f, toName: await getEmployeeName(f.ToEmployeeID) })));

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
      <p class="section-title" style="margin:0">Feedback (${aboutMeRows.length})</p>
      <button class="btn-sm primary" onclick="openRequestFeedbackModal()">+ Request feedback</button>
    </div>
    ${aboutMeRows.length ? aboutMeRows.map(f => `
      <div class="feedback-row">
        <div class="top">
          <span class="from">${f.fromName}${(f.IsRead === false || f.IsRead === "false") ? `<span class="dot-unread"></span>` : ""}</span>
          <span class="badge" style="background:var(--purple-l);color:var(--purple-d)">${f.RelationshipType || ""}</span>
        </div>
        <p class="msg">${f.Message || ""}</p>
        <p class="date">${fmtDate(f.DateSubmitted)}</p>
      </div>`).join("") : `<div class="empty-state">No feedback yet.</div>`}

    ${sentRows.length ? `
      <p class="section-title">Requests you've sent (${sentRows.length})</p>
      <div class="panel" style="padding:4px 14px">
        ${sentRows.map(f => `
          <div class="peer-row">
            <div class="info"><p class="pname">${f.fromName}</p><p class="prole">${f.RelationshipType || ""}</p></div>
            <span class="status-chip" style="background:var(--amber-l);color:var(--amber-d)">Pending</span>
            <button class="btn-sm" style="margin-left:8px" onclick="cancelFeedbackRequest('${f.id}')">Cancel</button>
          </div>`).join("")}
      </div>
    ` : ""}

    ${awaitingRows.length ? `
      <p class="section-title">Requests awaiting your response (${awaitingRows.length})</p>
      <div class="panel" style="padding:4px 14px">
        ${awaitingRows.map(f => `
          <div class="peer-row">
            <div class="info"><p class="pname">${f.toName}</p><p class="prole">Wants your feedback</p></div>
            <button class="btn-sm primary" onclick="openRespondToRequestModal('${f.id}', '${escAttr(f.toName)}')">Respond</button>
          </div>`).join("")}
      </div>
    ` : ""}
  `;

  const unreadIds = aboutMeRows.filter(f => f.IsRead === false || f.IsRead === "false").map(f => f.id);
  if (unreadIds.length) {
    Promise.all(unreadIds.map(id => updateListItemFields(LISTS.feedback, id, { IsRead: true })))
      .then(() => { renderedTabs.delete("dashboard"); })
      .catch(() => {});
  }
}

async function cancelFeedbackRequest(feedbackId) {
  if (!confirm("Cancel this feedback request?")) return;
  try {
    await deleteListItem(LISTS.feedback, feedbackId);
    showToast("Request cancelled");
    await renderFeedback();
  } catch (e) {
    showToast("Couldn't cancel — try again");
  }
}

  const [peers, reports, manager] = await Promise.all([getPeers(), getDirectReports(), getManager()]);
  const candidates = [
    ...peers.map(p => ({ ...p, relationship: "Peer" })),

async function submitFeedbackRequests() {
  const btn = document.getElementById("req-save-btn");
  const checked = Array.from(document.querySelectorAll(".nominee-row input[type=checkbox]:checked"));
  if (checked.length === 0) { showToast("Select at least one person"); return; }
  btn.disabled = true;
  btn.textContent = "Sending...";
  try {
    const activeCycles = await getListItems(LISTS.reviewCycles, `fields/CycleStatus eq 'Active'`);
    const cycleId = activeCycles[0] ? activeCycles[0].id : "";
    for (const cb of checked) {
      await createListItem(LISTS.feedback, {
        Title: "Feedback request",
        FromEmployeeID: cb.value,
        ToEmployeeID: me.EmployeeID,
        RelationshipType: cb.getAttribute("data-rel"),
        Message: "",
        IsRead: false,
        RequestStatus: "Pending",
        LinkedCycleID: cycleId
      });
    }
    closeModal();
    showToast(`Sent ${checked.length} request${checked.length > 1 ? "s" : ""}`);
    await renderFeedback();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Send requests";
    showToast("Couldn't send — try again");
  }
}

async function renderTeam() {
  const el = document.getElementById("view-team");
  el.innerHTML = `<div class="loading">Loading your team...</div>`;
  const reports = await getDirectReports();
  const peers = await getPeers();
  const list = reports.length > 0 ? reports : peers;
  const label = reports.length > 0 ? "direct reports" : "peers";

  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state">No team members found in the org hierarchy.</div>`;
    return;
  }

  const enriched = await Promise.all(list.map(async (person) => {
    const [goals, reviews] = await Promise.all([
      getListItems(LISTS.goals, `fields/OwnerEmployeeID eq '${person.EmployeeID}'`),
      getListItems(LISTS.reviews, `fields/EmployeeID eq '${person.EmployeeID}'`)
    ]);
    const latestReview = reviews.sort((a, b) => new Date(b.DueDate || 0) - new Date(a.DueDate || 0))[0];
    teamCache[person.EmployeeID] = person;
    return { person, goals, rating: latestReview ? latestReview.OverallRating : null };
  }));

  const teamGoals = enriched.flatMap(e => e.goals);
  const teamGoalsTotal = teamGoals.length;
  const teamComplete = teamGoals.filter(g => g.Status === "Complete").length;
  const teamOnTrackOnly = teamGoals.filter(g => g.Status === "On Track").length;
  const teamAtRisk = teamGoals.filter(g => g.Status === "At Risk").length;
  const teamOnTrackCombined = teamComplete + teamOnTrackOnly;

  const ratedMembers = enriched.filter(e => e.rating != null);
  const teamAvgRating = ratedMembers.length ? (ratedMembers.reduce((s, e) => s + e.rating, 0) / ratedMembers.length) : null;
  const topPerformers = enriched.filter(e => e.rating != null && e.rating >= 4.5).length;
  const heroPct = teamGoalsTotal ? Math.round(teamOnTrackCombined / teamGoalsTotal * 100) : 0;

  const myCompanyGoals = await getListItems(LISTS.goals, `fields/OwnerEmployeeID eq '${me.EmployeeID}' and fields/Category eq 'Company'`);
  const seenIds = new Set();
  const focusGoals = [...myCompanyGoals, ...teamGoals.filter(g => g.Category === "Company")]

        <p class="rating-word">${ratingWord(teamAvgRating)}</p>
      </div>
      <div class="hero-ring">
        <div class="ring-outer" style="width:92px;height:92px;background: conic-gradient(
          var(--teal) 0 ${teamGoalsTotal ? teamOnTrackOnly/teamGoalsTotal*360 : 0}deg,
          var(--gold) ${teamGoalsTotal ? teamOnTrackOnly/teamGoalsTotal*360 : 0}deg ${teamGoalsTotal ? teamOnTrackCombined/teamGoalsTotal*360 : 0}deg,
          var(--coral) ${teamGoalsTotal ? teamOnTrackCombined/teamGoalsTotal*360 : 0}deg ${teamGoalsTotal ? (teamOnTrackCombined+teamAtRisk)/teamGoalsTotal*360 : 0}deg,
          var(--red) ${teamGoalsTotal ? (teamOnTrackCombined+teamAtRisk)/teamGoalsTotal*360 : 0}deg 360deg
        )"></div>
        <div class="ring-hole"></div>
        <div class="pct">${heroPct}%</div>
      </div>
    </div>

    <div class="tile-row" style="grid-template-columns:repeat(3,1fr)">
      <div class="tile" style="background:var(--purple-l)">
        <div class="tile-icon" style="background:rgba(255,255,255,0.6);color:var(--purple-d)">&#10003;</div>
        <p class="num" style="color:var(--purple-d)">${teamGoalsTotal}</p>
        <p class="lbl">Goals<br>${teamOnTrackCombined} On Track</p>
      </div>
      <div class="tile" style="background:var(--teal-l)">
        <div class="tile-icon" style="background:rgba(255,255,255,0.6);color:var(--teal-d)">&#128101;</div>
        <p class="num" style="color:var(--teal-d)">${list.length}</p>
        <p class="lbl">Team Members</p>
      </div>
      <div class="tile" style="background:var(--coral-l)">
        <div class="tile-icon" style="background:rgba(255,255,255,0.6);color:var(--coral-d)">&#9733;</div>
        <p class="num" style="color:var(--coral-d)">${topPerformers}</p>
        <p class="lbl">Top Performers<br>This Quarter</p>
      </div>
    </div>

    <p class="section-title">My ${label} (${list.length})</p>
    <div class="panel" style="padding:4px 14px">
      ${enriched.map(e => {
        const rc = ratingBadgeColor(e.rating);
        return `
        <div class="peer-row" style="align-items:flex-start;flex-wrap:wrap;cursor:pointer" onclick="openPersonDetail('${e.person.EmployeeID}', ${reports.length > 0})">
          <span class="avatar-sm" id="team-avatar-${e.person.EmployeeID}" style="width:34px;height:34px;font-size:11px;background:var(--purple-l);color:var(--purple-d)">${initials(e.person)}</span>

            <p class="pname">${e.person.GivenName} ${e.person.FamilyName}</p>

  enriched.forEach(e => {
    applyUserPhotoTo(`team-avatar-${e.person.EmployeeID}`, e.person.EmailAddress);

async function openDevItemModal(activityType, itemId) {
  const item = itemId ? devItemsCache[itemId] : null;
  const isAchievement = activityType === "Achievement";
  const statuses = ["Not Started", "In Progress", "Completed"];
  const placeholders = {
    "Career Goal": "e.g. Progress toward Director track",
    "Development Plan": "e.g. Complete leadership training",
    "Learning": "e.g. AWS certification",
    "Achievement": "e.g. Led successful platform migration"
  };
  const targetVal = item && item.TargetDate ? new Date(item.TargetDate).toISOString().slice(0, 10) : "";
  const achievedVal = item && item.DateAchieved ? new Date(item.DateAchieved).toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10);
  const evidence = (isAchievement && item) ? await getListItems(LISTS.evidence, `fields/RecordType eq 'Achievement' and fields/RecordID eq '${itemId}'`) : [];

  openModal(`
    <h3>${item ? "Edit" : "Add"} ${activityType}</h3>
    <label>Title</label>
    <input type="text" id="di-title" value="${item ? escAttr(item.Title) : ""}" placeholder="${placeholders[activityType] || ""}">
    <label>Description (optional)</label>
    <textarea id="di-desc" placeholder="Details...">${item ? (item.PlanDescription || "") : ""}</textarea>
    ${isAchievement ? `
      <label>Date achieved</label>
      <input type="date" id="di-achieved" value="${achievedVal}">
    ` : `
      <label>Status</label>
      <select id="di-status">
        ${statuses.map(s => `<option value="${s}" ${item && item.PlanStatus === s ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      <label>Target date</label>
      <input type="date" id="di-target" value="${targetVal}">
      <label>Progress <span class="range-value" id="di-prog-val">${item ? (item.ProgressPercent || 0) : 0}%</span></label>
      <input type="range" id="di-progress" min="0" max="100" step="5" value="${item ? (item.ProgressPercent || 0) : 0}"
        oninput="document.getElementById('di-prog-val').textContent = this.value + '%'">
    `}
    ${(isAchievement && item) ? `
      <label>Evidence</label>
      <div>
        ${evidence.length ? evidence.map(ev => `
          <div class="evidence-row">
            <a href="${ev.FileUrl}" target="_blank" rel="noopener">${ev.FileName}</a>
            <button class="delete-icon-btn" onclick="removeEvidence('${ev.id}', 'Achievement', '${itemId}')" title="Remove">&#10005;</button>
          </div>`).join("") : `<p style="font-size:11.5px;color:var(--text-muted);margin:2px 0">No evidence attached yet.</p>`}
      </div>
      <div class="upload-row">
        <label class="upload-link">+ Attach evidence
          <input type="file" style="display:none" onchange="handleEvidenceUpload(this, 'Achievement', '${itemId}')">
        </label>
        <label class="upload-link">&#128247; Take photo
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="handleEvidenceUpload(this, 'Achievement', '${itemId}')">
        </label>
      </div>
    ` : ""}
    ${item ? `<button type="button" class="delete-link" onclick="deleteDevItem('${item.id}')">Delete this item</button>` : ""}
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="di-save-btn" onclick="submitDevItem('${activityType}'${item ? `, '${item.id}'` : ""})">Save</button>
    </div>
  `);
}

async function submitDevItem(activityType, itemId) {
  const btn = document.getElementById("di-save-btn");
  const title = document.getElementById("di-title").value.trim();
  const desc = document.getElementById("di-desc").value;
  if (!title) { showToast("Add a title before saving"); return; }

  const isAchievement = activityType === "Achievement";
  const fields = { Title: title, PlanDescription: desc, EmployeeID: me.EmployeeID, ActivityType: activityType };

  if (isAchievement) {
    const achievedVal = document.getElementById("di-achieved").value;
    fields.PlanStatus = "Completed";
    fields.ProgressPercent = 100;
    fields.DateAchieved = achievedVal ? new Date(achievedVal).toISOString() : new Date().toISOString();
  } else {
    fields.PlanStatus = document.getElementById("di-status").value;
    fields.ProgressPercent = parseInt(document.getElementById("di-progress").value, 10);
    const targetVal = document.getElementById("di-target").value;
    if (targetVal) fields.TargetDate = new Date(targetVal).toISOString();
    if (fields.PlanStatus === "Completed") fields.DateAchieved = new Date().toISOString();
  }

  btn.disabled = true;
  btn.textContent = "Saving...";
  try {
    if (itemId) {
      await updateListItemFields(LISTS.developmentPlan, itemId, fields);
    } else {
      await createListItem(LISTS.developmentPlan, fields);
    }
    closeModal();
    showToast("Saved");
    await reopenDevScreen(activityType);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Save";
    showToast("Couldn't save — try again");
  }
}

async function deleteDevItem(itemId) {

  const activityType = item ? item.ActivityType : null;
  try {
    await deleteListItem(LISTS.developmentPlan, itemId);
    closeModal();
    showToast("Deleted");
    if (activityType) await reopenDevScreen(activityType);
  } catch (e) {

}

async function reopenDevScreen(activityType) {
  if (activityType === "Career Goal") await openCareerGoalsScreen();
  else if (activityType === "Development Plan") await openDevelopmentPlanScreen();
  else if (activityType === "Learning") await openLearningScreen();
  else if (activityType === "Achievement") await openAchievementsScreen();
}

/* ============================================================================
   EVIDENCE ATTACHMENTS — shared by Goals and Achievements
   ============================================================================ */
async function handleEvidenceUpload(inputEl, recordType, recordId) {
  const file = inputEl.files[0];
  if (!file) return;
  if (file.size > MAX_UPLOAD_BYTES) { showToast("File too large — max 4MB"); return; }
  showToast("Uploading...");
  try {
    const driveItem = await uploadFileToUserFolder(me.EmployeeID, file);
    await createListItem(LISTS.evidence, {
      Title: driveItem.name,
      EmployeeID: me.EmployeeID,
      RecordType: recordType,
      RecordID: recordId,
      FileName: driveItem.name,
      FileUrl: driveItem.webUrl,
      DriveItemId: driveItem.id,
      UploadedDate: new Date().toISOString()
    });
    showToast("Evidence attached");
    if (recordType === "Goal") await openGoalUpdateModal(recordId);
    else if (recordType === "Achievement") await openDevItemModal("Achievement", recordId);
  } catch (e) {
    showToast("Upload failed — try again");
  }
}

async function removeEvidence(evidenceId, recordType, recordId) {
  try {
    await deleteListItem(LISTS.evidence, evidenceId);
    showToast("Evidence removed");
    if (recordType === "Goal") await openGoalUpdateModal(recordId);
    else if (recordType === "Achievement") await openDevItemModal("Achievement", recordId);
  } catch (e) {
    showToast("Couldn't remove — try again");
  }
}

/* ============================================================================
   SELF-REVIEW WIZARD
   ============================================================================ */
let reviewState = null;

async function openReviewWizard(cycleId) {
  const reviewRows = await getListItems(LISTS.reviews, `fields/CycleID eq '${cycleId}' and fields/EmployeeID eq '${me.EmployeeID}'`);
  const reviewItem = reviewRows[0] || null;

  const criteria = await getListItems(LISTS.reviewCriteria, `fields/RaterType ne 'Manager'`);
  const byStep = {};
  criteria.forEach(c => { (byStep[c.StepNumber] = byStep[c.StepNumber] || []).push(c); });
  Object.values(byStep).forEach(arr => arr.sort((a, b) => (a.DisplayOrder || 0) - (b.DisplayOrder || 0)));
  const stepNumbers = Object.keys(byStep).map(Number).sort((a, b) => a - b);

  if (stepNumbers.length === 0) {
    document.querySelector("nav.tab-bar").style.display = "none";
    ["dashboard", "goals", "feedback", "team", "me"].forEach(t => { document.getElementById(`view-${t}`).style.display = "none"; });
    const el = document.getElementById("view-review");
    el.style.display = "block";
    el.innerHTML = `
      <button class="review-close" onclick="closeReviewWizard()">&larr; Close</button>
      <div class="empty-state">No review criteria are set up for this cycle yet. Check PMS_ReviewCriteria.</div>
    `;
    return;
  }

  const existingResponses = await getListItems(
    LISTS.reviewResponses,
    `fields/CycleID eq '${cycleId}' and fields/EmployeeID eq '${me.EmployeeID}' and fields/RaterType eq 'Self'`
  );
  const answers = {};
  const responseIds = {};
  existingResponses.forEach(r => { answers[r.CriteriaID] = r.Rating; responseIds[r.CriteriaID] = r.id; });

  const isCompleted = reviewItem ? reviewItem.ReviewStatus === "Completed" : false;
  const startStepNum = isCompleted ? stepNumbers[0] : (reviewItem ? (reviewItem.CurrentStep || 1) : 1);
  let stepIndex = stepNumbers.indexOf(startStepNum);
  if (stepIndex === -1) stepIndex = 0;

  reviewState = {
    cycleId, reviewItemId: reviewItem ? reviewItem.id : null, byStep, stepNumbers, stepIndex, answers, responseIds,
    readOnly: isCompleted
  };

  document.querySelector("nav.tab-bar").style.display = "none";
  ["dashboard", "goals", "feedback", "team", "me"].forEach(t => { document.getElementById(`view-${t}`).style.display = "none"; });
  document.getElementById("view-review").style.display = "block";
  renderReviewStep();
}

function renderReviewStep() {
  const stepNum = reviewState.stepNumbers[reviewState.stepIndex];
  const items = reviewState.byStep[stepNum];
  const stepName = items[0].StepName;
  const totalSteps = reviewState.stepNumbers.length;
  const isLastStep = reviewState.stepIndex === totalSteps - 1;

  const el = document.getElementById("view-review");
  el.innerHTML = `
    <button class="review-close" onclick="closeReviewWizard()">&larr; Close</button>
    <p class="review-step-label">Step ${reviewState.stepIndex + 1} of ${totalSteps}${reviewState.readOnly ? " · Submitted" : ""}</p>
    <div class="review-progress-track"><div class="review-progress-fill" style="width:${((reviewState.stepIndex + 1) / totalSteps) * 100}%"></div></div>
    <p class="review-step-title">${stepName}</p>
    <p class="review-step-sub">${reviewState.readOnly ? "Your submitted ratings for this section" : "Rate your performance in the areas below"}</p>
    ${items.map(c => `
      <div class="criterion-row">
        <span class="criterion-label">${c.Title}</span>
        <span class="star-rating">
          ${[1, 2, 3, 4, 5].map(n => `<span class="star ${((reviewState.answers[c.id] || 0) >= n) ? "filled" : ""}" ${reviewState.readOnly ? "" : `onclick="setStarRating('${c.id}', ${n})"`} style="${reviewState.readOnly ? "cursor:default" : ""}">&#9733;</span>`).join("")}
        </span>
      </div>`).join("")}
    ${reviewState.readOnly ? "" : `
    <div class="review-info-box">
      <span>&#9432;</span>
      <span><b>Your input matters</b>Your self review helps you and your manager align on your achievements and growth areas.</span>
    </div>`}
    <div class="review-nav">
      <button class="btn-back" ${reviewState.stepIndex === 0 ? "disabled" : ""} onclick="reviewGoBack()">Back</button>
      <button class="btn-next" id="review-next-btn" onclick="reviewGoNext()">${reviewState.readOnly ? (isLastStep ? "Close" : "Next") : (isLastStep ? "Submit" : "Next")}</button>
    </div>
  `;
}

function setStarRating(criteriaId, value) {
  reviewState.answers[criteriaId] = value;
  renderReviewStep();
}

function reviewGoBack() {
  if (reviewState.stepIndex > 0) {
    reviewState.stepIndex--;
    renderReviewStep();
  }
}

async function reviewGoNext() {
  const totalSteps = reviewState.stepNumbers.length;
  const isLastStep = reviewState.stepIndex === totalSteps - 1;

  if (reviewState.readOnly) {
    if (isLastStep) {
      closeReviewWizard();
    } else {
      reviewState.stepIndex++;
      renderReviewStep();
    }
    return;
  }

  const stepNum = reviewState.stepNumbers[reviewState.stepIndex];
  const items = reviewState.byStep[stepNum];
  const missing = items.some(c => !reviewState.answers[c.id]);
  if (missing) { showToast("Please rate every item before continuing"); return; }

  const btn = document.getElementById("review-next-btn");
  btn.disabled = true;
  btn.textContent = "Saving...";

  try {
    for (const c of items) {
      const rating = reviewState.answers[c.id];
      if (reviewState.responseIds[c.id]) {
        await updateListItemFields(LISTS.reviewResponses, reviewState.responseIds[c.id], {
          Rating: rating, SubmittedDate: new Date().toISOString()
        });
      } else {
        const created = await createListItem(LISTS.reviewResponses, {
          Title: "Response", CycleID: reviewState.cycleId, EmployeeID: me.EmployeeID,
          CriteriaID: c.id, RaterType: "Self", RaterEmployeeID: me.EmployeeID,
          Rating: rating, SubmittedDate: new Date().toISOString()
        });
        reviewState.responseIds[c.id] = created.id;
      }
    }

    if (isLastStep) {
      const allRatings = Object.values(reviewState.answers);
      const overall = allRatings.length ? allRatings.reduce((s, r) => s + r, 0) / allRatings.length : null;
      const finalSelfRating = overall != null ? Math.round(overall * 10) / 10 : null;
      if (reviewState.reviewItemId) {
        await updateListItemFields(LISTS.reviews, reviewState.reviewItemId, {
          CurrentStep: totalSteps,
          ReviewStatus: "Completed",
          CompletionPercent: 100,
          OverallRating: finalSelfRating,
          SelfOverallRating: finalSelfRating
        });
      }
      closeReviewWizard();
      showToast("Self review submitted");
      renderedTabs.delete("dashboard");
      await renderDashboard();
    } else {
      const nextStepNum = reviewState.stepNumbers[reviewState.stepIndex + 1];
      if (reviewState.reviewItemId) {
        await updateListItemFields(LISTS.reviews, reviewState.reviewItemId, {
          CurrentStep: nextStepNum,
          ReviewStatus: "In Progress",
          CompletionPercent: Math.round(((reviewState.stepIndex + 1) / totalSteps) * 100)
        });
      }
      reviewState.stepIndex++;
      renderReviewStep();
    }
  } catch (e) {
    showToast("Couldn't save — try again");
    const stillThere = document.getElementById("review-next-btn");
    if (stillThere) {
      stillThere.disabled = false;
      stillThere.textContent = reviewState.stepIndex === reviewState.stepNumbers.length - 1 ? "Submit" : "Next";
    }
  }
}

function closeReviewWizard() {
  document.getElementById("view-review").style.display = "none";
  document.querySelector("nav.tab-bar").style.display = "";
  reviewState = null;
  switchTab("dashboard");
}

/* ============================================================================
   MANAGER REVIEW WIZARD
   ============================================================================ */
function managerReviewPanelHtml(review, employeeId) {
  if (!review) return `<div class="empty-state">No review cycle assigned yet.</div>`;
  if (review.ReviewStatus !== "Completed") {
    return `<div class="panel"><p style="font-size:12px;color:var(--text-muted);margin:0">Waiting for their self review to be completed before you can add your assessment.</p></div>`;
  }
  const mgrStatus = review.ManagerReviewStatus || "Not Started";
  const label = mgrStatus === "Completed" ? "View Summary" : (mgrStatus === "In Progress" ? "Continue Manager Review" : "Start Manager Review");
  return `
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${review.SelfOverallRating != null ? 4 : 10}px">
        <div>
          <p style="font-size:20px;font-weight:800;margin:0">${review.ManagerOverallRating != null ? review.ManagerOverallRating.toFixed(1) : "—"} <span style="font-size:12px;font-weight:600;color:var(--text-muted)">/5</span></p>
          <p style="font-size:12px;color:var(--text-muted);margin:2px 0 0">${ratingWord(review.ManagerOverallRating)}</p>
        </div>
        <span class="status-chip" style="background:var(--amber-l);color:var(--amber-d)">${mgrStatus}</span>
      </div>
      ${review.SelfOverallRating != null ? `<p style="font-size:11px;color:var(--text-muted);margin:0 0 10px">They rated themselves <b style="color:var(--text-primary)">${review.SelfOverallRating.toFixed(1)}</b></p>` : ""}
      <button type="button" class="continue-btn" onclick="openManagerReviewWizard('${review.CycleID}', '${employeeId}')">${label}</button>
    </div>
  `;
}

let mrState = null;

async function openManagerReviewWizard(cycleId, employeeId) {
  const reviewRows = await getListItems(LISTS.reviews, `fields/CycleID eq '${cycleId}' and fields/EmployeeID eq '${employeeId}'`);
  const reviewItem = reviewRows[0] || null;

  const criteria = await getListItems(LISTS.reviewCriteria, `fields/RaterType ne 'Self'`);
  const byStep = {};
  criteria.forEach(c => { (byStep[c.StepNumber] = byStep[c.StepNumber] || []).push(c); });
  Object.values(byStep).forEach(arr => arr.sort((a, b) => (a.DisplayOrder || 0) - (b.DisplayOrder || 0)));
  const stepNumbers = Object.keys(byStep).map(Number).sort((a, b) => a - b);

  if (stepNumbers.length === 0) {
    document.querySelector("nav.tab-bar").style.display = "none";
    document.getElementById("view-person-detail").style.display = "none";
    const el = document.getElementById("view-review");
    el.style.display = "block";
    el.innerHTML = `
      <button class="review-close" onclick="closeManagerReviewWizard()">&larr; Close</button>
      <div class="empty-state">No manager review criteria are set up for this cycle yet. Check PMS_ReviewCriteria.</div>
    `;
    return;
  }

  const selfResponses = await getListItems(
    LISTS.reviewResponses,
    `fields/CycleID eq '${cycleId}' and fields/EmployeeID eq '${employeeId}' and fields/RaterType eq 'Self'`
  );
  const selfAnswers = {};
  selfResponses.forEach(r => { selfAnswers[r.CriteriaID] = r.Rating; });

  const mgrResponses = await getListItems(
    LISTS.reviewResponses,
    `fields/CycleID eq '${cycleId}' and fields/EmployeeID eq '${employeeId}' and fields/RaterType eq 'Manager' and fields/RaterEmployeeID eq '${me.EmployeeID}'`
  );
  const managerAnswers = {};
  const responseIds = {};
  mgrResponses.forEach(r => { managerAnswers[r.CriteriaID] = r.Rating; responseIds[r.CriteriaID] = r.id; });

  const isCompleted = reviewItem ? reviewItem.ManagerReviewStatus === "Completed" : false;
  const startStepNum = isCompleted ? stepNumbers[0] : (reviewItem && reviewItem.ManagerCurrentStep ? reviewItem.ManagerCurrentStep : stepNumbers[0]);
  let stepIndex = stepNumbers.indexOf(startStepNum);
  if (stepIndex === -1) stepIndex = 0;

  mrState = {
    cycleId, employeeId, reviewItemId: reviewItem ? reviewItem.id : null,
    byStep, stepNumbers, stepIndex, selfAnswers, managerAnswers, responseIds, readOnly: isCompleted
  };

  document.querySelector("nav.tab-bar").style.display = "none";
  document.getElementById("view-person-detail").style.display = "none";
  document.getElementById("view-review").style.display = "block";
  renderManagerReviewStep();
}

function renderManagerReviewStep() {
  const stepNum = mrState.stepNumbers[mrState.stepIndex];
  const items = mrState.byStep[stepNum];
  const stepName = items[0].StepName;
  const totalSteps = mrState.stepNumbers.length;
  const isLastStep = mrState.stepIndex === totalSteps - 1;

  const el = document.getElementById("view-review");
  el.innerHTML = `
    <button class="review-close" onclick="closeManagerReviewWizard()">&larr; Close</button>
    <p class="review-step-label">Step ${mrState.stepIndex + 1} of ${totalSteps}${mrState.readOnly ? " · Submitted" : ""}</p>
    <div class="review-progress-track"><div class="review-progress-fill" style="width:${((mrState.stepIndex + 1) / totalSteps) * 100}%"></div></div>
    <p class="review-step-title">${stepName}</p>
    <p class="review-step-sub">${mrState.readOnly ? "Your submitted manager ratings" : "Rate this section as their manager"}</p>
    ${items.map(c => {
      const selfVal = mrState.selfAnswers[c.id];
      const mgrVal = mrState.managerAnswers[c.id] || 0;
      return `
      <div class="criterion-row" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="criterion-label">${c.Title}</span>
          <span class="star-rating">
            ${[1, 2, 3, 4, 5].map(n => `<span class="star ${(mgrVal >= n) ? "filled" : ""}" ${mrState.readOnly ? "" : `onclick="setManagerStarRating('${c.id}', ${n})"`} style="${mrState.readOnly ? "cursor:default" : ""}">&#9733;</span>`).join("")}
          </span>
        </div>
        ${c.RaterType === "Both" ? `<p style="font-size:10.5px;color:var(--text-muted);margin:3px 0 0">Self-rated: ${selfVal != null ? selfVal + "/5" : "not rated"}</p>` : ""}
      </div>`;
    }).join("")}
    ${mrState.readOnly ? "" : `
    <div class="review-info-box">
      <span>&#9432;</span>
      <span><b>Compare and reflect</b>Where your rating differs from their self-rating, that's worth discussing directly.</span>
    </div>`}
    <div class="review-nav">
      <button class="btn-back" ${mrState.stepIndex === 0 ? "disabled" : ""} onclick="managerReviewGoBack()">Back</button>
      <button class="btn-next" id="review-next-btn" onclick="managerReviewGoNext()">${mrState.readOnly ? (isLastStep ? "Close" : "Next") : (isLastStep ? "Submit" : "Next")}</button>
    </div>
  `;
}

function setManagerStarRating(criteriaId, value) {
  mrState.managerAnswers[criteriaId] = value;
  renderManagerReviewStep();
}

function managerReviewGoBack() {
  if (mrState.stepIndex > 0) {
    mrState.stepIndex--;
    renderManagerReviewStep();
  }
}

async function managerReviewGoNext() {
  const totalSteps = mrState.stepNumbers.length;
  const isLastStep = mrState.stepIndex === totalSteps - 1;

  if (mrState.readOnly) {
    if (isLastStep) { closeManagerReviewWizard(); } else { mrState.stepIndex++; renderManagerReviewStep(); }
    return;
  }

  const stepNum = mrState.stepNumbers[mrState.stepIndex];
  const items = mrState.byStep[stepNum];
  const missing = items.some(c => !mrState.managerAnswers[c.id]);
  if (missing) { showToast("Please rate every item before continuing"); return; }

  const btn = document.getElementById("review-next-btn");
  btn.disabled = true;
  btn.textContent = "Saving...";

  try {
    for (const c of items) {
      const rating = mrState.managerAnswers[c.id];
      if (mrState.responseIds[c.id]) {
        await updateListItemFields(LISTS.reviewResponses, mrState.responseIds[c.id], {
          Rating: rating, SubmittedDate: new Date().toISOString()
        });
      } else {
        const created = await createListItem(LISTS.reviewResponses, {
          Title: "Response", CycleID: mrState.cycleId, EmployeeID: mrState.employeeId,
          CriteriaID: c.id, RaterType: "Manager", RaterEmployeeID: me.EmployeeID,
          Rating: rating, SubmittedDate: new Date().toISOString()
        });
        mrState.responseIds[c.id] = created.id;
      }
    }

    if (isLastStep) {
      const allRatings = Object.values(mrState.managerAnswers);
      const overall = allRatings.length ? allRatings.reduce((s, r) => s + r, 0) / allRatings.length : null;
      const finalRating = overall != null ? Math.round(overall * 10) / 10 : null;
      if (mrState.reviewItemId) {
        await updateListItemFields(LISTS.reviews, mrState.reviewItemId, {
          ManagerCurrentStep: totalSteps,
          ManagerReviewStatus: "Completed",
          ManagerCompletionPercent: 100,
          ManagerOverallRating: finalRating,
          OverallRating: finalRating
        });
      }
      closeManagerReviewWizard();
      showToast("Manager review submitted");
    } else {
      const nextStepNum = mrState.stepNumbers[mrState.stepIndex + 1];
      if (mrState.reviewItemId) {
        await updateListItemFields(LISTS.reviews, mrState.reviewItemId, {
          ManagerCurrentStep: nextStepNum,
          ManagerReviewStatus: "In Progress",
          ManagerCompletionPercent: Math.round(((mrState.stepIndex + 1) / totalSteps) * 100)
        });
      }
      mrState.stepIndex++;
      renderManagerReviewStep();
    }
  } catch (e) {
    showToast("Couldn't save — try again");
    const stillThere = document.getElementById("review-next-btn");
    if (stillThere) {
      stillThere.disabled = false;
      stillThere.textContent = isLastStep ? "Submit" : "Next";
    }
  }
}

function closeManagerReviewWizard() {
  const employeeId = mrState ? mrState.employeeId : null;
  document.getElementById("view-review").style.display = "none";
  mrState = null;
  if (employeeId) {
    openPersonDetail(employeeId, personDetailContext ? personDetailContext.isDirectReport : true);
  } else {
    document.querySelector("nav.tab-bar").style.display = "";
    switchTab("team");
  }
}

/* ============================================================================
   APP SHELL
   ============================================================================ */
const renderedTabs = new Set();

async function showApp() {
  document.getElementById("signin-screen").style.display = "none";
  document.getElementById("app-wrap").style.display = "block";
  document.getElementById("app-main").style.display = "block";

  try {
    await resolveCurrentEmployee();
  } catch (e) {
    document.getElementById("app-main").innerHTML = `<div class="error-state">${e.message}</div>`;
    return;
  }

  await renderDashboard();
  renderedTabs.add("dashboard");

  ["dashboard", "goals", "feedback", "team", "me"].forEach(tab => {
    document.getElementById(`tab-${tab}`).addEventListener("click", () => switchTab(tab));
  });
}

async function switchTab(tab) {
  ["dashboard", "goals", "feedback", "team", "me"].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle("active", t === tab);
    document.getElementById(`view-${t}`).style.display = t === tab ? "block" : "none";
  });
  if (!renderedTabs.has(tab)) {
    renderedTabs.add(tab);
    if (tab === "goals") await renderGoals();
    if (tab === "feedback") await renderFeedback();
    if (tab === "team") await renderTeam();
    if (tab === "me") renderMe();
  }
}
